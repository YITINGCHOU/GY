      question: `請敘述癱瘓網路服務的三種常見手法。（10分）`,
      answer: `癱瘓網路服務（使服務無法正常提供，破壞「可用性」）的常見攻擊手法：

**1. 阻斷服務攻擊（DoS, Denial of Service）**

攻擊者利用「單一來源」對目標伺服器發送「大量請求」或「異常封包」，耗盡目標的網路頻寬、運算資源、連線數，使其無法回應正常使用者的服務請求。
- 例：SYN Flood —— 大量發送 TCP 連線請求（SYN）但不完成三次握手，耗盡伺服器的連線資源。
- 例：Ping Flood —— 持續發送大量 ICMP 封包淹沒目標。

**2. 分散式阻斷服務攻擊（DDoS, Distributed Denial of Service）**

DoS 的進階形式。攻擊者先入侵控制大量電腦（組成「殭屍網路 Botnet」），再「同時」操控這些殭屍主機從「多個分散的來源」對單一目標發動攻擊。
- 攻擊流量龐大且來源分散，難以單純靠封鎖某 IP 來防禦。
- 威力遠大於 DoS，是癱瘓大型網站、服務的主要手法。
- 例：放大攻擊（Amplification）—— 利用 DNS、NTP 等協定的特性，以小請求觸發大回應流量灌向受害者。

**3. 惡意程式攻擊（Malware）**

透過病毒、蠕蟲（Worm）、勒索軟體（Ransomware）等惡意程式破壞或佔用系統資源，使服務中斷。
- 蠕蟲：自我複製並大量散播，消耗網路頻寬與主機資源，造成網路壅塞與系統癱瘓。
- 勒索軟體：加密系統檔案或資料，使系統與服務無法運作。
- 邏輯炸彈、系統破壞型病毒：直接破壞系統檔案或設定。

**其他常見手法（補充）**
- **應用層攻擊**：針對網站應用程式的特定弱點發送耗資源的請求（如大量複雜查詢拖垮資料庫）。
- **實體破壞 / 環境攻擊**：破壞網路線路、電力、伺服器硬體。

**共同點**：上述手法都以破壞服務的「可用性（Availability）」為目標 —— 讓合法使用者無法在需要時取得正常服務。防禦對策包括防火牆、流量清洗、入侵偵測、頻寬擴充、CDN 分流、定期備份與防毒等。`,

**T1 違反第三正規化（3NF）。**（T1 已符合 1NF、2NF —— 單一主鍵無部分相依，但有遞移相依故不符 3NF。）

**新增異常（Insertion Anomaly）**

- *方法二*：居住地與區域被拆散在不同表，根本無法獨立記錄「居住地-區域」的對應關係 → 不僅有異常，更是「資訊遺失」。

      answer: `**(一) Web 2.0（5分）**

Web 2.0 是相對於傳統 Web 1.0 的網際網路發展概念。Web 1.0 以「網站單向發布、使用者被動瀏覽」為主；**Web 2.0 則強調「使用者參與、互動與內容共創」**。

特徵：使用者「自製內容（User-Generated Content）」、雙向互動、社群協作、資訊分享。網站成為「平台」，價值來自群眾的集體參與。代表應用：部落格、Wiki、社群網站、影音分享平台、RSS 訂閱、標籤（tagging）。核心精神是「群眾智慧」與「參與式網路」。

**(二) ISMS（5分）**

ISMS（Information Security Management System，資訊安全管理系統）是組織用來「**有系統地管理資訊安全**」的一套管理框架與制度。

它以風險管理為核心，透過建立資安政策、進行風險評鑑與處理、實施控制措施、持續監控與改善（PDCA 循環），全面保護組織資訊資產的「機密性、完整性、可用性」。國際標準 **ISO 27001** 即為 ISMS 的驗證標準。ISMS 不只是技術，更涵蓋管理制度、流程與人員。

**(三) Intrusion Detection System（5分）**

IDS（Intrusion Detection System，入侵偵測系統）是一種「**監控網路或主機活動，偵測可疑行為或攻擊並發出警報**」的資安防護機制。

它持續分析網路流量或系統日誌，比對是否有符合攻擊特徵（特徵式偵測）或偏離正常模式（異常式偵測）的行為，一旦發現入侵跡象即通知管理者。
- 分類：網路型 IDS（NIDS，監控網路流量）、主機型 IDS（HIDS，監控單一主機）。
- IDS 屬「被動偵測與告警」；若能「主動阻擋」攻擊則稱為 IPS（入侵防禦系統）。

**(四) Knowledge Management（5分）**

KM（Knowledge Management，知識管理）指組織「**有系統地創造、蓄積、分享、運用知識**」以提升競爭力與創新能力的管理活動與流程。

      answer: `**(一) 何謂 ERP（企業資源規劃）**

ERP（Enterprise Resource Planning，企業資源規劃）是一套「**整合企業內部各功能部門營運流程與資訊**」的資訊系統。

它將原本各自獨立的採購、生產、銷售、財務會計、人力資源、庫存管理等模組，整合在「**單一的共用資料庫**」之上，使各部門的資料即時互通、流程彼此串接。

ERP 的核心精神：
- **整合性**：打破部門資訊孤島，全企業資料一致、即時共享。
- **資料一次輸入**：避免重複輸入與資料不一致。
- **流程最佳化**：以標準化、最佳化的流程運作。
- **支援決策**：提供整合的營運資訊，作為管理決策依據。

導入 ERP 可提升企業營運效率、降低成本、加快回應速度、強化整體競爭力。常見系統如 SAP、Oracle ERP。

**(二) 何謂資訊系統委外（IS Outsourcing）**

資訊系統委外（Information System Outsourcing）指企業將「**原本由內部資訊部門負責的資訊系統相關工作，部分或全部委託給外部專業廠商**」來執行或管理。

委外的範圍可包括：系統開發、系統維護、軟硬體設備管理、網路維運、資料中心營運、技術支援、甚至整個 IT 部門功能。

*委外的優點*：
- 降低成本（不需自行養專業團隊與設備）。
- 借重外部廠商的專業技術與經驗。
- 企業可專注於「核心業務」。
- 因應人力與技術需求的彈性。

*委外的缺點與風險*：
- 對外部廠商產生依賴。

- 服務品質與溝通協調的管理難度。
- 內部技術能力可能逐漸流失。

      answer: `**(一) 何謂無線網路（5分）**

無線網路（Wireless Network）指「**不使用實體線纜（網路線），而是利用無線電波、紅外線等無線傳輸媒介，來傳遞資料、連接網路裝置**」的網路。

相較於有線網路，無線網路讓裝置擺脫線材的束縛，具備「**行動性（mobility）、佈建彈性、易於擴充**」等優點 —— 使用者可在訊號涵蓋範圍內自由移動並保持連線。常見技術如 Wi-Fi、藍牙、行動通訊（4G/5G）等。

**(二) 無線網路的組成架構種類（15分）**

無線網路依「**涵蓋範圍**」可分為下列幾種：

**1. 無線個人區域網路（WPAN, Wireless Personal Area Network）**
- 涵蓋範圍最小，約在「個人周邊、數公尺內」。
- 用於個人裝置之間的短距離連接。
- 代表技術：藍牙（Bluetooth）、ZigBee、NFC、紅外線（IrDA）。
- 應用：無線耳機、無線滑鼠鍵盤、手機與穿戴裝置配對。

**2. 無線區域網路（WLAN, Wireless Local Area Network）**
- 涵蓋範圍中等，約在「一棟建築物、辦公室、家庭、校園」內（數十至數百公尺）。
- 代表技術：Wi-Fi（IEEE 802.11 系列標準）。
- 組成元件：無線存取點（Access Point, AP）、無線網卡。
- 兩種運作模式：
  - **基礎架構模式（Infrastructure Mode）**：裝置透過 AP 連接網路，AP 作為集中管理點。
  - **隨意網路模式（Ad-Hoc Mode）**：裝置之間「點對點」直接通訊，不需 AP。

**3. 無線都會區域網路（WMAN, Wireless Metropolitan Area Network）**
- 涵蓋範圍較大，約在「一個城市、都會區」的範圍。
- 代表技術：WiMAX（IEEE 802.16）。
- 應用：跨建築物、城市範圍的無線寬頻連接。

**4. 無線廣域網路（WWAN, Wireless Wide Area Network）**
- 涵蓋範圍最大，可達「跨城市、跨國家」的廣大區域。
- 代表技術：行動通訊網路 —— 2G、3G、4G LTE、5G。
- 透過電信業者建置的基地台（Base Station）提供大範圍涵蓋。
- 應用：手機行動上網、行動裝置在大範圍移動中保持連線。

      question: `試述系統發展生命週期(System Development Life Cycle, SDLC)（7分）、雛型軟體開發模式(Prototyping Model)（7分）、改良式的生命週期模式（6分）為何？`,
      answer: `**(一) 系統發展生命週期 SDLC（7分）**

SDLC（System Development Life Cycle）指軟體系統「從規劃到上線維護」的整個發展過程，將系統開發切分為數個依序進行的「階段」，又稱「**瀑布模式（Waterfall Model）**」。

典型五階段：
1. **系統規劃**：確認需求動機、進行可行性評估、訂定開發計畫。
2. **系統分析**：深入了解使用者需求，分析現況、建立邏輯模型（如 DFD、ERD）。
3. **系統設計**：將分析結果轉化為實體設計（程式架構、資料庫、介面設計）。
4. **系統建置（實作與測試）**：撰寫程式、進行單元測試、整合測試、系統測試。
5. **系統維護**：系統上線後的修正、調整、功能擴充。

*特性*：階段分明、循序進行、文件完整。
*優點*：流程清楚、易於管理與控制。
*缺點*：較缺彈性，前期一旦需求定錯，後期才發現修改成本極高；使用者要到後期才看到成品。

**(二) 雛型軟體開發模式 Prototyping Model（7分）**

雛型法指「**先快速建立一個系統的『雛型（prototype，初步、簡化的可運作版本）』，讓使用者實際操作與檢視，再根據回饋反覆修改**」的開發模式。

流程：快速建立雛型 → 使用者試用與評估 → 蒐集回饋 → 修改雛型 → 再評估……反覆循環，直到雛型符合使用者期望，再據以發展正式系統。

*優點*：
- 使用者「提早」看到並操作系統，需求溝通更明確。
- 能及早發現需求誤解，降低後期重做的風險。
- 適合「需求不明確、不易事先完整定義」的專案。

*缺點*：
- 反覆修改可能使專案範圍與時程不易控制。
- 使用者可能誤把「雛型」當成「成品」而期望過高。
- 為求快速，雛型的架構與品質可能不夠嚴謹。

**(三) 改良式的生命週期模式（6分）**

「改良式生命週期模式」指針對傳統瀑布式 SDLC 缺乏彈性、無法及早回應需求變動的缺點，所提出的各種「**改良、彈性化**」的開發模式。常見的有：

1. **螺旋模式（Spiral Model）**：結合瀑布模式與雛型法，並「**以風險管理為核心**」。開發過程像螺旋般反覆循環，每一圈都進行「規劃 → 風險分析 → 開發 → 評估」，逐圈精煉，特別適合大型、高風險專案。

2. **漸增模式（Incremental Model）**：將系統切分成多個「**功能增量（increment）**」，分批開發與交付。每次交付一部分可用的功能，逐步累積成完整系統。使用者能提早使用部分功能。

3. **反覆模式（Iterative Model）**：以「**反覆迭代**」方式開發，每一輪迭代都產出一個更完整的版本，逐步精進。

4. **敏捷式開發（Agile）**：強調「快速迭代、擁抱變化、持續交付、重視團隊溝通與使用者協作」，以短週期（Sprint）反覆開發。

*共同精神*：相較於傳統瀑布模式「一次到位、線性不可逆」，改良式模式都強調「**反覆、漸進、彈性、及早回饋、風險控管**」，使開發過程能更靈活地因應需求變動，降低專案失敗風險。`,

      question: `請說明資料(data)、資料庫(database)、資料倉儲(data warehouse)、資料探勘(data mining)的關係，並舉例說明資料探勘如何應用在超級市場？（30分）`,
      answer: `**四者的定義與層次關係**

這四個概念呈現「**由原始素材逐層加值，最終萃取出有用知識**」的關係：

**1. 資料（Data）**
資料是「未經處理的原始事實、數字、文字、記錄」，本身缺乏脈絡與意義。
- 例：超市的一筆交易紀錄「會員A、商品X、5月1日、數量2」。
- 資料是最基礎的素材，單獨來看價值有限。

**2. 資料庫（Database）**
資料庫是「**有系統地組織、儲存、管理資料的集合**」，由資料庫管理系統（DBMS）控管。
- 它將大量資料以結構化方式（資料表）儲存，支援新增、查詢、修改、刪除。
- 主要服務「**日常營運交易（OLTP）**」—— 例：超市的 POS 系統即時記錄每筆交易。
- 特性：資料即時、針對日常作業、處理當前的交易。

**3. 資料倉儲（Data Warehouse）**
資料倉儲是「**為了『分析與決策』而建立的大型資料儲存庫**」，匯集來自多個資料庫與來源的歷史資料。
- 它將分散的營運資料經「萃取、轉換、載入（ETL）」整合後集中存放。
- 主要服務「**分析決策（OLAP）**」—— 而非日常交易。
- 特性：整合性、主題導向、儲存大量歷史資料、不常變動、供分析使用。
- 例：超市將多年、各分店的銷售資料整合進資料倉儲，供分析趨勢。

**4. 資料探勘（Data Mining）**
資料探勘是「**運用統計、機器學習等技術，從大量資料（通常來自資料倉儲）中，挖掘出『隱藏的、有價值的模式、關聯與知識』**」的過程。
- 它是「分析的工具與技術」—— 找出人工難以察覺的規律。
- 常見技術：關聯規則、分類、集群、預測。

**四者的關係總結**

\`\`\`
原始資料 (Data)
    │ 有系統地組織儲存
    ▼
資料庫 (Database) ── 服務日常營運交易 (OLTP)
    │ 多來源整合、ETL、累積歷史
    ▼
資料倉儲 (Data Warehouse) ── 服務分析決策 (OLAP)
    │ 運用探勘技術挖掘
    ▼
資料探勘 (Data Mining) ── 萃取出「知識與洞察」
\`\`\`

層次關係：**資料**是原料 → **資料庫**有系統地儲存資料、支援營運 → **資料倉儲**整合大量歷史資料、支援分析 → **資料探勘**從中挖掘出有價值的知識。一層一層加值，從「資料」最終轉化為「可用於決策的知識」。

**資料探勘在超級市場的應用舉例**

**1. 購物籃分析（關聯規則探勘）— 最經典的例子**
- 從大量交易資料中找出「**哪些商品經常被一起購買**」。
- 經典案例「**啤酒與尿布**」：探勘發現週末傍晚買尿布的男性顧客，常同時購買啤酒。
- 應用：將關聯性高的商品「**陳列在鄰近位置**」、設計「**搭配促銷組合**」、規劃「**交叉銷售**」，提升客單價。

**2. 顧客分群（集群分析）**
- 依消費金額、頻率、購買品項等，將會員自動分成不同族群（如高消費常客、價格敏感型、節慶採購型）。
- 應用：針對不同族群設計「**差異化的行銷策略與優惠**」。

**3. 銷售預測（預測分析）**
- 分析歷史銷售資料，結合季節、天氣、節慶等因素，預測各商品的未來需求量。
- 應用：「**最佳化庫存與進貨**」，避免缺貨或囤積，降低成本。

**4. 顧客流失分析（分類預測）**
- 分析顧客行為模式，預測「**哪些會員可能即將流失**」。
- 應用：對高流失風險的顧客主動提供優惠、加強關懷，提升留存率。

**5. 促銷活動成效分析**
- 探勘促銷前後的銷售變化，評估「**哪些促銷方式最有效**」。
- 應用：優化未來的行銷資源配置。

**結語**：超市透過 POS 系統累積大量交易「資料」並存入「資料庫」，再整合進「資料倉儲」，最後運用「資料探勘」挖掘出購物關聯、顧客輪廓、需求趨勢等知識，將原本沉睡的資料轉化為提升營收、優化營運的具體決策依據。`,

      question: `何謂策略資訊系統(Strategic Information Systems, SIS)（5分）？請舉 2 例說明 SIS 應用類型（5分）；並繪圖說明以 Porter 的五種競爭力模式尋找 SIS 機會的途徑（10分）。`,
      answer: `**(一) 何謂策略資訊系統 SIS（5分）**

策略資訊系統（Strategic Information Systems, SIS）指「**能幫助企業取得或維持『競爭優勢』的資訊系統**」。

與一般支援日常營運的交易處理系統不同，SIS 著眼於「**策略層次**」—— 它直接協助企業改變競爭規則、創造差異化、降低成本、或鞏固市場地位，使企業在產業競爭中勝出。SIS 的價值不在於提升內部效率，而在於「**形成競爭武器**」。

**(二) SIS 應用類型舉例（5分）**

1. **降低成本型**：運用資訊系統大幅降低營運成本，取得成本領導優勢。
   - 例：大型零售商建置自動化供應鏈與庫存管理系統，降低物流與庫存成本，得以用更低價格競爭。

2. **產品差異化型 / 提高顧客轉換成本型**：運用資訊系統創造獨特服務，使顧客難以轉向競爭者。
   - 例：航空公司的「**訂位與常客飛行哩程系統**」—— 顧客累積的哩程與會員權益使其不願更換航空公司，提高轉換成本、鞏固顧客。
   - 例：銀行 ATM 網路、線上銀行服務，以便利的差異化服務吸引並綁住顧客。

**(三) 以 Porter 五力模式尋找 SIS 機會（10分）**

Porter 的五種競爭力模式分析產業競爭結構，企業可針對「每一種競爭力」運用資訊系統來因應，從而找到 SIS 的機會：

\`\`\`htmldiagram

    <div class="dg-box ink" style="min-width:8rem;">產業內現有<br>競爭者的對抗</div>

  <div class="dg-arrow v" style="transform:rotate(-90deg);"></div>
  <div class="dg-box blue">替代品的威脅<div class="dg-sub">Substitutes</div></div>
</div>
\`\`\`

針對五種競爭力尋找 SIS 機會的途徑：

**1. 對抗「現有競爭者」**
- 以資訊系統降低成本（成本領導）、創造產品/服務差異化，取得競爭優勢。
- 例：建置高效率的營運系統，以更低成本或更佳服務勝過同業。

**2. 提高「潛在進入者」的進入障礙**
- 建置需要大量投資的資訊系統，使新進者因技術與成本門檻而卻步。
- 例：建立龐大的訂位網路或會員系統，形成新業者難以複製的進入障礙。

**3. 降低「供應商的議價能力」**
- 建置電子採購系統、供應鏈管理系統，整合多家供應商、增加比價與選擇的能力。
- 例：以電子交易市集連結眾多供應商，降低對單一供應商的依賴。

**4. 降低「購買者（顧客）的議價能力」、提高轉換成本**
- 以資訊系統提供獨特、便利的服務，使顧客「黏著」於企業，不易轉向競爭者。

**5. 對抗「替代品的威脅」**
- 運用資訊科技開發新產品/服務、強化現有產品價值，降低被替代品取代的風險。
- 例：以資訊加值服務提升產品差異性，使替代品難以取代。

**結論**：企業透過 Porter 五力模式逐一檢視產業競爭結構，針對「最具威脅的競爭力」設計對應的策略資訊系統 —— 不論是築起進入障礙、削弱供應商或顧客的議價力、抵禦替代品，或直接強化對現有競爭者的優勢，都能找到運用 SIS 取得競爭優勢的途徑。`,

      score: 20,
      question: `請詳述系統開發生命週期(system development life cycle)各階段（規劃、分析、設計、建置及維護）中，資料庫開發的活動各為何？（20分）`,
      answer: `系統開發生命週期（SDLC）的五個階段中，「資料庫開發」各有對應的活動：

**1. 規劃階段（Planning）**

資料庫開發活動：
- **資料庫專案規劃**：界定資料庫開發的範圍與目標。
- **初步資料需求調查**：概略了解組織需要哪些資料、資料量規模。
- **可行性評估**：評估資料庫建置的技術可行性、成本效益。
- **訂定計畫**：擬定資料庫開發的時程、資源與人力規劃。

**2. 分析階段（Analysis）**

此階段建立資料的「**概念模型（Conceptual Model）**」，關注「需要什麼資料」：
- **需求蒐集與分析**：深入訪談使用者，詳細了解資料需求、業務規則。
- **建立概念資料模型**：繪製「**實體關係圖（ERD）**」—— 識別實體、屬性、實體間的關係。
- **建立資料字典**：定義各資料元素的意義與規格。
- 此階段不涉及特定資料庫產品，著重「邏輯上需要什麼資料」。

**3. 設計階段（Design）**

此階段將概念模型轉化為「**邏輯與實體設計**」，關注「資料如何組織與儲存」：
- **邏輯資料庫設計**：將 ERD 轉換為「關聯式資料表」的結構（資料表、欄位、主鍵、外來鍵）。
- **正規化（Normalization）**：對資料表進行 1NF~3NF 正規化，消除資料冗餘與異常。
- **實體資料庫設計**：決定實際儲存細節 —— 選定 DBMS、設計索引（index）、規劃儲存空間、設定存取路徑以提升效能。
- **設計資料完整性與安全機制**：定義限制條件、存取權限。

**4. 建置階段（Implementation / Construction）**

此階段「**實際建立並啟用資料庫**」：
- **建立資料庫**：以 DDL（資料定義語言，如 CREATE TABLE）依設計建立資料表、索引、檢視表。
- **資料載入 / 轉移**：將既有資料（從舊系統或來源）匯入新資料庫。
- **撰寫資料庫程式**：開發 SQL 查詢、預存程序、觸發程序等。
- **資料庫測試**：測試資料的正確性、完整性限制、查詢效能、安全控管。
- **建立備份與復原機制**。

**5. 維護階段（Maintenance）**

此階段於資料庫上線後「**持續維護與調校**」：
- **效能調校（Tuning）**：監控資料庫效能，調整索引、查詢、儲存配置以維持效率。
- **資料庫維護**：修正錯誤、調整結構以因應需求變動（如新增欄位、資料表）。
- **備份與復原**：定期執行資料備份，必要時進行災難復原。
- **安全管理**：管理使用者權限、監控存取、維護資料安全。
- **容量管理**：監控資料成長，適時擴充儲存空間。

**總結**：資料庫開發貫穿整個 SDLC —— 規劃階段「定範圍」、分析階段「建概念模型(ERD)」、設計階段「做邏輯/實體設計與正規化」、建置階段「實際建立、載入、測試」、維護階段「調校與持續維護」。各階段環環相扣，逐步將資料需求轉化為穩定高效的實體資料庫。`,

      question: `請說明資料庫正規化(Normalization)的目的與步驟（10分）；並以銷售人員檔（未經正規化）為例，完成一階、二階與三階正規化（10分）。
銷售人員檔欄位：銷售員編號、銷售員姓名、銷售站、地區、產品號碼、產品名稱、價格、數量。`,
      answer: `**(一) 正規化的目的與步驟（10分）**

*正規化的目的*：
正規化（Normalization）是「將資料表結構逐步分解、調整，使其更合理、更有系統」的過程。主要目的：
1. **消除資料冗餘（Redundancy）**：避免相同資料重複儲存，節省空間。
2. **消除資料異常（Anomaly）**：消除「新增異常、刪除異常、修改異常」三種問題。
3. **維護資料一致性與完整性**：使資料正確、不矛盾。
4. **使資料庫結構更具彈性**，易於維護與擴充。

*正規化的步驟*（逐階進行）：
- **第一正規化（1NF）**：消除「重複群」，使每個欄位都是「單一原子值」，並確立主鍵。
- **第二正規化（2NF）**：在符合 1NF 的基礎上，消除「部分相依」，非鍵屬性必須完全相依於整個主鍵。
- **第三正規化（3NF）**：在符合 2NF 的基礎上，消除「遞移相依」，非鍵屬性不能相依於其他非鍵屬性。

**(二) 銷售人員檔正規化範例（10分）**

**原始未正規化的「銷售人員檔」**（一個銷售員賣多項產品，產品相關欄位形成重複群）

| 銷售員編號 | 銷售員姓名 | 銷售站 | 地區 | 產品號碼 | 產品名稱 | 價格(萬元) | 數量 |
|---|---|---|---|---|---|---|---|
| A1 | 張三 | 中正 | 台北 | DEV04 / DEV02 / DEV03 | 電 / 油 / 水 | 125 / 48 / 86 | 2 / 4 / 3 |
| B2 | 李四 | 西屯 | 台中 | DEV04 / DEV03 | 電 / 水 | 125 / 86 | 2 / 3 |
| C3 | 劉五 | 員林 | 彰化 | DEV04 / DEV02 / DEV03 | 電 / 油 / 水 | 125 / 48 / 86 | 4 / 2 / 3 |
| D4 | 陳六 | 小港 | 高雄 | DEV04 / DEV02 | 電 / 油 | 125 / 48 | 2 / 4 |

問題：一格內塞了多個產品值（非單一原子值），且銷售員資料、產品資料大量重複。

**第一正規化（1NF）— 消除重複群、每欄單一值**

將重複群展開成多筆，使每格皆為單一值。主鍵為 (銷售員編號, 產品號碼)。

| C3 | DEV04 | 劉五 | 員林 | 彰化 | 電 | 125 | 4 |
| C3 | DEV02 | 劉五 | 員林 | 彰化 | 油 | 48 | 2 |
| C3 | DEV03 | 劉五 | 員林 | 彰化 | 水 | 86 | 3 |
| D4 | DEV04 | 陳六 | 小港 | 高雄 | 電 | 125 | 2 |
| D4 | DEV02 | 陳六 | 小港 | 高雄 | 油 | 48 | 4 |

每格已是單一值，但銷售員與產品資料仍重複出現。

**第二正規化（2NF）— 消除部分相依**

檢查非鍵屬性是否只相依於主鍵的「一部分」：
- 銷售員姓名、銷售站、地區 → 只相依於「銷售員編號」（部分相依）
- 產品名稱、價格 → 只相依於「產品號碼」（部分相依）

分解為三個資料表：

**產品**（PK：產品號碼）

**第三正規化（3NF）— 消除遞移相依**

檢查非鍵屬性是否相依於其他非鍵屬性：
- 在「銷售員」表中：銷售員編號 → 銷售站 → 地區。「地區」相依於非鍵屬性「銷售站」（每個銷售站位於固定地區），屬遞移相依，須分出。

最終 3NF 結果（四個資料表）：

**銷售員**（PK：銷售員編號；FK：銷售站→銷售站）

| 銷售員編號 | 銷售員姓名 | 銷售站 |
|---|---|---|
| A1 | 張三 | 中正 |
| B2 | 李四 | 西屯 |
| C3 | 劉五 | 員林 |
| D4 | 陳六 | 小港 |

**銷售站**（PK：銷售站）

| 銷售站 | 地區 |
|---|---|
| 中正 | 台北 |
| 西屯 | 台中 |
| 員林 | 彰化 |
| 小港 | 高雄 |

**產品**（PK：產品號碼）、**銷售**（PK：銷售員編號 + 產品號碼）兩張表與 2NF 相同，不變。

**正規化結果總整理**

| 階段 | 處理的問題 | 結果 |

| 1NF | 消除重複群、每欄單一值 | 銷售明細（單一大表） |

| 3NF | 消除遞移相依（銷售站 → 地區） | 銷售員、銷售站、產品、銷售（4 表） |

經過三階正規化後，每張資料表結構單純、無冗餘、無異常，「地區」資訊只需在「銷售站」表維護一處，徹底解決了新增、刪除、修改異常。`,

      id: "96-4", no: "四", part: "一·申論題", topic: "net", topicName: "網路與系統",
      title: "ISO 7498-4 網路管理應包含的項目",
      score: 20,
      question: `隨著網際網路規模擴大，網路應用不斷推陳出新，網路管理議題不斷面臨新挑戰，請依據 1989 年 ISO/OSI 所制定之 ISO 7498-4 號文件，說明網路管理應包含的項目及其內容。（20分）`,
      answer: `**ISO 7498-4 網路管理的五大功能領域（FCAPS）**

ISO 7498-4 文件將網路管理（Network Management）劃分為五大功能領域，常以縮寫「**FCAPS**」表示：

**1. 故障管理（Fault Management）— F**

負責「**偵測、診斷、隔離並修復網路中的故障與異常**」。
內容：
- 偵測網路設備、線路、服務的故障與錯誤。
- 記錄錯誤事件、產生告警（alarm）通知管理者。
- 診斷故障原因、定位問題所在。
- 隔離故障、進行修復，使網路恢復正常運作。
- 維護錯誤日誌以利後續分析。
目的：確保網路的可靠性與可用性，使故障的影響降到最低。

**2. 組態管理（Configuration Management）— C**

負責「**設定、追蹤、控制網路設備與系統的組態（configuration）**」。
內容：
- 記錄並管理網路中所有設備的組態資訊與清單。
- 設定與調整網路設備的參數。
- 追蹤組態的變更歷程。
- 啟用、停用網路元件，管理網路的拓樸結構。
目的：掌握網路的組成與狀態，確保網路依需求正確運作。

**3. 計費管理（Accounting Management）— A**

負責「**量測、記錄使用者對網路資源的使用情形，並據以計費或分攤成本**」。
內容：
- 記錄各使用者或部門對網路資源（頻寬、連線時間、流量）的使用量。
- 統計使用數據，作為計費或成本分攤的依據。
- 設定資源使用的配額與限制。
- 偵測資源的不當或過度使用。
目的：合理分配網路成本、控管資源使用。

**4. 效能管理（Performance Management）— P**

負責「**監控、評估、調校網路的運作效能**」。
內容：
- 持續監控網路的效能指標（如傳輸速率、延遲、流量、使用率、錯誤率）。
- 蒐集並分析效能數據，找出效能瓶頸。
- 進行效能調校，最佳化網路運作。
- 進行容量規劃，預測未來的網路需求。
目的：確保網路維持良好的服務品質與效率。

**5. 安全管理（Security Management）— S**

負責「**保護網路與資源的安全，防止未經授權的存取與攻擊**」。
內容：
- 控制對網路資源的存取權限，進行身分驗證與授權。
- 管理加密金鑰、安全機制。
- 監控與記錄安全相關事件，偵測安全威脅。
- 防範未授權存取、入侵與資料外洩。
目的：維護網路與資料的機密性、完整性與可用性。

**總結**

ISO 7498-4 將網路管理系統化地劃分為「**故障、組態、計費、效能、安全**」五大功能領域（FCAPS）：

| 縮寫 | 功能領域 | 核心任務 |
|---|---|---|
| **F** | 故障管理 | 偵測、診斷、修復故障 |
| **C** | 組態管理 | 設定、追蹤、控制設備組態 |
| **A** | 計費管理 | 量測資源使用、計費分攤 |
| **P** | 效能管理 | 監控、評估、調校效能 |
| **S** | 安全管理 | 存取控制、防護安全威脅 |

此五大領域涵蓋了網路管理的完整面向，是網路管理的經典參考框架。`,

    {
      id: "96-5", no: "一", part: "二·簡答題", topic: "mis", topicName: "資管理論與名詞",
      title: "ITIL 與 V3/V2 版主要差別",
      score: 5,
      question: `何謂 ITIL(IT Infrastructure Library)？ITIL V.3 版與 V.2 版的主要差別為何？`,
      answer: `**何謂 ITIL**

ITIL（IT Infrastructure Library，資訊技術基礎架構庫）是一套「**IT 服務管理（IT Service Management, ITSM）的最佳實務指引框架**」。

它彙整了業界對於「如何規劃、提供、管理與改善 IT 服務」的最佳實務做法，協助組織將 IT 從「單純的技術支援」提升為「與業務目標一致、以服務為導向的管理體系」。ITIL 提供一套標準化的流程與術語，使 IT 服務的品質、效率與可靠性得以提升。

**ITIL V3 版與 V2 版的主要差別**

| 比較面向 | ITIL V2 | ITIL V3 |
|---|---|---|
| **核心觀念** | 以「**流程（Process）**」為導向 | 以「**服務生命週期（Service Lifecycle）**」為導向 |
| **架構組織** | 主要圍繞兩大核心：「服務支援（Service Support）」與「服務交付（Service Delivery）」 | 圍繞「服務生命週期」的五個階段組織 |
| **生命週期觀** | 較缺乏完整的生命週期觀念 | 完整涵蓋服務從「策略到改善」的整個生命週期 |
| **業務結合度** | 較偏重 IT 內部流程的運作 | 更強調「IT 服務與業務策略的結合」、IT 創造的業務價值 |
| **持續改善** | 改善概念較分散 | 明確納入「持續服務改善」作為獨立階段 |

**V3 的核心 —— 服務生命週期五階段**：
1. **服務策略（Service Strategy）**：定義 IT 服務的策略方向。
2. **服務設計（Service Design）**：設計新的或變更的服務。
3. **服務移轉（Service Transition）**：將服務佈署上線。
4. **服務營運（Service Operation）**：日常的服務提供與管理。
5. **持續服務改善（Continual Service Improvement）**：持續評估並改善服務。

**主要差別總結**：
V2 是「**以流程為中心**」，聚焦於 IT 服務支援與交付的個別流程；V3 則升級為「**以服務生命週期為中心**」，將 IT 服務視為一個從「策略 → 設計 → 移轉 → 營運 → 持續改善」的完整循環，更強調 IT 服務與「業務價值、業務策略」的整合，視野更宏觀、更具策略高度。`,

    {
      id: "96-6", no: "二", part: "二·簡答題", topic: "mis", topicName: "資管理論與名詞",
      title: "物件導向與結構化分析設計技術之比較",
      score: 5,
      question: `試比較物件導向分析設計與結構化分析設計技術的不同？`,
      answer: `物件導向（Object-Oriented, OO）與結構化（Structured）是兩種主要的系統分析與設計方法，主要差異如下：

| 比較面向 | 結構化分析設計 | 物件導向分析設計 |
|---|---|---|
| **核心觀念** | 以「**功能 / 程序（Process）**」為中心 | 以「**物件（Object）**」為中心 |
| **分解方式** | 採「功能分解」—— 由上而下將大功能拆解為小模組 | 將系統視為一群「**互相合作的物件**」 |
| **資料與處理的關係** | 資料與處理「**分離**」—— 資料流程與處理程序各自描述 | 資料（屬性）與處理（方法）「**封裝在一起**」成為物件 |
| **主要塑模工具** | DFD（資料流程圖）、ERD、結構圖、資料字典 | UML 系列：使用案例圖、類別圖、循序圖、活動圖、狀態圖 |
| **基本構成單位** | 模組、函式、程序 | 類別（Class）與物件（Object） |
| **重用性** | 程式碼重用較困難 | 透過「繼承、封裝、多型」，**重用性高** |
| **應對需求變動** | 功能一變動，常牽連大量模組，**彈性較差** | 物件獨立、低耦合，**較能因應需求變動、易於擴充維護** |
| **觀點** | 著重「系統做什麼動作」（動詞） | 著重「系統中有哪些物件、物件間如何互動」（名詞） |
| **與真實世界的對應** | 較抽象，與真實世界對應較弱 | 物件直接對應真實世界的實體，**較貼近真實世界、直觀** |

**主要不同的核心摘要**

1. **思考核心不同**：結構化方法問「系統要執行哪些『功能/程序』」，圍繞「動作」分解；物件導向方法問「系統中有哪些『物件』、它們有什麼屬性與行為、彼此如何互動」，圍繞「物件」建構。

2. **資料與行為的處理不同**：結構化方法將「資料」與「處理程序」分開看待；物件導向方法則把「資料（屬性）」與「操作（方法）」**封裝**在同一個物件內，兩者不可分。

3. **重用與維護性不同**：物件導向透過封裝、繼承、多型三大特性，達成較高的程式碼重用性、較低的模組耦合，因此在「因應需求變動、系統擴充與維護」上比結構化方法更具優勢。

**結論**：結構化方法以「程序/功能」為中心、資料與處理分離，適合需求穩定、流程導向的系統；物件導向方法以「物件」為中心、資料與行為封裝合一，較貼近真實世界、重用性與維護性佳，是現代軟體開發的主流。`,

    {
      id: "96-7", no: "三", part: "二·簡答題", topic: "mis", topicName: "資管理論與名詞",
      title: "UML 定義與常用圖（8 種以上）",
      score: 5,
      question: `何謂 UML(Unified Modeling Language)？請列出至少 8 種 UML 使用的圖(diagram)。`,
      answer: `**何謂 UML（統一塑模語言）**

UML（Unified Modeling Language，統一塑模語言）是一套「**標準化的視覺塑模語言**」，用於「**視覺化、規格化、建構與文件化**」軟體系統（尤其是物件導向系統）。

UML 提供一組標準的圖形符號與圖表，讓系統分析師、設計師、開發人員能用「一致的圖形語言」來描述、溝通與記錄系統的結構與行為。它本身「不是程式語言、也不是開發方法論」，而是一種「塑模工具」，廣泛應用於物件導向的系統分析與設計。

UML 的圖大致分為兩大類：
- **結構圖（Structure Diagram）**：描述系統的「靜態結構」。
- **行為圖（Behavior Diagram）**：描述系統的「動態行為」。

**至少 8 種 UML 圖**

**結構圖（靜態）類：**

1. **類別圖（Class Diagram）**：描述系統中的類別、屬性、方法及類別間的關係（繼承、關聯、聚合等）。最常用的結構圖。

2. **物件圖（Object Diagram）**：描述某一時間點，系統中物件的實例及其關係，是類別圖的「快照」。

3. **元件圖（Component Diagram）**：描述系統的軟體元件及元件之間的相依關係。

4. **佈署圖（Deployment Diagram）**：描述系統的硬體節點及軟體在硬體上的佈署配置。

5. **套件圖（Package Diagram）**：將相關的模型元素分組為套件，描述套件間的相依關係。

**行為圖（動態）類：**

6. **使用案例圖（Use Case Diagram）**：描述系統提供的功能（Use Case）與使用者（Actor）之間的互動，呈現系統需求。

7. **循序圖（Sequence Diagram）**：描述物件之間依「時間先後順序」的訊息傳遞與互動。

8. **活動圖（Activity Diagram）**：描述業務流程或演算法的工作流程，含分支與並行。

9. **狀態圖 / 狀態機圖（State Diagram / Statechart）**：描述物件在生命週期中的各種狀態及狀態間的轉換。

10. **合作圖 / 通訊圖（Collaboration / Communication Diagram）**：描述物件之間的互動關係，著重物件的組織結構（與循序圖互補）。

**整理表**

| 分類 | UML 圖 |
|---|---|
| 結構圖（靜態） | 類別圖、物件圖、元件圖、佈署圖、套件圖 |

      answer: `**何謂 SNMP（簡單網路管理協定）**

SNMP（Simple Network Management Protocol，簡單網路管理協定）是一種「**用於管理與監控網路設備的標準通訊協定**」，運作於 TCP/IP 協定組的「應用層」。

它讓網路管理者能夠「**集中地監控、管理網路上各種設備**」（路由器、交換器、伺服器、印表機等）—— 蒐集設備的運作狀態與效能資訊、設定設備參數、接收設備發出的異常通知。SNMP 因簡單、廣泛支援，成為網路管理的事實標準。

**SNMP 的基本架構**

SNMP 架構由下列幾個核心元件組成：

**1. 管理者 / 網管系統（Manager / NMS, Network Management Station）**
- 是「**網路管理的中心**」，通常是一台執行網管軟體的伺服器或工作站。
- 負責主動向被管理設備「查詢（poll）」資訊、發送設定指令，並接收設備傳來的告警。
- 管理者統整所有設備的資訊，呈現給網路管理人員。

**2. 代理程式（Agent）**
- 安裝或內建於「**每個被管理的網路設備**」中的軟體模組。
- 負責蒐集該設備本身的運作狀態與資訊，回應管理者的查詢，並執行管理者下達的設定。
- 當設備發生重大事件時，主動向管理者發出通知（Trap）。

**3. 管理資訊庫（MIB, Management Information Base）**
- 一個「**標準化的資料庫結構**」，定義了每個被管理設備「有哪些可被管理的資訊項目（物件）」。
- 每個被管理物件都有唯一的識別碼（OID, Object Identifier）。
- 管理者與代理程式透過 MIB 對「同一份資訊定義」達成共識，才能正確溝通。

**SNMP 的主要操作（運作方式）**

管理者與代理程式之間透過下列基本操作溝通：

- **Get**：管理者向代理程式「查詢」某項資訊的值。
- **GetNext**：查詢 MIB 中的下一個資訊項目（用於逐筆走訪）。
- **Set**：管理者「設定」代理程式上某項參數的值。
- **Response**：代理程式回應管理者的查詢或設定請求。
- **Trap**：代理程式「主動」向管理者發出的「異常事件通知」（如設備故障、重啟），無需管理者先查詢。

</div>
\`\`\`

<script>/* ===== 經濟部考古題複習系統 — 應用邏輯 ===== */

ALL_YEARS.forEach(y => {

let state = { mode: 'year', topic: 'all', search: '', terms: [] };
const openIds = new Set();   // 使用者展開的題目卡（重新渲染後仍保留）


/* ============================================================
   搜尋 / 跳轉 / 換行 共用工具（新增）
   ============================================================ */
const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;
}
function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */
function breakSentences(s) {
  const NB = /\[nb\]/g;                       // 標記：寫在「。」後面，代表這裡不換行
  if (!BREAK_AT_PERIOD) return String(s).replace(NB, '');
  return String(s)
    .replace(
      /。(?!(?:<\/[a-z]+>)*(?:\s*<br\s*\/?>|\s*$|[」』）)”"']|\[nb\]))/gi,
      '。<br>'
    )
    .replace(NB, '');                         // 換行判斷完再把標記拿掉
}

/* ---------- 搜尋框綁定（支援中文輸入法，組字中不觸發搜尋） ---------- */

/* ---------- 跳轉面板 ---------- */

function scrollToGroup(key) {

/* ---------- 搜尋欄位索引 ---------- */
function plainAnswer(md) {
  return String(md || '')
    .replace(/```(?:htmldiagram|tree)\n[\s\S]*?```/g, ' ')
    .replace(/^#{1,4}\s+/gm, '')
    .replace(/\*\*|`/g, '')
    .replace(/\|/g, ' ')
    .replace(/<br\s*\/?>/gi, '\n')

}
function searchIndex(q) {

  return state.terms.some(t => ix.ques.includes(t) || ix.ans.includes(t) || ix.code.includes(t));

/* ---------- 輕量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md) {
  // 先抽出 ``` 程式碼/ASCII 區塊
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const lines = md.split('\n');
  let html = '', i = 0;

  while (i < lines.length) {
    let line = lines[i];

    // 區塊佔位
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      const idx = parseInt(line.trim().match(/\d+/)[0]);
      const b = blocks[idx];
      // html-diagram 圍欄：直接輸出 HTML（用於圖表），不做跳脫
      if (b.lang === 'htmldiagram') {
        html += `<div class="html-diagram">${b.code}</div>`;
      } else if (b.lang === 'tree') {
        // tree 圍欄：JSON 樹資料 → 自動產生對齊的 SVG 樹狀圖
        html += `<div class="html-diagram">${renderTreeSVG(b.code)}</div>`;
      } else {
        const text = b.code.replace(/\n$/, '');
        const lang = resolveLang(b.lang, text);
        html += lang
          ? codeBlockHtml({ lang, text })
          : `<pre><code>${escapeHtml(text)}</code></pre>`;
      }
      i++; continue;
    }

    // 表格
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      const headers = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        // 去除頭尾空白格
        if (cells[0] === '') cells.shift();
        if (cells[cells.length-1] === '') cells.pop();
        rows.push(cells);
        i++;
      }
      html += '<table><thead><tr>' +
        headers.map(h => `<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' +
          r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }

    // 標題
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if ((m = line.match(/^###\s+(.*)/)))  { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }

    // 無序清單
    if (/^\s*[-*]\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ul>';
      continue;
    }
    // 有序清單
    if (/^\s*\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { i++; continue; }

    // 一般段落（合併連續非空行）
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
           !/^#{3,4}\s/.test(lines[i]) &&
           !/^\u0000BLOCK\d+\u0000$/.test(lines[i].trim()) &&
           !(lines[i].includes('|') && i+1 < lines.length &&
             /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))) {
      para.push(lines[i]); i++;
    }
    html += `<p>${para.map(l => breakSentences(inline(l))).join('<br>')}</p>`;
  }
  return html;
}

// 行內語法：**粗體**、`code`、<u>底線</u>
function inline(s) {
  // 先抽出 `code` 片段保護起來，其餘文字才做標籤還原與粗體
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = escapeHtml(s);
  // 還原資料中直接寫的白名單標籤（<u> 用於標示主鍵）
  s = s.replace(/&lt;(\/?)(strong|code|sub|sup|u)&gt;/g, '<$1$2>');
  s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + escapeHtml(codes[+i]) + '</code>');
  return s;
}

/* ---------- 二元樹 SVG 產生器 ---------- */
// 輸入 JSON：{ "v":"根值", "l":{子樹}, "r":{子樹} }
// l/r 可省略；空子樹可用 null。採對稱佈局：節點置於左右子樹正中央，
// 單子節點向左/右偏移固定距離，使左右視覺平衡。
function renderTreeSVG(json) {
  let root;
  try { root = JSON.parse(json.trim()); }
  catch (e) { return `<pre><code>樹資料格式錯誤</code></pre>`; }

  const NODE_R  = 21;       // 節點圓半徑
  const H_UNIT  = 32;       // 水平基本單位
  const V_GAP   = 76;       // 層與層垂直間距
  const PAD     = 30;       // 邊界留白

  // ── 遞迴佈局：回傳該子樹的 {width, rootX}（皆以 H_UNIT 為單位）──
  // 做法：左子樹先排好佔據 [0, lw)，右子樹排在 [lw+gap, ...)，
  //       父節點 x = 左右子根的中點；單子節點則讓父在子的對側偏移一格，
  //       使整棵子樹仍保有對稱的視覺重心。
  function layout(node, depth) {
    node._d = depth;
    const L = node.l, R = node.r;

    // 葉節點：寬度 1，根在 0
    if (!L && !R) {
      node._w = 1;
      node._x = 0;
      return;
    }

    // 雙子：左右子樹各自佈局，並排放置
    if (L && R) {
      layout(L, depth + 1);
      layout(R, depth + 1);
      const gap = 1;                         // 左右子樹之間留 1 單位
      // 左子樹佔 [0, L._w)，右子樹整體右移 L._w + gap
      const shift = L._w + gap;
      offset(R, shift);
      node._w = L._w + gap + R._w;
      node._x = (L._x + R._x) / 2;           // 父 = 左右子根中點
      return;
    }

    // 單左子：左子樹佈局後，父放在「左子根右側一格」
    if (L) {
      layout(L, depth + 1);
      node._x = L._x + 1;                    // 父在左子根右邊一格
      // 整棵子樹寬度 = 左子樹寬度，但要確保涵蓋父節點 x
      node._w = Math.max(L._w, node._x + 1);
      return;
    }

    // 單右子：右子樹佈局後，父放在「右子根左側一格」
    {
      layout(R, depth + 1);
      // 父在右子根左邊一格；若會 < 0 則整體右移
      let px = R._x - 1;
      if (px < 0) { offset(R, -px); px = 0; }
      node._x = px;
      node._w = Math.max(R._w + (px < 0 ? -px : 0), node._x + 1,
                         R._x + 1);
      return;
    }
  }
  // 把以 node 為根的整棵子樹所有 _x 平移 dx
  function offset(node, dx) {
    if (!node) return;
    node._x += dx;
    offset(node.l, dx);
    offset(node.r, dx);
  }
  layout(root, 0);

  // 收集座標範圍
  let minX = Infinity, maxX = -Infinity, maxDepth = 0;
  (function scan(node) {
    if (!node) return;
    minX = Math.min(minX, node._x);
    maxX = Math.max(maxX, node._x);
    maxDepth = Math.max(maxDepth, node._d);
    scan(node.l); scan(node.r);
  })(root);

  const width  = (maxX - minX) * H_UNIT + PAD * 2 + NODE_R * 2;
  const height = maxDepth * V_GAP + PAD * 2 + NODE_R * 2;

  function cx(node) { return PAD + NODE_R + (node._x - minX) * H_UNIT; }
  function cy(node) { return PAD + NODE_R + node._d * V_GAP; }

  // 第三遍：產生連線與節點
  let edges = '', nodes = '';
  function draw(node) {
    if (!node) return;
    const x = cx(node), y = cy(node);
    ['l', 'r'].forEach(side => {
      const child = node[side];
      if (child) {
        edges += `<line x1="${x}" y1="${y}" x2="${cx(child)}" y2="${cy(child)}" `
               + `stroke="#3d4456" stroke-width="2"/>`;
        draw(child);
      }
    });
    const palette = {
      accent: ['#fbf3f0', '#8a3324', '#8a3324'],
      blue:   ['#eef4f7', '#1f5673', '#1f5673'],
      gold:   ['#faf5e6', '#a07e2c', '#7a5d1e'],
      dim:    ['#e8e3d6', '#b3a98f', '#8a8266'],
      ink:    ['#1a1f2c', '#1a1f2c', '#ffffff'],
    };
    const [fill, stroke, txt] = palette[node.t] || palette.ink;
    nodes += `<circle cx="${x}" cy="${y}" r="${NODE_R}" `
           + `fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`
           + `<text x="${x}" y="${y + 5}" text-anchor="middle" `
           + `font-size="15" font-weight="700" fill="${txt}">`
           + escapeHtml(String(node.v)) + `</text>`;
  }
  draw(root);

  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" `
       + `style="max-width:${width}px;width:100%;font-family:'Noto Sans TC',sans-serif;">`
       + edges + nodes + `</svg>`;
}

/* ---------- 語言判斷 ---------- */
const LANG_ALIAS = {
  sql:'sql', mysql:'sql', tsql:'sql', plsql:'sql', pgsql:'sql',
  c:'c', cpp:'c', 'c++':'c',
  java:'java', python:'python', py:'python',
  javascript:'javascript', js:'javascript', php:'php',
  pseudo:'pseudo', pseudocode:'pseudo',
  text:'', txt:'', plain:''          // 明確指定純文字 → 不上色
};
function detectLang(code) {
  const t = code.trim();
  if (/[│─┌└├┐┘▶▼◀▲╱╲]/.test(t)) return '';                       // ASCII 圖
  if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|WITH)\b/i.test(t)) return 'sql';
  if (/#include|\bint\s+main\s*\(/.test(t)) return 'c';
  if (/\b(public|private)\s+(class|static|void)|System\.out/.test(t)) return 'java';
  if (/^\s*(def\s|import\s+\w+|from\s+\w+\s+import)/m.test(t)) return 'python';
  if (/^\s*(Algorithm|Function|Procedure)\b|\bthen\b|\bend\s+(if|while|for)\b|←/i.test(t)) return 'pseudo';
  return '';
}
function resolveLang(lang, code) {
  const k = (lang || '').toLowerCase();
  if (k && Object.prototype.hasOwnProperty.call(LANG_ALIAS, k)) return LANG_ALIAS[k];
  return detectLang(code);
}

const SQL_KW = new Set(('SELECT FROM WHERE GROUP BY ORDER HAVING ASC DESC JOIN INNER LEFT RIGHT FULL OUTER ON AS ' +
  'AND OR NOT IN IS NULL LIKE BETWEEN EXISTS UNION ALL DISTINCT TOP LIMIT OFFSET FETCH FIRST ROWS ROW ONLY ' +
  'CASE WHEN THEN ELSE END INSERT INTO VALUES UPDATE SET DELETE REPLACE CREATE TABLE INDEX VIEW TRIGGER DROP ' +
  'ALTER ADD PRIMARY KEY FOREIGN REFERENCES CONSTRAINT UNIQUE DEFAULT CLUSTER BEFORE AFTER FOR EACH BEGIN ' +
  'DECLARE IF SIGNAL SQLSTATE MESSAGE_TEXT WITH USING NEW OLD').split(' '));
const SQL_TYPE = new Set('INT INTEGER CHAR VARCHAR DATETIME DATE TIMESTAMP DECIMAL FLOAT DOUBLE TEXT BOOLEAN'.split(' '));
const PSEUDO_KW = new Set(('ALGORITHM FUNCTION PROCEDURE INPUT OUTPUT IF THEN ELSE FOR TO DO WHILE END RETURN ' +
  'AND OR NOT NULL IS EMPTY').split(' '));

/* ---------- 程式碼語法 highlight（逐字元 tokenizer）---------- */
function highlightCode(code, lang) {
  lang = LANG_ALIAS[(lang || '').toLowerCase()] || (lang || '').toLowerCase();
  const kw = {
    c: ['int','char','void','return','if','else','for','while','do','struct','typedef','bool','long','double','float','define','include','sizeof','static','const','unsigned','break','continue','switch','case','NULL','true','false'],
    java: ['public','private','protected','class','int','void','return','if','else','for','while','do','new','static','final','abstract','extends','implements','import','package','this','super','boolean','double','String','char','long','float','try','catch','throw','throws','interface','null','true','false','break','continue'],
    python: ['def','return','if','elif','else','for','while','import','from','as','with','try','except','finally','class','None','True','False','and','or','not','in','is','lambda','break','continue','global','print'],
    javascript: ['function','return','if','else','for','while','let','const','var','new','class','this','try','catch','import','export','from','null','true','false','typeof','break','continue','console'],
    php: ['function','return','if','else','elseif','for','while','foreach','as','class','new','public','private','echo','true','false','null','require','include']
  };
  const isSql = lang === 'sql', isPseudo = lang === 'pseudo';
  const list = new Set(kw[lang] || kw.c);

  let out = '', i = 0;
  const n = code.length;
  const wrap = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;
  const isWordChar = c => /[A-Za-z0-9_@]/.test(c);
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = code[i];
    const two = code.substr(i, 2);

    if (two === '/*') {
      let j = code.indexOf('*/', i + 2);
      j = (j === -1) ? n : j + 2;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (two === '//' && !isSql) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (two === '--' && isSql) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (c === '#' && (lang === 'python' || lang === 'php')) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (lang === 'python' && (code.startsWith('"""', i) || code.startsWith("'''", i))) {
      const q = code.substr(i, 3);
      let j = code.indexOf(q, i + 3); j = (j === -1) ? n : j + 3;
      out += wrap('tok-str', code.slice(i, j)); i = j; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && code[j] !== c) { if (code[j] === '\\') j++; j++; }
      j = Math.min(j + 1, n);
      out += wrap('tok-str', code.slice(i, j)); i = j; continue;
    }
    if (isDigit(c)) {
      let j = i;
      while (j < n && /[0-9.]/.test(code[j])) j++;
      out += wrap('tok-num', code.slice(i, j)); i = j; continue;
    }
    if (isWordChar(c) && !isDigit(c)) {
      let j = i;
      while (j < n && isWordChar(code[j])) j++;
      const word = code.slice(i, j), up = word.toUpperCase();
      if (isSql) {
        if (SQL_TYPE.has(up))      out += wrap('tok-typ', word);
        else if (SQL_KW.has(up))   out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      } else if (isPseudo) {
        if (PSEUDO_KW.has(up))     out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      } else {
        if (list.has(word))        out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      }
      i = j; continue;
    }
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function codeBlockHtml(codeObj) {
  if (!codeObj) return '';
  const langLabel = {
    c: 'C', java: 'Java', python: 'Python', javascript: 'JavaScript',
    php: 'PHP', sql: 'SQL', pseudo: '虛擬碼'
  }[codeObj.lang] || codeObj.lang;
  return `<div class="code-block">
    <div class="code-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>${langLabel}</span>
    </div>
    <pre><code>${highlightCode(codeObj.text, codeObj.lang)}</code></pre>
  </div>`;
}

/* ---------- 渲染題目卡 ---------- */
/* QFENCE：考題中的程式碼圍欄 ``` 轉成程式碼區塊（避免原樣顯示、長行撐破版面） */
function qFences(h) {
  return h.replace(/```[a-z]*\n([\s\S]*?)\n```/g, (m, c) =>
    '<pre style="background:#2b303b;color:#eee;padding:.7rem 1rem;border-radius:6px;overflow-x:auto;margin:.5rem 0;font-size:.85rem;white-space:pre">' + c + '</pre>');
}

function bodyHtml(q) {
  return `      <span class="section-label q">考題</span>
      <div class="q-question">${qFences(escapeHtml(q.question)).replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')}</div>
      <span class="section-label a">詳解</span>
      <div class="q-answer">${renderMarkdown(q.answer)}</div>
      ${q.code ? codeBlockHtml(q.code) : ''}`;
}

function fillBody(card) {
  if (card.dataset.filled) return;
  const q = ALL_Q.find(x => x.id === card.dataset.id);
  if (!q) return;
  const box = card.querySelector('.q-body');
  box.innerHTML = bodyHtml(q);
  card.dataset.filled = '1';
  if (state.terms.length) highlightIn(box, state.terms);
}

function questionCard(q, forceOpen) {
  const t = TOPIC_INFO[q.topic] || { name: q.topicName, cls: '' };
  const isOpen = openIds.has(q.id) || !!forceOpen;
  return `<div class="q-card ${t.cls}${isOpen ? ' open' : ''}" data-id="${q.id}"${isOpen ? ' data-filled="1"' : ''}>
    <div class="q-header" onclick="toggleCard(this)">
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-title">${escapeHtml(q.title)}</div>
        <div class="q-tags">
          <span class="tag tag-topic">${t.name}</span>
          <span class="tag tag-year">${q.year}年</span>
          ${q.part ? `<span class="tag tag-part">${escapeHtml(q.part)}　第${q.no}題</span>` : ''}
          <span class="tag tag-score">${q.score}分</span>
        </div>
      </div>
      <div class="q-toggle">+</div>
    </div>
    <div class="q-body">${isOpen ? bodyHtml(q) : ''}</div>
  </div>`;
}

/* ---------- 篩選 ---------- */
function filterQuestions() {
  let list = ALL_Q.filter(q => state.topic === 'all' || q.topic === state.topic);
  if (state.terms.length) {
    // 多關鍵字 AND、全形半形統一、依相關度排序（標題 > 考題 > 詳解 > 程式碼）
    list = list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }
  return list;
}

/* ---------- 渲染主內容 ---------- */
function updateSearchInfo(count, autoOpen) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (count > 30) h += ' ‧ 結果較多，已不自動展開詳解，可再加關鍵字縮小範圍';
  else h += ' ‧ 詳解中有符合的題目已自動展開並標黃';
  el.innerHTML = h;
  el.classList.add('show');
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  const autoOpen = searching && list.length <= 30;
  JUMP_ITEMS = [];
  updateSearchInfo(list.length, autoOpen);

  if (list.length === 0) {
    const msg = searching
      ? `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`
      : '找不到符合條件的題目';
    wrap.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${msg}</p>
    </div>`;
    buildJump();
    syncExpandBtn();
    return;
  }

  let html = '';

  if (searching) {
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      ${list.map(q => questionCard(q, autoOpen && bodyHit(q))).join('')}
    </div>`;
  } else if (state.mode === 'year') {
    JUMP_TITLE = '跳到年度';
    // 依年度分組
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
    years.forEach(yr => {
      const qs = byYear[yr];
      const yObj = ALL_YEARS.find(y => y.year === yr);
      const totalScore = qs.reduce((s, q) => s + q.score, 0);
      JUMP_ITEMS.push({ key: 'y' + yr, label: yr, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-y${yr}">
        <div class="group-head">
          <span class="g-badge">${yr} 年</span>
          <span class="g-title">${escapeHtml(yObj.subject)}</span>
          <span class="g-meta">
            ${yObj.timeLimit ? '考試時間 ' + yObj.timeLimit + '<br>' : ''}
            本頁 ${qs.length} 題 / ${totalScore} 分
          </span>
        </div>
        ${yObj.note ? `<div class="group-note">※ ${escapeHtml(yObj.note)}</div>` : ''}
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  } else {
    JUMP_TITLE = '跳到主題';
    // 依主題分組
    const byTopic = {};
    list.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    Object.keys(TOPIC_INFO).forEach(tk => {
      const qs = byTopic[tk];
      if (!qs || qs.length === 0) return;
      // 同主題內依年度新到舊、再依題號
      qs.sort((a, b) => Number(b.year) - Number(a.year));
      const t = TOPIC_INFO[tk];
      JUMP_ITEMS.push({ key: 't' + tk, label: t.name, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-t${tk}">
        <div class="group-head">
          <span class="g-badge">${t.name}</span>
          <span class="g-title">歷年同類考題彙整</span>
          <span class="g-meta">共 ${qs.length} 題<br>跨 ${new Set(qs.map(q=>q.year)).size} 個年度</span>
        </div>
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  buildJump();
  syncExpandBtn();
}

function jumpTo(key) {
  toggleJump(false);
  scrollToGroup(key);
}

/* ---------- 互動 ---------- */
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const open = card.classList.toggle('open');
  if (open) fillBody(card);
  if (open) openIds.add(card.dataset.id); else openIds.delete(card.dataset.id);
  syncExpandBtn();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

function updateStatBar() {
  const scope = ALL_Q;
  const yearSet = new Set(scope.map(q => q.year));
  document.getElementById('statYear').textContent = yearSet.size;
  document.getElementById('statQ').textContent = scope.length;
  document.getElementById('statTopic').textContent = new Set(scope.map(q => q.topic)).size;
}

function rebuildTopicChips() {
  const scope = ALL_Q;
  const topicCount = {};
  scope.forEach(q => topicCount[q.topic] = (topicCount[q.topic]||0)+1);
  const filterRow = document.getElementById('filterRow');
  let chips = `<button class="chip ${state.topic === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopic('all')">全部<span class="c-count">${scope.length}</span></button>`;
  Object.keys(TOPIC_INFO).forEach(tk => {
    const cnt = topicCount[tk] || 0;
    if (cnt === 0) return;
    chips += `<button class="chip ${state.topic === tk ? 'active' : ''}" data-topic="${tk}"
      onclick="setTopic('${tk}')">${TOPIC_INFO[tk].name}<span class="c-count">${cnt}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

function setTopic(topic) {
  state.topic = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}

/* 按鈕文字依「目前畫面上的卡片是否都已展開」決定，不再用獨立旗標 */
function syncExpandBtn() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  document.getElementById('btnExpand').textContent = allOpen ? '全部收合' : '全部展開';
}
function toggleExpandAll() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  cards.forEach(c => {
    c.classList.toggle('open', !allOpen);
    if (!allOpen) fillBody(c);
    if (allOpen) openIds.delete(c.dataset.id); else openIds.add(c.dataset.id);
  });
  syncExpandBtn();
}

/* ---------- 初始化 ---------- */
function init() {
  updateStatBar();
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
