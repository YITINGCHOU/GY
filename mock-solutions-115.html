  mis:  { name: '資管理論與名詞',   cls: 't-mis'  },
};

// 攤平成題目陣列
const ALL_Q = [];
ALL_YEARS.forEach(y => {
  y.questions.forEach(q => {
    ALL_Q.push({ ...q, year: y.year, subject: y.subject,
                 yearNote: y.note || '', timeLimit: y.timeLimit });
  });
});

let state = { mode: 'year', topic: 'all', search: '', terms: [] };
const openIds = new Set();   // 使用者展開的題目卡（重新渲染後仍保留）


/* ============================================================
   搜尋 / 跳轉 / 換行 共用工具（新增）
   ============================================================ */
const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;
}
function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */
function breakSentences(s) {
  if (!BREAK_AT_PERIOD) return s;
  return String(s).replace(
    /。(?!(?:<\/[a-z]+>)*(?:\s*<br\s*\/?>|\s*$|[」』）)”"']))/gi,
    '。<br>'
  );
}

/* ---------- 搜尋框綁定（支援中文輸入法，組字中不觸發搜尋） ---------- */
function applySearch() {
  const input = document.getElementById('searchInput');
  state.search = input.value.trim();
  state.terms = parseTerms(state.search);
  render();
}
function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('show');
  applySearch();
  input.focus();
}
function bindSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  let timer, composing = false;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(applySearch, 150); };
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; schedule(); });
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
    if (!composing) schedule();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });
  clearBtn.addEventListener('click', clearSearch);
}

/* ---------- 跳轉面板 ---------- */
let JUMP_ITEMS = [];
let JUMP_TITLE = '跳到試卷';
function buildJump() {
  const fab = document.getElementById('jumpFab');
  const grid = document.getElementById('jumpGrid');
  document.getElementById('jumpTitle').textContent = JUMP_TITLE;
  fab.classList.toggle('show', JUMP_ITEMS.length > 0);
  grid.innerHTML = JUMP_ITEMS.map(it =>
    `<button class="jump-item${it.done ? ' done' : ''}${it.open ? ' on' : ''}" onclick="jumpTo('${it.key}')">
       <b>${it.label}</b><small>${it.sub || ''}</small></button>`
  ).join('');
  if (!JUMP_ITEMS.length) toggleJump(false);
}
function toggleJump(force) {
  const p = document.getElementById('jumpPanel');
  p.hidden = (typeof force === 'boolean') ? !force : !p.hidden;
}
function scrollToGroup(key) {
  const el = document.getElementById('g-' + key);
  if (!el) return;
  const ctrl = document.querySelector('.controls');
  const top = el.getBoundingClientRect().top + window.scrollY - (ctrl ? ctrl.offsetHeight : 0) - 10;
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';          // 跳轉用瞬間定位，避免長距離捲動動畫
  window.scrollTo(0, Math.max(0, top));
  root.style.scrollBehavior = '';
}
document.addEventListener('click', e => {
  const p = document.getElementById('jumpPanel');
  if (p && !p.hidden && !p.contains(e.target) && !e.target.closest('#jumpFab')) p.hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleJump(false); });

/* ---------- 搜尋欄位索引 ---------- */
function plainAnswer(md) {
  return String(md || '')
    .replace(/```(?:htmldiagram|tree)\n[\s\S]*?```/g, ' ')   // 圖表/樹狀圖的 HTML、JSON 不列入搜尋
    .replace(/^#{1,4}\s+/gm, '')
    .replace(/\*\*|`/g, '')
    .replace(/\|/g, ' ')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
function searchIndex(q) {
  return q._ix || (q._ix = {
    title: normText(stripTags(q.title)),
    ques:  normText(stripTags(q.question)),
    ans:   normText(plainAnswer(q.answer)),
    code:  normText(q.code ? q.code.text : ''),
    meta:  normText(q.year + ' ' + q.year + '年 第' + q.no + '題 ' +
                    ((TOPIC_INFO[q.topic] || {}).name || '') + ' ' + (q.part || ''))
  });
}
function searchFields(q) {
  const ix = searchIndex(q);
  return [{ t: ix.title, w: 10 }, { t: ix.ques, w: 6 }, { t: ix.ans, w: 3 },
          { t: ix.code, w: 2 }, { t: ix.meta, w: 1 }];
}
function bodyHit(q) {
  const ix = searchIndex(q);
  return state.terms.some(t => ix.ques.includes(t) || ix.ans.includes(t) || ix.code.includes(t));
}

/* ---------- 輕量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md) {
  // 先抽出 ``` 程式碼/ASCII 區塊
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const lines = md.split('\n');
  let html = '', i = 0;

  while (i < lines.length) {
    let line = lines[i];

    // 區塊佔位
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      const idx = parseInt(line.trim().match(/\d+/)[0]);
      const b = blocks[idx];
      // html-diagram 圍欄：直接輸出 HTML（用於圖表），不做跳脫
      if (b.lang === 'htmldiagram') {
        html += `<div class="html-diagram">${b.code}</div>`;
      } else if (b.lang === 'tree') {
        // tree 圍欄：JSON 樹資料 → 自動產生對齊的 SVG 樹狀圖
        html += `<div class="html-diagram">${renderTreeSVG(b.code)}</div>`;
      } else {
        const text = b.code.replace(/\n$/, '');
        const lang = resolveLang(b.lang, text);
        html += lang
          ? codeBlockHtml({ lang, text })
          : `<pre><code>${escapeHtml(text)}</code></pre>`;
      }
      i++; continue;
    }

    // 表格
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      const headers = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        // 去除頭尾空白格
        if (cells[0] === '') cells.shift();
        if (cells[cells.length-1] === '') cells.pop();
        rows.push(cells);
        i++;
      }
      html += '<table><thead><tr>' +
        headers.map(h => `<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' +
          r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }

    // 標題
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if ((m = line.match(/^###\s+(.*)/)))  { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }

    // 無序清單
    if (/^\s*[-*]\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ul>';
      continue;
    }
    // 有序清單
    if (/^\s*\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { i++; continue; }

    // 一般段落（合併連續非空行）
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
           !/^#{3,4}\s/.test(lines[i]) &&
           !/^\u0000BLOCK\d+\u0000$/.test(lines[i].trim()) &&
           !(lines[i].includes('|') && i+1 < lines.length &&
             /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))) {
      para.push(lines[i]); i++;
    }
    html += `<p>${para.map(l => breakSentences(inline(l))).join('<br>')}</p>`;
  }
  return html;
}

// 行內語法：**粗體**、`code`、<u>底線</u>
function inline(s) {
  // 先抽出 `code` 片段保護起來，其餘文字才做標籤還原與粗體
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = escapeHtml(s);
  // 還原資料中直接寫的白名單標籤（<u> 用於標示主鍵）
  s = s.replace(/&lt;(\/?)(strong|code|sub|sup|u)&gt;/g, '<$1$2>');
  s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + escapeHtml(codes[+i]) + '</code>');
  return s;
}

/* ---------- 二元樹 SVG 產生器 ---------- */
// 輸入 JSON：{ "v":"根值", "l":{子樹}, "r":{子樹} }
// l/r 可省略；空子樹可用 null。採對稱佈局：節點置於左右子樹正中央，
// 單子節點向左/右偏移固定距離，使左右視覺平衡。
function renderTreeSVG(json) {
  let root;
  try { root = JSON.parse(json.trim()); }
  catch (e) { return `<pre><code>樹資料格式錯誤</code></pre>`; }

  const NODE_R  = 21;       // 節點圓半徑
  const H_UNIT  = 32;       // 水平基本單位
  const V_GAP   = 76;       // 層與層垂直間距
  const PAD     = 30;       // 邊界留白

  // ── 遞迴佈局：回傳該子樹的 {width, rootX}（皆以 H_UNIT 為單位）──
  // 做法：左子樹先排好佔據 [0, lw)，右子樹排在 [lw+gap, ...)，
  //       父節點 x = 左右子根的中點；單子節點則讓父在子的對側偏移一格，
  //       使整棵子樹仍保有對稱的視覺重心。
  function layout(node, depth) {
    node._d = depth;
    const L = node.l, R = node.r;

    // 葉節點：寬度 1，根在 0
    if (!L && !R) {
      node._w = 1;
      node._x = 0;
      return;
    }

    // 雙子：左右子樹各自佈局，並排放置
    if (L && R) {
      layout(L, depth + 1);
      layout(R, depth + 1);
      const gap = 1;                         // 左右子樹之間留 1 單位
      // 左子樹佔 [0, L._w)，右子樹整體右移 L._w + gap
      const shift = L._w + gap;
      offset(R, shift);
      node._w = L._w + gap + R._w;
      node._x = (L._x + R._x) / 2;           // 父 = 左右子根中點
      return;
    }

    // 單左子：左子樹佈局後，父放在「左子根右側一格」
    if (L) {
      layout(L, depth + 1);
      node._x = L._x + 1;                    // 父在左子根右邊一格
      // 整棵子樹寬度 = 左子樹寬度，但要確保涵蓋父節點 x
      node._w = Math.max(L._w, node._x + 1);
      return;
    }

    // 單右子：右子樹佈局後，父放在「右子根左側一格」
    {
      layout(R, depth + 1);
      // 父在右子根左邊一格；若會 < 0 則整體右移
      let px = R._x - 1;
      if (px < 0) { offset(R, -px); px = 0; }
      node._x = px;
      node._w = Math.max(R._w + (px < 0 ? -px : 0), node._x + 1,
                         R._x + 1);
      return;
    }
  }
  // 把以 node 為根的整棵子樹所有 _x 平移 dx
  function offset(node, dx) {
    if (!node) return;
    node._x += dx;
    offset(node.l, dx);
    offset(node.r, dx);
  }
  layout(root, 0);

  // 收集座標範圍
  let minX = Infinity, maxX = -Infinity, maxDepth = 0;
  (function scan(node) {
    if (!node) return;
    minX = Math.min(minX, node._x);
    maxX = Math.max(maxX, node._x);
    maxDepth = Math.max(maxDepth, node._d);
    scan(node.l); scan(node.r);
  })(root);

  const width  = (maxX - minX) * H_UNIT + PAD * 2 + NODE_R * 2;
  const height = maxDepth * V_GAP + PAD * 2 + NODE_R * 2;

  function cx(node) { return PAD + NODE_R + (node._x - minX) * H_UNIT; }
  function cy(node) { return PAD + NODE_R + node._d * V_GAP; }

  // 第三遍：產生連線與節點
  let edges = '', nodes = '';
  function draw(node) {
    if (!node) return;
    const x = cx(node), y = cy(node);
    ['l', 'r'].forEach(side => {
      const child = node[side];
      if (child) {
        edges += `<line x1="${x}" y1="${y}" x2="${cx(child)}" y2="${cy(child)}" `
               + `stroke="#3d4456" stroke-width="2"/>`;
        draw(child);
      }
    });
    const palette = {
      accent: ['#fbf3f0', '#8a3324', '#8a3324'],
      blue:   ['#eef4f7', '#1f5673', '#1f5673'],
      gold:   ['#faf5e6', '#a07e2c', '#7a5d1e'],
      dim:    ['#e8e3d6', '#b3a98f', '#8a8266'],
      ink:    ['#1a1f2c', '#1a1f2c', '#ffffff'],
    };
    const [fill, stroke, txt] = palette[node.t] || palette.ink;
    nodes += `<circle cx="${x}" cy="${y}" r="${NODE_R}" `
           + `fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`
           + `<text x="${x}" y="${y + 5}" text-anchor="middle" `
           + `font-size="15" font-weight="700" fill="${txt}">`
           + escapeHtml(String(node.v)) + `</text>`;
  }
  draw(root);

  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" `
       + `style="max-width:${width}px;width:100%;font-family:'Noto Sans TC',sans-serif;">`
       + edges + nodes + `</svg>`;
}

/* ---------- 語言判斷 ---------- */
const LANG_ALIAS = {
  sql:'sql', mysql:'sql', tsql:'sql', plsql:'sql', pgsql:'sql',
  c:'c', cpp:'c', 'c++':'c',
  java:'java', python:'python', py:'python',
  javascript:'javascript', js:'javascript', php:'php',
  pseudo:'pseudo', pseudocode:'pseudo',
  text:'', txt:'', plain:''          // 明確指定純文字 → 不上色
};
function detectLang(code) {
  const t = code.trim();
  if (/[│─┌└├┐┘▶▼◀▲╱╲]/.test(t)) return '';                       // ASCII 圖
  if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|WITH)\b/i.test(t)) return 'sql';
  if (/#include|\bint\s+main\s*\(/.test(t)) return 'c';
  if (/\b(public|private)\s+(class|static|void)|System\.out/.test(t)) return 'java';
  if (/^\s*(def\s|import\s+\w+|from\s+\w+\s+import)/m.test(t)) return 'python';
  if (/^\s*(Algorithm|Function|Procedure)\b|\bthen\b|\bend\s+(if|while|for)\b|←/i.test(t)) return 'pseudo';
  return '';
}
function resolveLang(lang, code) {
  const k = (lang || '').toLowerCase();
  if (k && Object.prototype.hasOwnProperty.call(LANG_ALIAS, k)) return LANG_ALIAS[k];
  return detectLang(code);
}

const SQL_KW = new Set(('SELECT FROM WHERE GROUP BY ORDER HAVING ASC DESC JOIN INNER LEFT RIGHT FULL OUTER ON AS ' +
  'AND OR NOT IN IS NULL LIKE BETWEEN EXISTS UNION ALL DISTINCT TOP LIMIT OFFSET FETCH FIRST ROWS ROW ONLY ' +
  'CASE WHEN THEN ELSE END INSERT INTO VALUES UPDATE SET DELETE REPLACE CREATE TABLE INDEX VIEW TRIGGER DROP ' +
  'ALTER ADD PRIMARY KEY FOREIGN REFERENCES CONSTRAINT UNIQUE DEFAULT CLUSTER BEFORE AFTER FOR EACH BEGIN ' +
  'DECLARE IF SIGNAL SQLSTATE MESSAGE_TEXT WITH USING NEW OLD').split(' '));
const SQL_TYPE = new Set('INT INTEGER CHAR VARCHAR DATETIME DATE TIMESTAMP DECIMAL FLOAT DOUBLE TEXT BOOLEAN'.split(' '));
const PSEUDO_KW = new Set(('ALGORITHM FUNCTION PROCEDURE INPUT OUTPUT IF THEN ELSE FOR TO DO WHILE END RETURN ' +
  'AND OR NOT NULL IS EMPTY').split(' '));

/* ---------- 程式碼語法 highlight（逐字元 tokenizer）---------- */
function highlightCode(code, lang) {
  lang = LANG_ALIAS[(lang || '').toLowerCase()] || (lang || '').toLowerCase();
  const kw = {
    c: ['int','char','void','return','if','else','for','while','do','struct','typedef','bool','long','double','float','define','include','sizeof','static','const','unsigned','break','continue','switch','case','NULL','true','false'],
    java: ['public','private','protected','class','int','void','return','if','else','for','while','do','new','static','final','abstract','extends','implements','import','package','this','super','boolean','double','String','char','long','float','try','catch','throw','throws','interface','null','true','false','break','continue'],
    python: ['def','return','if','elif','else','for','while','import','from','as','with','try','except','finally','class','None','True','False','and','or','not','in','is','lambda','break','continue','global','print'],
    javascript: ['function','return','if','else','for','while','let','const','var','new','class','this','try','catch','import','export','from','null','true','false','typeof','break','continue','console'],
    php: ['function','return','if','else','elseif','for','while','foreach','as','class','new','public','private','echo','true','false','null','require','include']
  };
  const isSql = lang === 'sql', isPseudo = lang === 'pseudo';
  const list = new Set(kw[lang] || kw.c);

  let out = '', i = 0;
  const n = code.length;
  const wrap = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;
  const isWordChar = c => /[A-Za-z0-9_@]/.test(c);
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = code[i];
    const two = code.substr(i, 2);

    if (two === '/*') {
      let j = code.indexOf('*/', i + 2);
      j = (j === -1) ? n : j + 2;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (two === '//' && !isSql) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (two === '--' && isSql) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (c === '#' && (lang === 'python' || lang === 'php')) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (lang === 'python' && (code.startsWith('"""', i) || code.startsWith("'''", i))) {
      const q = code.substr(i, 3);
      let j = code.indexOf(q, i + 3); j = (j === -1) ? n : j + 3;
      out += wrap('tok-str', code.slice(i, j)); i = j; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && code[j] !== c) { if (code[j] === '\\') j++; j++; }
      j = Math.min(j + 1, n);
      out += wrap('tok-str', code.slice(i, j)); i = j; continue;
    }
    if (isDigit(c)) {
      let j = i;
      while (j < n && /[0-9.]/.test(code[j])) j++;
      out += wrap('tok-num', code.slice(i, j)); i = j; continue;
    }
    if (isWordChar(c) && !isDigit(c)) {
      let j = i;
      while (j < n && isWordChar(code[j])) j++;
      const word = code.slice(i, j), up = word.toUpperCase();
      if (isSql) {
        if (SQL_TYPE.has(up))      out += wrap('tok-typ', word);
        else if (SQL_KW.has(up))   out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      } else if (isPseudo) {
        if (PSEUDO_KW.has(up))     out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      } else {
        if (list.has(word))        out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      }
      i = j; continue;
    }
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function codeBlockHtml(codeObj) {
  if (!codeObj) return '';
  const langLabel = {
    c: 'C', java: 'Java', python: 'Python', javascript: 'JavaScript',
    php: 'PHP', sql: 'SQL', pseudo: '虛擬碼'
  }[codeObj.lang] || codeObj.lang;
  return `<div class="code-block">
    <div class="code-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>${langLabel}</span>
    </div>
    <pre><code>${highlightCode(codeObj.text, codeObj.lang)}</code></pre>
  </div>`;
}

/* ---------- 渲染題目卡 ---------- */
/* QFENCE：考題中的程式碼圍欄 ``` 轉成程式碼區塊（避免原樣顯示、長行撐破版面） */
function qFences(h) {
  return h.replace(/```[a-z]*\n([\s\S]*?)\n```/g, (m, c) =>
    '<pre style="background:#2b303b;color:#eee;padding:.7rem 1rem;border-radius:6px;overflow-x:auto;margin:.5rem 0;font-size:.85rem;white-space:pre">' + c + '</pre>');
}

function bodyHtml(q) {
  return `      <span class="section-label q">考題</span>
      <div class="q-question">${qFences(escapeHtml(q.question)).replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')}</div>
      <span class="section-label a">詳解</span>
      <div class="q-answer">${renderMarkdown(q.answer)}</div>
      ${q.code ? codeBlockHtml(q.code) : ''}`;
}

function fillBody(card) {
  if (card.dataset.filled) return;
  const q = ALL_Q.find(x => x.id === card.dataset.id);
  if (!q) return;
  const box = card.querySelector('.q-body');
  box.innerHTML = bodyHtml(q);
  card.dataset.filled = '1';
  if (state.terms.length) highlightIn(box, state.terms);
}

function questionCard(q, forceOpen) {
  const t = TOPIC_INFO[q.topic] || { name: q.topicName, cls: '' };
  const isOpen = openIds.has(q.id) || !!forceOpen;
  return `<div class="q-card ${t.cls}${isOpen ? ' open' : ''}" data-id="${q.id}"${isOpen ? ' data-filled="1"' : ''}>
    <div class="q-header" onclick="toggleCard(this)">
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-title">${escapeHtml(q.title)}</div>
        <div class="q-tags">
          <span class="tag tag-topic">${t.name}</span>
          <span class="tag tag-year">${q.year}</span>
          ${q.part ? `<span class="tag tag-part">${escapeHtml(q.part)}　第${q.no}題</span>` : ''}
          <span class="tag tag-score">${q.score}分</span>
        </div>
      </div>
      <div class="q-toggle">+</div>
    </div>
    <div class="q-body">${isOpen ? bodyHtml(q) : ''}</div>
  </div>`;
}

/* ---------- 篩選 ---------- */
function filterQuestions() {
  let list = ALL_Q.filter(q => state.topic === 'all' || q.topic === state.topic);
  if (state.terms.length) {
    // 多關鍵字 AND、全形半形統一、依相關度排序（標題 > 考題 > 詳解 > 程式碼）
    list = list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }
  return list;
}

/* ---------- 渲染主內容 ---------- */
function updateSearchInfo(count, autoOpen) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (count > 30) h += ' ‧ 結果較多，已不自動展開詳解，可再加關鍵字縮小範圍';
  else h += ' ‧ 詳解中有符合的題目已自動展開並標黃';
  el.innerHTML = h;
  el.classList.add('show');
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  const autoOpen = searching && list.length <= 30;
  JUMP_ITEMS = [];
  updateSearchInfo(list.length, autoOpen);

  if (list.length === 0) {
    const msg = searching
      ? `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`
      : '找不到符合條件的題目';
    wrap.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${msg}</p>
    </div>`;
    buildJump();
    syncExpandBtn();
    return;
  }

  let html = '';

  if (searching) {
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      ${list.map(q => questionCard(q, autoOpen && bodyHit(q))).join('')}
    </div>`;
  } else if (state.mode === 'year') {
    JUMP_TITLE = '跳到試卷';
    // 依年度分組
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => a.localeCompare(b));
    years.forEach(yr => {
      const qs = byYear[yr];
      const yObj = ALL_YEARS.find(y => y.year === yr);
      const totalScore = qs.reduce((s, q) => s + q.score, 0);
      JUMP_ITEMS.push({ key: 'y' + yr, label: yr, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-y${yr}">
        <div class="group-head">
          <span class="g-badge">${yr}</span>
          <span class="g-title">${escapeHtml(yObj.subject)}</span>
          <span class="g-meta">
            ${yObj.timeLimit ? '考試時間 ' + yObj.timeLimit + '<br>' : ''}
            本頁 ${qs.length} 題 / ${totalScore} 分
          </span>
        </div>
        ${yObj.note ? `<div class="group-note">※ ${escapeHtml(yObj.note)}</div>` : ''}
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  } else {
    JUMP_TITLE = '跳到主題';
    // 依主題分組
    const byTopic = {};
    list.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    Object.keys(TOPIC_INFO).forEach(tk => {
      const qs = byTopic[tk];
      if (!qs || qs.length === 0) return;
      // 同主題內依年度新到舊、再依題號
      qs.sort((a, b) => a.year.localeCompare(b.year));
      const t = TOPIC_INFO[tk];
      JUMP_ITEMS.push({ key: 't' + tk, label: t.name, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-t${tk}">
        <div class="group-head">
          <span class="g-badge">${t.name}</span>
          <span class="g-title">各卷同類題彙整</span>
          <span class="g-meta">共 ${qs.length} 題<br>跨 ${new Set(qs.map(q=>q.year)).size} 卷</span>
        </div>
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  buildJump();
  syncExpandBtn();
}

function jumpTo(key) {
  toggleJump(false);
  scrollToGroup(key);
}

/* ---------- 互動 ---------- */
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const open = card.classList.toggle('open');
  if (open) fillBody(card);
  if (open) openIds.add(card.dataset.id); else openIds.delete(card.dataset.id);
  syncExpandBtn();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

function updateStatBar() {
  const scope = ALL_Q;
  const yearSet = new Set(scope.map(q => q.year));
  document.getElementById('statYear').textContent = yearSet.size;
  document.getElementById('statQ').textContent = scope.length;
  document.getElementById('statTopic').textContent = new Set(scope.map(q => q.topic)).size;
}

function rebuildTopicChips() {
  const scope = ALL_Q;
  const topicCount = {};
  scope.forEach(q => topicCount[q.topic] = (topicCount[q.topic]||0)+1);
  const filterRow = document.getElementById('filterRow');
  let chips = `<button class="chip ${state.topic === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopic('all')">全部<span class="c-count">${scope.length}</span></button>`;
  Object.keys(TOPIC_INFO).forEach(tk => {
    const cnt = topicCount[tk] || 0;
    if (cnt === 0) return;
    chips += `<button class="chip ${state.topic === tk ? 'active' : ''}" data-topic="${tk}"
      onclick="setTopic('${tk}')">${TOPIC_INFO[tk].name}<span class="c-count">${cnt}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

function setTopic(topic) {
  state.topic = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}

/* 按鈕文字依「目前畫面上的卡片是否都已展開」決定，不再用獨立旗標 */
function syncExpandBtn() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  document.getElementById('btnExpand').textContent = allOpen ? '全部收合' : '全部展開';
}
function setAllCards(open) {
  document.querySelectorAll('.q-card').forEach(c => {
    c.classList.toggle('open', open);
    if (open) { fillBody(c); openIds.add(c.dataset.id); } else openIds.delete(c.dataset.id);
  });
  syncExpandBtn();
}
function toggleExpandAll() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  cards.forEach(c => {
    c.classList.toggle('open', !allOpen);
    if (!allOpen) fillBody(c);
    if (allOpen) openIds.delete(c.dataset.id); else openIds.add(c.dataset.id);
  });
  syncExpandBtn();
}

/* ---------- 初始化 ---------- */
function init() {
  updateStatBar();
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
