<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經濟部新進職員甄試｜115 年模擬卷 B｜資訊管理・程式設計</title>
<style>/* ===== 經濟部考古題複習系統 — 樣式 ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;   /* 朱紅 — 印章色 */
  --accent-2:   #1f5673;   /* 靛藍 */
  --gold:       #a07e2c;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色 */
  --t-db:   #1f5673;
  --t-ds:   #6a4c93;
  --t-prog: #2d6a4f;
  --t-sec:  #8a3324;
  --t-net:  --t-net;
  --t-net-c:#b5651d;
  --t-mis:  #4a5859;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(138,51,36,0.025) 31px, rgba(138,51,36,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent);
  position: relative;
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.6rem, 4.4vw, 2.7rem);
  letter-spacing: .06em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent);
  color: var(--accent); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-4deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .9rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2.5rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.7rem; color: var(--accent); line-height: 1;
}
.stat-bar .lbl {
  font-size: .72rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgb(244,241,234);
  border-bottom: 1.5px solid var(--line);
  padding: .9rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1080px; margin: 0 auto;
  display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1.1rem; font-size: .88rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
}
.mode-switch button.active { background: var(--ink); color: var(--paper); }

.search-box {
  flex: 1; min-width: 180px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .55rem .9rem .55rem 2.2rem; font-size: .9rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .7rem; top: 50%;
  transform: translateY(-50%); font-size: .85rem; opacity: .5;
}
.btn-expand {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .9rem; font-size: .82rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-expand:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1080px; margin: .7rem auto 0;
  display: flex; gap: .45rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 20px;
  padding: .3rem .85rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.chip .c-count { opacity: .6; font-size: .92em; margin-left: .2em; }

/* ===== 主內容 ===== */
.wrap { max-width: 1080px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

/* 群組標題（年度 / 主題） */
.group {
  margin-bottom: 2.6rem;
}
.group-head {
  display: flex; align-items: center; gap: .9rem;
  margin-bottom: 1.1rem; padding-bottom: .6rem;
  border-bottom: 2.5px solid var(--ink);
}
.group-head .g-badge {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  background: var(--ink); color: var(--paper);
  padding: .35rem .8rem; border-radius: 6px; font-size: 1.05rem;
  white-space: nowrap;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.15rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .76rem; color: var(--ink-soft);
  text-align: right; line-height: 1.5;
}
.group-note {
  font-size: .8rem; color: var(--accent-2); font-style: italic;
  margin: -.5rem 0 1rem; padding-left: .2rem;
}

/* ===== 題目卡 ===== */
.q-card {
  background: var(--card); border: 1.5px solid var(--line);
  border-radius: 10px; margin-bottom: .9rem;
  box-shadow: 0 2px 8px var(--shadow);
  overflow: hidden; transition: box-shadow .2s;
}
.q-card:hover { box-shadow: 0 4px 16px var(--shadow); }

.q-header {
  display: flex; align-items: flex-start; gap: .8rem;
  padding: 1rem 1.2rem; cursor: pointer;
  border-left: 5px solid var(--line);
  transition: background .15s;
}
.q-card.t-db   .q-header { border-left-color: var(--t-db); }
.q-card.t-ds   .q-header { border-left-color: var(--t-ds); }
.q-card.t-prog .q-header { border-left-color: var(--t-prog); }
.q-card.t-sec  .q-header { border-left-color: var(--t-sec); }
.q-card.t-net  .q-header { border-left-color: var(--t-net-c); }
.q-card.t-mis  .q-header { border-left-color: var(--t-mis); }
.q-header:hover { background: var(--paper-warm); }

.q-no {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1rem; color: var(--paper); background: var(--ink-soft);
  min-width: 2.4rem; height: 2.4rem; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.q-headmain { flex: 1; min-width: 0; }
.q-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.02rem; color: var(--ink); line-height: 1.5;
}
.q-tags {
  display: flex; gap: .45rem; flex-wrap: wrap; margin-top: .4rem;
  align-items: center;
}
.tag {
  font-size: .7rem; font-weight: 700; padding: .12rem .55rem;
  border-radius: 4px; letter-spacing: .03em;
}
.tag-topic { color: #fff; }
.t-db   .tag-topic, .tag.topic-db   { background: var(--t-db); }
.t-ds   .tag-topic, .tag.topic-ds   { background: var(--t-ds); }
.t-prog .tag-topic, .tag.topic-prog { background: var(--t-prog); }
.t-sec  .tag-topic, .tag.topic-sec  { background: var(--t-sec); }
.t-net  .tag-topic, .tag.topic-net  { background: var(--t-net-c); }
.t-mis  .tag-topic, .tag.topic-mis  { background: var(--t-mis); }
.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-score {
  background: transparent; color: var(--gold);
  border: 1px solid var(--gold);
}
.tag-part {
  background: var(--accent-2); color: #fff;
  font-weight: 500;
}
.q-toggle {
  flex-shrink: 0; font-size: 1.3rem; color: var(--ink-soft);
  transition: transform .25s; line-height: 1; margin-top: .4rem;
}
.q-card.open .q-toggle { transform: rotate(45deg); }

/* ===== 題目展開內容 ===== */
.q-body { display: none; padding: 0 1.2rem 1.4rem; }
.q-card.open .q-body { display: block; animation: fadeIn .25s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

.section-label {
  display: inline-block; font-family: 'Noto Serif TC', serif;
  font-weight: 700; font-size: .82rem; letter-spacing: .1em;
  padding: .25rem .8rem; border-radius: 4px; margin: 1.1rem 0 .6rem;
}
.section-label.q { background: var(--ink); color: var(--paper); }
.section-label.a { background: var(--accent); color: var(--paper); }

.q-question {
  background: var(--paper-warm); border-left: 3px solid var(--ink-soft);
  padding: .9rem 1.1rem; border-radius: 0 6px 6px 0;
  font-size: .93rem; white-space: pre-wrap; color: var(--ink-soft);
  font-feature-settings: "tnum";
}
.q-answer {
  font-size: .95rem; color: var(--ink);
}
.q-answer h4 {
  font-family: 'Noto Serif TC', serif; color: var(--accent);
  font-size: 1rem; margin: 1.1rem 0 .4rem;
  border-bottom: 1px dashed var(--line); padding-bottom: .2rem;
}
.q-answer p { margin: .55rem 0; }
.q-answer ul, .q-answer ol { margin: .5rem 0 .5rem 1.4rem; }
.q-answer li { margin: .3rem 0; }
.q-answer strong { color: var(--accent-2); font-weight: 700; }
.q-answer code {
  font-family: 'JetBrains Mono', monospace; font-size: .86em;
  background: var(--paper-warm); padding: .1em .35em;
  border-radius: 3px; color: var(--accent);
}
.q-answer table {
  border-collapse: collapse; width: 100%; margin: .8rem 0;
  font-size: .86rem;
  display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;  /* MOBILE_TABLE：手機寬度下表格可左右捲動 */
}
.q-figure { max-width: 100%; overflow-x: auto; }
.q-answer th, .q-answer td {
  border: 1px solid var(--line); padding: .4rem .6rem;
  text-align: left;
}
.q-answer th {
  background: var(--ink); color: var(--paper); font-weight: 700;
}
.q-answer tr:nth-child(even) td { background: var(--paper-warm); }

/* 程式碼/ASCII 區塊 */
.q-answer pre {
  background: #2b303b; color: #f2f0e9;
  font-family: 'JetBrains Mono', monospace; font-size: .85rem;
  line-height: 1.7; padding: 1rem 1.2rem; border-radius: 8px;
  overflow-x: auto; margin: .8rem 0;
  border-left: 3px solid var(--gold);
}
.q-answer pre code { background: none; color: inherit; padding: 0; }

/* 獨立程式碼區（code 欄位） */
.code-block {
  margin: 1rem 0; border-radius: 8px; overflow: hidden;
  border: 1px solid var(--ink);
}
.code-head {
  background: var(--ink); color: var(--gold);
  font-family: 'JetBrains Mono', monospace; font-size: .76rem;
  padding: .4rem .9rem; font-weight: 500;
  display: flex; justify-content: space-between; align-items: center;
}
.code-head .dots { display: flex; gap: .3rem; }
.code-head .dots span {
  width: .6rem; height: .6rem; border-radius: 50%; display: block;
}
.code-head .dots span:nth-child(1) { background: #d4554a; }
.code-head .dots span:nth-child(2) { background: #d9a441; }
.code-head .dots span:nth-child(3) { background: #5a9e6f; }
.code-block pre {
  margin: 0; border-radius: 0; border-left: none;
  background: #2b303b;            /* 提亮背景，降低與文字的明度落差刺眼感 */
  color: #f2f0e9;                 /* 預設文字（變數、標點）改為近白，清楚可見 */
  font-size: .86rem; line-height: 1.7;
  padding: 1.1rem 1.3rem 1.1rem 1.7rem;   /* 左側多留白，程式碼不貼邊、不壓迫 */
}
/* 語法highlight — 高對比配色，深背景下皆清晰 */
.tok-kw  { color: #ff9d6f; font-weight: 700; }   /* 關鍵字：亮橘，最醒目 */
.tok-str { color: #b8e986; }                      /* 字串：亮綠 */
.tok-com { color: #9aa6b8; font-style: italic; }  /* 註解：提亮的灰藍，不再灰到看不見 */
.tok-num { color: #f7d56e; }                      /* 數字：亮黃 */
.tok-fn  { color: #82c8ff; }                      /* 函式：亮藍 */
.tok-typ { color: #ffd166; }                      /* 型別：金黃 */

/* ===== HTML 圖表（取代易跑版的 ASCII 圖）===== */
.html-diagram {
  margin: 1.1rem 0; padding: 1.3rem 1rem;
  background: var(--paper-warm);
  border: 1.5px solid var(--line); border-radius: 10px;
  overflow-x: auto;
}
/* 通用方框節點 */
.dg-box {
  display: inline-flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center;
  border: 2px solid var(--ink); border-radius: 8px;
  background: var(--card); padding: .55rem .9rem;
  font-size: .86rem; line-height: 1.5; font-weight: 500;
  min-width: 5.5rem;
}
.dg-box .dg-sub { font-size: .73rem; color: var(--ink-soft); font-weight: 400; }
.dg-box.accent { border-color: var(--accent); background: #fbf3f0; }
.dg-box.blue   { border-color: var(--accent-2); background: #eef4f7; }
.dg-box.gold   { border-color: var(--gold); background: #faf5e6; }
.dg-box.ink    { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.dg-box.ink .dg-sub { color: #b8bcca; }

/* 排列容器 */
.dg-row { display: flex; align-items: center; justify-content: center;
  gap: .5rem; flex-wrap: wrap; }
.dg-col { display: flex; flex-direction: column; align-items: center;
  gap: .5rem; }
.dg-center { justify-content: center; }

/* 箭頭 */
.dg-arrow { font-size: 1.3rem; color: var(--accent); font-weight: 700;
  line-height: 1; padding: 0 .15rem; }
.dg-arrow.v { transform: rotate(90deg); margin: .1rem 0; }
.dg-arrow.bi::before { content: '◀▶'; }
.dg-arrow.down::before { content: '▼'; }
.dg-arrow.right::before { content: '▶'; }

/* 流程圖專用 */
.flow { display: flex; flex-direction: column; align-items: center; gap: 0; }
.flow-node {
  border: 2px solid var(--ink); background: var(--card);
  padding: .55rem 1.1rem; font-size: .86rem; text-align: center;
  font-weight: 500; max-width: 32rem; line-height: 1.55;
}
.flow-node.start, .flow-node.end {
  border-radius: 22px; background: var(--ink); color: var(--paper);
  font-weight: 700;
}
.flow-node.process { border-radius: 6px; }
.flow-node.io {
  border-radius: 6px; background: var(--paper-warm);
  border-style: dashed;
}
.flow-node.decision {
  background: #faf5e6; border-color: var(--gold);
  border-radius: 6px; font-weight: 700;
}
/* 連接線（直線 + 箭頭） */
.flow-conn { width: 2px; height: 1.6rem; background: var(--ink-soft);
  position: relative; }
.flow-conn::after {
  content: '▼'; position: absolute; bottom: -.3rem; left: 50%;
  transform: translateX(-50%); color: var(--ink-soft); font-size: .68rem;
}
/* 連接線旁的小標籤（如「否」「未出貨訂單」） */
.flow-edge {
  display: flex; flex-direction: column; align-items: center; gap: 0;
}
.flow-edge .lbl {
  font-size: .74rem; font-weight: 700; padding: .08rem .55rem;
  border-radius: 4px; position: relative; z-index: 1;
}
.flow-edge .lbl.yes { background: #2d6a4f; color: #fff; }
.flow-edge .lbl.no  { background: var(--accent); color: #fff; }
.flow-edge .lbl.plain {
  background: var(--card); color: var(--accent-2);
  border: 1px solid var(--line);
}
.flow-conn.short { height: .7rem; }
.flow-conn.short::after { display: none; }

/* 迴圈返回標記 —— 掛在決策節點下方，明確標示「往回」 */
.flow-loop {
  display: inline-flex; align-items: center; gap: .4rem;
  font-size: .76rem; font-weight: 700;
  background: #eef4f7; color: var(--accent-2);
  border: 1.5px dashed var(--accent-2); border-radius: 20px;
  padding: .25rem .8rem; margin: .35rem 0;
}
.flow-loop::before { content: '⟲'; font-size: 1.05rem; }

.flow-label {
  font-size: .73rem; color: var(--accent-2); font-weight: 600;
  background: var(--card); padding: 0 .4rem; margin: .15rem 0;
}
/* 舊版分支樣式（保留相容，僅用於少數真正左右並排的場景） */
.flow-branch { display: flex; align-items: flex-start; gap: 2.5rem;
  justify-content: center; }
.flow-branch-arm { display: flex; flex-direction: column;
  align-items: center; gap: 0; }
.flow-yes, .flow-no {
  font-size: .76rem; font-weight: 700; padding: .1rem .5rem;
  border-radius: 4px; margin: .2rem 0;
}
.flow-yes { background: #2d6a4f; color: #fff; }
.flow-no  { background: var(--accent); color: #fff; }

/* ERD 專用形狀 */
.erd-entity {
  border: 2px solid var(--ink); background: var(--card);
  padding: .5rem 1.1rem; font-weight: 700; font-size: .9rem;
  border-radius: 4px; text-align: center;
}
.erd-rel {
  display: inline-flex; align-items: center; justify-content: center;
  width: 7rem; height: 4rem; background: #faf5e6;
  border: 2px solid var(--gold);
  transform: rotate(45deg); margin: 1rem;
}
.erd-rel > span {
  transform: rotate(-45deg); font-size: .8rem; font-weight: 700;
  text-align: center; line-height: 1.3;
}
.erd-attr {
  display: inline-block; border: 1.5px solid var(--accent-2);
  background: #eef4f7; border-radius: 50%;
  padding: .35rem .8rem; font-size: .76rem; text-align: center;
  color: var(--accent-2);
}
.empty .big { font-size: 2.5rem; margin-bottom: .5rem; }

/* 回頂部 */
.to-top {
  position: fixed; right: 1.5rem; bottom: 1.5rem;
  width: 3rem; height: 3rem; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 1.2rem; cursor: pointer; box-shadow: 0 4px 14px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
  z-index: 60;
}
.to-top.show { opacity: 1; pointer-events: auto; }

/* 頁尾 */
.site-footer {
  background: var(--ink); color: #9aa0b0;
  text-align: center; padding: 2rem 1.5rem;
  font-size: .8rem; line-height: 1.8;
}
.site-footer strong { color: var(--gold); }

/* 手機 */
@media (max-width: 640px) {
  .stat-bar { gap: 1.4rem; }
  .controls-inner { gap: .6rem; }
  .search-box { order: 3; flex-basis: 100%; }
  .group-head { flex-wrap: wrap; }
  .group-head .g-meta { margin-left: 0; flex-basis: 100%; text-align: left; }
  .q-answer table { font-size: .78rem; }
  .q-answer pre, .code-block pre { font-size: .74rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }

    "question": "某公營事業以下列指令建立兩個資料表，有底線者為主鍵：\n  CREATE TABLE Dept (DeptNo CHAR(3) PRIMARY KEY, DeptName VARCHAR(20) NOT NULL);\n  CREATE TABLE Emp (EmpNo CHAR(5) PRIMARY KEY, Name VARCHAR(20) NOT NULL,\n                    DeptNo CHAR(3) REFERENCES Dept(DeptNo), Salary INT CHECK (Salary > 0));\nDept 目前已有 ('D01','資訊處') 與 ('D02','會計處') 兩筆資料，Emp 為空。（3題，共20分）\n(一) 依序執行下列指令，請判斷每個指令能否成功執行；若失敗，請說明違反何種限制。（8分）\n  指令 1：INSERT INTO Emp VALUES ('E0001', '王小明', 'D01', 52000);\n  指令 2：INSERT INTO Emp VALUES ('E0002', NULL, 'D02', 48000);\n  指令 3：INSERT INTO Emp VALUES ('E0001', '李大華', 'D02', 61000);\n  指令 4：INSERT INTO Emp VALUES ('E0003', '陳美玲', 'D09', 55000);\n(二) 請以 SQL 列出每個部門的部門名稱、員工人數與平均薪資，沒有員工的部門也要列出（人數顯示 0）。（6分）\n(三) 請建立一個名為 DeptSalary 的檢視表（View），內容為每個部門代號及其薪資總額；並說明為何不能透過此檢視表新增員工資料。（6分）",
    "answer": "**(一) 判斷每個指令（8分）**\n\n| 指令 | 結果 | 說明 |\n|---|---|---|\n| 指令 1 | ✔ 成功 | 主鍵 E0001 尚未存在，D01 存在於 Dept，薪資 > 0，全部符合 |\n| 指令 2 | ✘ 失敗 | Name 宣告為 **NOT NULL**，不可放入空值 |\n| 指令 3 | ✘ 失敗 | 主鍵 E0001 已被指令 1 使用，違反**主鍵唯一性（實體完整性）** |\n| 指令 4 | ✘ 失敗 | DeptNo 為外來鍵，D09 不存在於 Dept，違反**參考完整性** |\n\n四個指令執行完後，Emp 只有一筆資料：('E0001', '王小明', 'D01', 52000)。\n\n補充三種完整性限制：\n- **實體完整性**：主鍵不可重複、不可為 NULL。\n- **參考完整性**：外來鍵的值必須存在於被參考的資料表中，或為 NULL。\n- **值域限制**：NOT NULL、CHECK、資料型態等欄位層級的限制。\n\n**(二) 每個部門的人數與平均薪資（6分）**\n\n「沒有員工的部門也要列出」，所以要以 Dept 為主做 **LEFT JOIN**。COUNT 要數員工欄位，不能用 COUNT(*)，否則沒有員工的部門會被算成 1。\n\n```sql\nSELECT D.DeptName,\n       COUNT(E.EmpNo)  AS 員工人數,\n       AVG(E.Salary)   AS 平均薪資\nFROM Dept D\nLEFT JOIN Emp E ON D.DeptNo = E.DeptNo\nGROUP BY D.DeptNo, D.DeptName;\n```\n\n以 (一) 執行後的資料為例：資訊處 1 人、平均 52000；會計處 0 人、平均為 NULL。若希望平均薪資顯示 0，可寫 `COALESCE(AVG(E.Salary), 0)`。\n\n**(三) 建立 View 並說明限制（6分）**\n\n```sql\nCREATE VIEW DeptSalary AS\nSELECT DeptNo, SUM(Salary) AS TotalSalary\nFROM Emp\nGROUP BY DeptNo;\n\n-- 使用方式\nSELECT TotalSalary FROM DeptSalary WHERE DeptNo = 'D01';\n```\n\n不能透過 DeptSalary 新增員工的原因：\n1. View 本身**不儲存資料**，對 View 的新增必須轉換成對基底資料表 Emp 的新增。\n2. 這個 View 用了 **GROUP BY 與聚合函數 SUM**，每一列是多位員工彙總後的結果。新增一筆「部門總薪資」時，系統無法得知要新增哪幾位員工、各自的姓名與薪資，無法對應回 Emp 的單一列。\n3. 一般而言，含有聚合函數、GROUP BY、DISTINCT、多表 JOIN 的 View 都屬於**不可更新（non-updatable）** 的 View，只適合查詢。\n\n> 📌 **出題依據**：地方特考 114 年三等資料庫應用第一題（依序判斷 INSERT 是否違反限制）與第三題（SQL 查詢）；115 年關務三等資料庫應用第一題（建立 View 並說明為何不能新增）。國營 108～113 年每年都有 SQL 申論。",

    "question": "某公司新廠區分配到 IPv4 網段 172.20.4.0/23，內有三個單位：製程控制區需要 200 個 IP、辦公區需要 100 個 IP、機房需要 20 個 IP。各單位以 VLAN 區隔，並由一台第三層交換器連接公司路由器。（3題，共20分）\n(一) 請以 VLSM 規劃三個單位的子網路，依序寫出網路位址、子網路遮罩（斜線表示法）、可用主機範圍及廣播位址，並說明剩餘的位址空間。（8分）\n(二) 若拔除第三層交換器、只保留第二層交換器，製程控制區與辦公區的主機還能互相連線嗎？請從 VLAN 的本質說明。（4分）\n(三) 辦公區某台電腦可以連到同網段的印表機，卻無法開啟任何外部網站。請說明如何依序使用 ipconfig、ping、tracert、nslookup 找出問題所在，並各舉出一種可能的故障原因。（8分）",
    "answer": "**(一) VLSM 規劃（8分）**\n\n172.20.4.0/23 共有 512 個位址（172.20.4.0～172.20.5.255）。VLSM 的原則是**由需求最大的單位先配**，每個子網路的大小要取 2 的次方，並扣掉網路位址與廣播位址。\n\n| 單位 | 需求 | 子網大小 | 網路位址 | 遮罩 | 可用主機範圍 | 廣播位址 |\n|---|---|---|---|---|---|---|\n| 製程控制區 | 200 | 256（可用 254） | 172.20.4.0 | /24 | 172.20.4.1～172.20.4.254 | 172.20.4.255 |\n| 辦公區 | 100 | 128（可用 126） | 172.20.5.0 | /25 | 172.20.5.1～172.20.5.126 | 172.20.5.127 |\n| 機房 | 20 | 32（可用 30） | 172.20.5.128 | /27 | 172.20.5.129～172.20.5.158 | 172.20.5.159 |\n\n**剩餘空間**：172.20.5.160～172.20.5.255，共 96 個位址，可再切成 172.20.5.160/27、172.20.5.192/26，留給未來新增的單位，且不必更動既有單位的設定。\n\n計算重點：200 台需要 2⁸ = 256 → /24；100 台需要 2⁷ = 128 → /25；20 台需要 2⁵ = 32 → /27。\n\n**(二) 只有第二層交換器時（4分）**\n\n**不能互相連線。**\n\nVLAN 會在一台實體交換器上切出多個**邏輯上獨立的廣播網域**，第二層交換器只會在同一個 VLAN 內依 MAC 位址轉送訊框，不會把訊框轉到其他 VLAN。\n\n不同 VLAN 同時也是不同的 IP 子網路，跨子網路的通訊屬於網路層的工作，必須經過**路由器或第三層交換器**（稱為 VLAN 間路由）。這也是 VLAN 能隔離廣播、提升安全性的原因。\n\n**(三) 故障排除步驟（8分）**\n\n既然能連到同網段印表機，代表網卡、網路線與第二層連線正常，問題出在**跨網段的路由**或**名稱解析**。依網路分層由下往上排查：\n\n| 步驟 | 指令 | 檢查重點 | 可能的故障原因 |\n|---|---|---|---|\n| 1 | `ipconfig /all` | IP、遮罩、預設閘道、DNS 是否正確 | 預設閘道未設定或設錯；若 IP 為 169.254.x.x，代表沒有從 DHCP 取得位址 |\n| 2 | `ping 預設閘道` | 能否連到 L3 交換器 | 閘道介面故障、VLAN 設定錯誤 |\n| 3 | `ping 8.8.8.8`（外部 IP） | 能否連出網際網路 | 路由器到 ISP 的線路中斷、路由表缺少預設路由、防火牆或 NAT 設定錯誤 |\n| 4 | `tracert 8.8.8.8` | 在第幾跳中斷 | 中斷點之後的設備故障或封鎖 ICMP |\n| 5 | `nslookup www.google.com` | 名稱解析是否正常 | DNS 伺服器設錯或故障；若 ping 外部 IP 成功但 nslookup 失敗，就是 DNS 問題 |\n\n判斷邏輯：\n- ping 閘道失敗 → 問題在本機設定或內部網路。\n- ping 閘道成功、ping 外部 IP 失敗 → 問題在路由器、NAT、防火牆或 ISP。\n- ping 外部 IP 成功、但開不了網頁 → 多半是 **DNS** 問題，用 nslookup 確認。\n\n> 📌 **出題依據**：115 年普考資通網路與安全概要第一題（VLSM 規劃與 VLAN 不經路由器能否互通）；地方特考 114 年三等第二題（子網路分配）；中華郵政 114 年第一節第二、三題（ping、tracert、nslookup 及路由器、NAT、防火牆故障排除）。國營 114 年申論已出現 traceroute 診斷。",

   {
    "id": "115B-3",

    "topic": "sec",
    "topicName": "資訊安全",
    "title": "防火牆類型、DMZ 規劃、IPS 與 WAF",
    "score": 15,
    "question": "某國營事業要對外提供線上申辦網站，網路架構規劃包含防火牆、DMZ、入侵防禦系統（IPS）與網頁應用程式防火牆（WAF）。請回答下列問題：（3題，共15分）\n(一) 防火牆可分為封包過濾防火牆、狀態檢測防火牆及應用層防火牆，請比較三者的檢查依據與優缺點。（6分）\n(二) 該網站伺服器應放在何處？防火牆政策應如何設定？請寫出至少三條關鍵規則。（5分）\n(三) 已有防火牆，為何還需要 IPS 與 WAF？請分別說明其功能。（4分）",
    "answer": "**(一) 三種防火牆比較（6分）**\n\n| 類型 | 運作層級 | 檢查依據 | 優點 | 缺點 |\n|---|---|---|---|---|\n| 封包過濾 | 網路層、傳輸層 | 每個封包的來源／目的 IP、埠號、協定，逐一比對規則 | 速度快、成本低 | 不記得連線狀態；規則需雙向設定，容易被偽造封包繞過；看不到應用層內容 |\n| 狀態檢測 | 網路層到傳輸層 | 除了上述欄位，還維護**連線狀態表**，只放行屬於已建立連線的回應封包 | 安全性高於封包過濾，規則較簡單 | 仍看不到應用層內容；連線表可能被大量連線耗盡 |\n| 應用層（代理） | 應用層 | 解析應用協定的內容，例如 HTTP 的網址、指令、上傳檔案 | 可檢查惡意內容、做使用者認證與詳細記錄 | 效能較低、延遲較高；每種協定都要有對應的代理程式 |\n\n**(二) 伺服器位置與防火牆政策（5分）**\n\n網站伺服器應放在 **DMZ**（非軍事區），不放在內網，也不直接放在外網。即使網站被攻破，攻擊者也無法直接進入內網。\n\n關鍵規則（依序比對，最後一條預設拒絕）：\n\n| # | 來源 | 目的 | 服務 | 動作 |\n|---|---|---|---|---|\n| 1 | 外網（Any） | DMZ 網站伺服器 | TCP 443（HTTPS） | 允許 |\n| 2 | DMZ 網站伺服器 | 內網資料庫伺服器 | 只開資料庫埠，例如 TCP 1433 | 允許 |\n| 3 | 內網管理者網段 | DMZ 網站伺服器 | 管理用 SSH 或遠端桌面 | 允許，並記錄 |\n| 4 | DMZ | 內網其他所有主機 | 任何 | **拒絕** |\n| 5 | 任何 | 任何 | 任何 | **預設拒絕** |\n\n設定原則：**最小權限**（只開必要的埠）、**預設拒絕**、**DMZ 不可主動連入內網**、規則要寫明來源、目的、服務三個要素，並啟用日誌。\n\n**(三) 為何還需要 IPS 與 WAF（4分）**\n\n防火牆主要依 IP、埠號決定放行與否。一旦允許 TCP 443 進來，夾帶在合法連線裡的攻擊就會一併通過。\n\n- **IPS（入侵防禦系統）**：串接在網路路徑上，深入檢查封包內容，以特徵比對或異常偵測發現攻擊（例如漏洞利用、掃描、蠕蟲傳播），並能**即時阻斷**。與 IDS 的差別是 IDS 只告警，IPS 會主動攔截。\n- **WAF（網頁應用程式防火牆）**：專門保護網站，解析 HTTP／HTTPS 請求內容，阻擋 **SQL Injection、XSS、CSRF**、路徑穿越等應用層攻擊，並可做虛擬修補（在程式修好之前先擋住攻擊）。\n\n三者分工合作，構成**縱深防禦**：防火牆管「誰能連、連哪裡」，IPS 管「封包裡有沒有攻擊」，WAF 管「網頁請求是否惡意」。\n\n> 📌 **出題依據**：中華郵政 114 年第二節第三題（三種防火牆的功能與檢測標的、IPS）；115 年高考資通網路與安全第一題（DMZ 防火牆政策三要素）；115 年關務資通網路第四題（封包過濾與代理防火牆）；中華郵政 113 年第四題（WAF 與其他防火牆差異）。國營 114 年選擇題已考 WAF。",
    "code": null

<script>/* ===== 經濟部考古題複習系統 — 應用邏輯 ===== */

// 合併所有資料（依年度由新到舊）

  ...EXAM_DATA_PART3, ...EXAM_DATA_PART4
];

const TOPIC_INFO = {

  prog: { name: '程式設計實作',     cls: 't-prog' },
  sec:  { name: '資訊安全',         cls: 't-sec'  },
  net:  { name: '網路與系統',       cls: 't-net'  },
  mis:  { name: '資管理論與名詞',   cls: 't-mis'  },
};

// 攤平成題目陣列
const ALL_Q = [];
ALL_YEARS.forEach(y => {
  y.questions.forEach(q => {
    ALL_Q.push({ ...q, year: y.year, subject: y.subject,
                 yearNote: y.note || '', timeLimit: y.timeLimit });
  });
});

let state = { mode: 'year', topic: 'all', search: '', terms: [] };
const openIds = new Set();   // 使用者展開的題目卡（重新渲染後仍保留）


/* ============================================================
   搜尋 / 跳轉 / 換行 共用工具（新增）
   ============================================================ */
const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;
}
function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */
function breakSentences(s) {
  if (!BREAK_AT_PERIOD) return s;
  return String(s).replace(
    /。(?!(?:<\/[a-z]+>)*(?:\s*<br\s*\/?>|\s*$|[」』）)”"']))/gi,
    '。<br>'
  );
}

/* ---------- 搜尋框綁定（支援中文輸入法，組字中不觸發搜尋） ---------- */
function applySearch() {
  const input = document.getElementById('searchInput');
  state.search = input.value.trim();
  state.terms = parseTerms(state.search);
  render();
}
function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  document.getElementById('searchClear').classList.remove('show');
  applySearch();
  input.focus();
}
function bindSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  let timer, composing = false;
  const schedule = () => { clearTimeout(timer); timer = setTimeout(applySearch, 150); };
  input.addEventListener('compositionstart', () => { composing = true; });
  input.addEventListener('compositionend', () => { composing = false; schedule(); });
  input.addEventListener('input', () => {
    clearBtn.classList.toggle('show', input.value.length > 0);
    if (!composing) schedule();
  });
  input.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); });
  clearBtn.addEventListener('click', clearSearch);
}

/* ---------- 跳轉面板 ---------- */
let JUMP_ITEMS = [];
let JUMP_TITLE = '跳到年度';
function buildJump() {
  const fab = document.getElementById('jumpFab');
  const grid = document.getElementById('jumpGrid');
  document.getElementById('jumpTitle').textContent = JUMP_TITLE;
  fab.classList.toggle('show', JUMP_ITEMS.length > 0);
  grid.innerHTML = JUMP_ITEMS.map(it =>
    `<button class="jump-item${it.done ? ' done' : ''}${it.open ? ' on' : ''}" onclick="jumpTo('${it.key}')">
       <b>${it.label}</b><small>${it.sub || ''}</small></button>`
  ).join('');
  if (!JUMP_ITEMS.length) toggleJump(false);
}
function toggleJump(force) {
  const p = document.getElementById('jumpPanel');
  p.hidden = (typeof force === 'boolean') ? !force : !p.hidden;
}
function scrollToGroup(key) {
  const el = document.getElementById('g-' + key);
  if (!el) return;
  const ctrl = document.querySelector('.controls');
  const top = el.getBoundingClientRect().top + window.scrollY - (ctrl ? ctrl.offsetHeight : 0) - 10;
  const root = document.documentElement;
  root.style.scrollBehavior = 'auto';          // 跳轉用瞬間定位，避免長距離捲動動畫
  window.scrollTo(0, Math.max(0, top));
  root.style.scrollBehavior = '';
}
document.addEventListener('click', e => {
  const p = document.getElementById('jumpPanel');
  if (p && !p.hidden && !p.contains(e.target) && !e.target.closest('#jumpFab')) p.hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleJump(false); });

/* ---------- 搜尋欄位索引 ---------- */
function plainAnswer(md) {
  return String(md || '')
    .replace(/```(?:htmldiagram|tree)\n[\s\S]*?```/g, ' ')   // 圖表/樹狀圖的 HTML、JSON 不列入搜尋
    .replace(/^#{1,4}\s+/gm, '')
    .replace(/\*\*|`/g, '')
    .replace(/\|/g, ' ')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
function searchIndex(q) {
  return q._ix || (q._ix = {
    title: normText(stripTags(q.title)),
    ques:  normText(stripTags(q.question)),
    ans:   normText(plainAnswer(q.answer)),
    code:  normText(q.code ? q.code.text : ''),
    meta:  normText(q.year + ' ' + q.year + '年 第' + q.no + '題 ' +
                    ((TOPIC_INFO[q.topic] || {}).name || '') + ' ' + (q.part || ''))
  });
}
function searchFields(q) {
  const ix = searchIndex(q);
  return [{ t: ix.title, w: 10 }, { t: ix.ques, w: 6 }, { t: ix.ans, w: 3 },
          { t: ix.code, w: 2 }, { t: ix.meta, w: 1 }];
}
function bodyHit(q) {
  const ix = searchIndex(q);
  return state.terms.some(t => ix.ques.includes(t) || ix.ans.includes(t) || ix.code.includes(t));
}

/* ---------- 輕量 Markdown 渲染 ---------- */
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMarkdown(md) {
  // 先抽出 ``` 程式碼/ASCII 區塊
  const blocks = [];
  md = md.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => {
    blocks.push({ lang, code });
    return `\u0000BLOCK${blocks.length - 1}\u0000`;
  });

  const lines = md.split('\n');
  let html = '', i = 0;

  while (i < lines.length) {
    let line = lines[i];

    // 區塊佔位
    if (/^\u0000BLOCK\d+\u0000$/.test(line.trim())) {
      const idx = parseInt(line.trim().match(/\d+/)[0]);
      const b = blocks[idx];
      // html-diagram 圍欄：直接輸出 HTML（用於圖表），不做跳脫
      if (b.lang === 'htmldiagram') {
        html += `<div class="html-diagram">${b.code}</div>`;
      } else if (b.lang === 'tree') {
        // tree 圍欄：JSON 樹資料 → 自動產生對齊的 SVG 樹狀圖
        html += `<div class="html-diagram">${renderTreeSVG(b.code)}</div>`;
      } else {
        const text = b.code.replace(/\n$/, '');
        const lang = resolveLang(b.lang, text);
        html += lang
          ? codeBlockHtml({ lang, text })
          : `<pre><code>${escapeHtml(text)}</code></pre>`;
      }
      i++; continue;
    }

    // 表格
    if (line.includes('|') && i + 1 < lines.length &&
        /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1])) {
      const headers = line.split('|').map(c => c.trim()).filter(c => c !== '');
      i += 2;
      let rows = [];
      while (i < lines.length && lines[i].includes('|')) {
        const cells = lines[i].split('|').map(c => c.trim());
        // 去除頭尾空白格
        if (cells[0] === '') cells.shift();
        if (cells[cells.length-1] === '') cells.pop();
        rows.push(cells);
        i++;
      }
      html += '<table><thead><tr>' +
        headers.map(h => `<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r => '<tr>' +
          r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }

    // 標題
    let m;
    if ((m = line.match(/^####\s+(.*)/))) { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }
    if ((m = line.match(/^###\s+(.*)/)))  { html += `<h4>${inline(m[1])}</h4>`; i++; continue; }

    // 無序清單
    if (/^\s*[-*]\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*[-*]\s+/, ''));
        i++;
      }
      html += '<ul>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ul>';
      continue;
    }
    // 有序清單
    if (/^\s*\d+\.\s+/.test(line)) {
      let items = [];
      while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*\d+\.\s+/, ''));
        i++;
      }
      html += '<ol>' + items.map(it => `<li>${breakSentences(inline(it))}</li>`).join('') + '</ol>';
      continue;
    }

    // 空行
    if (line.trim() === '') { i++; continue; }

    // 一般段落（合併連續非空行）
    let para = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== '' &&
           !/^\s*[-*]\s+/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) &&
           !/^#{3,4}\s/.test(lines[i]) &&
           !/^\u0000BLOCK\d+\u0000$/.test(lines[i].trim()) &&
           !(lines[i].includes('|') && i+1 < lines.length &&
             /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i+1]))) {
      para.push(lines[i]); i++;
    }
    html += `<p>${para.map(l => breakSentences(inline(l))).join('<br>')}</p>`;
  }
  return html;
}

// 行內語法：**粗體**、`code`、<u>底線</u>
function inline(s) {
  // 先抽出 `code` 片段保護起來，其餘文字才做標籤還原與粗體
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => { codes.push(c); return '\u0001' + (codes.length - 1) + '\u0001'; });
  s = escapeHtml(s);
  // 還原資料中直接寫的白名單標籤（<u> 用於標示主鍵）
  s = s.replace(/&lt;(\/?)(strong|code|sub|sup|u)&gt;/g, '<$1$2>');
  s = s.replace(/&lt;br\s*\/?&gt;/g, '<br>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => '<code>' + escapeHtml(codes[+i]) + '</code>');
  return s;
}

/* ---------- 二元樹 SVG 產生器 ---------- */
// 輸入 JSON：{ "v":"根值", "l":{子樹}, "r":{子樹} }
// l/r 可省略；空子樹可用 null。採對稱佈局：節點置於左右子樹正中央，
// 單子節點向左/右偏移固定距離，使左右視覺平衡。
function renderTreeSVG(json) {
  let root;
  try { root = JSON.parse(json.trim()); }
  catch (e) { return `<pre><code>樹資料格式錯誤</code></pre>`; }

  const NODE_R  = 21;       // 節點圓半徑
  const H_UNIT  = 32;       // 水平基本單位
  const V_GAP   = 76;       // 層與層垂直間距
  const PAD     = 30;       // 邊界留白

  // ── 遞迴佈局：回傳該子樹的 {width, rootX}（皆以 H_UNIT 為單位）──
  // 做法：左子樹先排好佔據 [0, lw)，右子樹排在 [lw+gap, ...)，
  //       父節點 x = 左右子根的中點；單子節點則讓父在子的對側偏移一格，
  //       使整棵子樹仍保有對稱的視覺重心。
  function layout(node, depth) {
    node._d = depth;
    const L = node.l, R = node.r;

    // 葉節點：寬度 1，根在 0
    if (!L && !R) {
      node._w = 1;
      node._x = 0;
      return;
    }

    // 雙子：左右子樹各自佈局，並排放置
    if (L && R) {
      layout(L, depth + 1);
      layout(R, depth + 1);
      const gap = 1;                         // 左右子樹之間留 1 單位
      // 左子樹佔 [0, L._w)，右子樹整體右移 L._w + gap
      const shift = L._w + gap;
      offset(R, shift);
      node._w = L._w + gap + R._w;
      node._x = (L._x + R._x) / 2;           // 父 = 左右子根中點
      return;
    }

    // 單左子：左子樹佈局後，父放在「左子根右側一格」
    if (L) {
      layout(L, depth + 1);
      node._x = L._x + 1;                    // 父在左子根右邊一格
      // 整棵子樹寬度 = 左子樹寬度，但要確保涵蓋父節點 x
      node._w = Math.max(L._w, node._x + 1);
      return;
    }

    // 單右子：右子樹佈局後，父放在「右子根左側一格」
    {
      layout(R, depth + 1);
      // 父在右子根左邊一格；若會 < 0 則整體右移
      let px = R._x - 1;
      if (px < 0) { offset(R, -px); px = 0; }
      node._x = px;
      node._w = Math.max(R._w + (px < 0 ? -px : 0), node._x + 1,
                         R._x + 1);
      return;
    }
  }
  // 把以 node 為根的整棵子樹所有 _x 平移 dx
  function offset(node, dx) {
    if (!node) return;
    node._x += dx;
    offset(node.l, dx);
    offset(node.r, dx);
  }
  layout(root, 0);

  // 收集座標範圍
  let minX = Infinity, maxX = -Infinity, maxDepth = 0;
  (function scan(node) {
    if (!node) return;
    minX = Math.min(minX, node._x);
    maxX = Math.max(maxX, node._x);
    maxDepth = Math.max(maxDepth, node._d);
    scan(node.l); scan(node.r);
  })(root);

  const width  = (maxX - minX) * H_UNIT + PAD * 2 + NODE_R * 2;
  const height = maxDepth * V_GAP + PAD * 2 + NODE_R * 2;

  function cx(node) { return PAD + NODE_R + (node._x - minX) * H_UNIT; }
  function cy(node) { return PAD + NODE_R + node._d * V_GAP; }

  // 第三遍：產生連線與節點
  let edges = '', nodes = '';
  function draw(node) {
    if (!node) return;
    const x = cx(node), y = cy(node);
    ['l', 'r'].forEach(side => {
      const child = node[side];
      if (child) {
        edges += `<line x1="${x}" y1="${y}" x2="${cx(child)}" y2="${cy(child)}" `
               + `stroke="#3d4456" stroke-width="2"/>`;
        draw(child);
      }
    });
    const palette = {
      accent: ['#fbf3f0', '#8a3324', '#8a3324'],
      blue:   ['#eef4f7', '#1f5673', '#1f5673'],
      gold:   ['#faf5e6', '#a07e2c', '#7a5d1e'],
      dim:    ['#e8e3d6', '#b3a98f', '#8a8266'],
      ink:    ['#1a1f2c', '#1a1f2c', '#ffffff'],
    };
    const [fill, stroke, txt] = palette[node.t] || palette.ink;
    nodes += `<circle cx="${x}" cy="${y}" r="${NODE_R}" `
           + `fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>`
           + `<text x="${x}" y="${y + 5}" text-anchor="middle" `
           + `font-size="15" font-weight="700" fill="${txt}">`
           + escapeHtml(String(node.v)) + `</text>`;
  }
  draw(root);

  return `<svg viewBox="0 0 ${width} ${height}" xmlns="http://www.w3.org/2000/svg" `
       + `style="max-width:${width}px;width:100%;font-family:'Noto Sans TC',sans-serif;">`
       + edges + nodes + `</svg>`;
}

/* ---------- 語言判斷 ---------- */
const LANG_ALIAS = {
  sql:'sql', mysql:'sql', tsql:'sql', plsql:'sql', pgsql:'sql',
  c:'c', cpp:'c', 'c++':'c',
  java:'java', python:'python', py:'python',
  javascript:'javascript', js:'javascript', php:'php',
  pseudo:'pseudo', pseudocode:'pseudo',
  text:'', txt:'', plain:''          // 明確指定純文字 → 不上色
};
function detectLang(code) {
  const t = code.trim();
  if (/[│─┌└├┐┘▶▼◀▲╱╲]/.test(t)) return '';                       // ASCII 圖
  if (/^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE|ALTER|DROP|WITH)\b/i.test(t)) return 'sql';
  if (/#include|\bint\s+main\s*\(/.test(t)) return 'c';
  if (/\b(public|private)\s+(class|static|void)|System\.out/.test(t)) return 'java';
  if (/^\s*(def\s|import\s+\w+|from\s+\w+\s+import)/m.test(t)) return 'python';
  if (/^\s*(Algorithm|Function|Procedure)\b|\bthen\b|\bend\s+(if|while|for)\b|←/i.test(t)) return 'pseudo';
  return '';
}
function resolveLang(lang, code) {
  const k = (lang || '').toLowerCase();
  if (k && Object.prototype.hasOwnProperty.call(LANG_ALIAS, k)) return LANG_ALIAS[k];
  return detectLang(code);
}

const SQL_KW = new Set(('SELECT FROM WHERE GROUP BY ORDER HAVING ASC DESC JOIN INNER LEFT RIGHT FULL OUTER ON AS ' +
  'AND OR NOT IN IS NULL LIKE BETWEEN EXISTS UNION ALL DISTINCT TOP LIMIT OFFSET FETCH FIRST ROWS ROW ONLY ' +
  'CASE WHEN THEN ELSE END INSERT INTO VALUES UPDATE SET DELETE REPLACE CREATE TABLE INDEX VIEW TRIGGER DROP ' +
  'ALTER ADD PRIMARY KEY FOREIGN REFERENCES CONSTRAINT UNIQUE DEFAULT CLUSTER BEFORE AFTER FOR EACH BEGIN ' +
  'DECLARE IF SIGNAL SQLSTATE MESSAGE_TEXT WITH USING NEW OLD').split(' '));
const SQL_TYPE = new Set('INT INTEGER CHAR VARCHAR DATETIME DATE TIMESTAMP DECIMAL FLOAT DOUBLE TEXT BOOLEAN'.split(' '));
const PSEUDO_KW = new Set(('ALGORITHM FUNCTION PROCEDURE INPUT OUTPUT IF THEN ELSE FOR TO DO WHILE END RETURN ' +
  'AND OR NOT NULL IS EMPTY').split(' '));

/* ---------- 程式碼語法 highlight（逐字元 tokenizer）---------- */
function highlightCode(code, lang) {
  lang = LANG_ALIAS[(lang || '').toLowerCase()] || (lang || '').toLowerCase();
  const kw = {
    c: ['int','char','void','return','if','else','for','while','do','struct','typedef','bool','long','double','float','define','include','sizeof','static','const','unsigned','break','continue','switch','case','NULL','true','false'],
    java: ['public','private','protected','class','int','void','return','if','else','for','while','do','new','static','final','abstract','extends','implements','import','package','this','super','boolean','double','String','char','long','float','try','catch','throw','throws','interface','null','true','false','break','continue'],
    python: ['def','return','if','elif','else','for','while','import','from','as','with','try','except','finally','class','None','True','False','and','or','not','in','is','lambda','break','continue','global','print'],
    javascript: ['function','return','if','else','for','while','let','const','var','new','class','this','try','catch','import','export','from','null','true','false','typeof','break','continue','console'],
    php: ['function','return','if','else','elseif','for','while','foreach','as','class','new','public','private','echo','true','false','null','require','include']
  };
  const isSql = lang === 'sql', isPseudo = lang === 'pseudo';
  const list = new Set(kw[lang] || kw.c);

  let out = '', i = 0;
  const n = code.length;
  const wrap = (cls, text) => `<span class="${cls}">${escapeHtml(text)}</span>`;
  const isWordChar = c => /[A-Za-z0-9_@]/.test(c);
  const isDigit = c => c >= '0' && c <= '9';

  while (i < n) {
    const c = code[i];
    const two = code.substr(i, 2);

    if (two === '/*') {
      let j = code.indexOf('*/', i + 2);
      j = (j === -1) ? n : j + 2;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (two === '//' && !isSql) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (two === '--' && isSql) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (c === '#' && (lang === 'python' || lang === 'php')) {
      let j = code.indexOf('\n', i); if (j === -1) j = n;
      out += wrap('tok-com', code.slice(i, j)); i = j; continue;
    }
    if (lang === 'python' && (code.startsWith('"""', i) || code.startsWith("'''", i))) {
      const q = code.substr(i, 3);
      let j = code.indexOf(q, i + 3); j = (j === -1) ? n : j + 3;
      out += wrap('tok-str', code.slice(i, j)); i = j; continue;
    }
    if (c === '"' || c === "'") {
      let j = i + 1;
      while (j < n && code[j] !== c) { if (code[j] === '\\') j++; j++; }
      j = Math.min(j + 1, n);
      out += wrap('tok-str', code.slice(i, j)); i = j; continue;
    }
    if (isDigit(c)) {
      let j = i;
      while (j < n && /[0-9.]/.test(code[j])) j++;
      out += wrap('tok-num', code.slice(i, j)); i = j; continue;
    }
    if (isWordChar(c) && !isDigit(c)) {
      let j = i;
      while (j < n && isWordChar(code[j])) j++;
      const word = code.slice(i, j), up = word.toUpperCase();
      if (isSql) {
        if (SQL_TYPE.has(up))      out += wrap('tok-typ', word);
        else if (SQL_KW.has(up))   out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      } else if (isPseudo) {
        if (PSEUDO_KW.has(up))     out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      } else {
        if (list.has(word))        out += wrap('tok-kw', word);
        else if (code[j] === '(')  out += wrap('tok-fn', word);
        else                       out += escapeHtml(word);
      }
      i = j; continue;
    }
    out += escapeHtml(c);
    i++;
  }
  return out;
}

function codeBlockHtml(codeObj) {
  if (!codeObj) return '';
  const langLabel = {
    c: 'C', java: 'Java', python: 'Python', javascript: 'JavaScript',
    php: 'PHP', sql: 'SQL', pseudo: '虛擬碼'
  }[codeObj.lang] || codeObj.lang;
  return `<div class="code-block">
    <div class="code-head">
      <span class="dots"><span></span><span></span><span></span></span>
      <span>${langLabel}</span>
    </div>
    <pre><code>${highlightCode(codeObj.text, codeObj.lang)}</code></pre>
  </div>`;
}

/* ---------- 渲染題目卡 ---------- */
/* QFENCE：考題中的程式碼圍欄 ``` 轉成程式碼區塊（避免原樣顯示、長行撐破版面） */
function qFences(h) {
  return h.replace(/```[a-z]*\n([\s\S]*?)\n```/g, (m, c) =>
    '<pre style="background:#2b303b;color:#eee;padding:.7rem 1rem;border-radius:6px;overflow-x:auto;margin:.5rem 0;font-size:.85rem;white-space:pre">' + c + '</pre>');
}

function bodyHtml(q) {
  return `      <span class="section-label q">考題</span>
      <div class="q-question">${qFences(escapeHtml(q.question)).replace(/&lt;u&gt;([\s\S]*?)&lt;\/u&gt;/g, '<u>$1</u>')}</div>
      <span class="section-label a">詳解</span>
      <div class="q-answer">${renderMarkdown(q.answer)}</div>
      ${q.code ? codeBlockHtml(q.code) : ''}`;
}

function fillBody(card) {
  if (card.dataset.filled) return;
  const q = ALL_Q.find(x => x.id === card.dataset.id);
  if (!q) return;
  const box = card.querySelector('.q-body');
  box.innerHTML = bodyHtml(q);
  card.dataset.filled = '1';
  if (state.terms.length) highlightIn(box, state.terms);
}

function questionCard(q, forceOpen) {
  const t = TOPIC_INFO[q.topic] || { name: q.topicName, cls: '' };
  const isOpen = openIds.has(q.id) || !!forceOpen;
  return `<div class="q-card ${t.cls}${isOpen ? ' open' : ''}" data-id="${q.id}"${isOpen ? ' data-filled="1"' : ''}>
    <div class="q-header" onclick="toggleCard(this)">
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-title">${escapeHtml(q.title)}</div>
        <div class="q-tags">
          <span class="tag tag-topic">${t.name}</span>
          <span class="tag tag-year">${q.year}年</span>
          ${q.part ? `<span class="tag tag-part">${escapeHtml(q.part)}　第${q.no}題</span>` : ''}
          <span class="tag tag-score">${q.score}分</span>
        </div>
      </div>
      <div class="q-toggle">+</div>
    </div>
    <div class="q-body">${isOpen ? bodyHtml(q) : ''}</div>
  </div>`;
}

/* ---------- 篩選 ---------- */
function filterQuestions() {
  let list = ALL_Q.filter(q => state.topic === 'all' || q.topic === state.topic);
  if (state.terms.length) {
    // 多關鍵字 AND、全形半形統一、依相關度排序（標題 > 考題 > 詳解 > 程式碼）
    list = list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }
  return list;
}

/* ---------- 渲染主內容 ---------- */
function updateSearchInfo(count, autoOpen) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (count > 30) h += ' ‧ 結果較多，已不自動展開詳解，可再加關鍵字縮小範圍';
  else h += ' ‧ 詳解中有符合的題目已自動展開並標黃';
  el.innerHTML = h;
  el.classList.add('show');
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  const autoOpen = searching && list.length <= 30;
  JUMP_ITEMS = [];
  updateSearchInfo(list.length, autoOpen);

  if (list.length === 0) {
    const msg = searching
      ? `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`
      : '找不到符合條件的題目';
    wrap.innerHTML = `<div class="empty">
      <div class="big">📭</div>
      <p>${msg}</p>
    </div>`;
    buildJump();
    syncExpandBtn();
    return;
  }

  let html = '';

  if (searching) {
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      ${list.map(q => questionCard(q, autoOpen && bodyHit(q))).join('')}
    </div>`;
  } else if (state.mode === 'year') {
    JUMP_TITLE = '跳到年度';
    // 依年度分組
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
    years.forEach(yr => {
      const qs = byYear[yr];
      const yObj = ALL_YEARS.find(y => y.year === yr);
      const totalScore = qs.reduce((s, q) => s + q.score, 0);
      JUMP_ITEMS.push({ key: 'y' + yr, label: yr, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-y${yr}">
        <div class="group-head">
          <span class="g-badge">${yr} 年</span>
          <span class="g-title">${escapeHtml(yObj.subject)}</span>
          <span class="g-meta">
            ${yObj.timeLimit ? '考試時間 ' + yObj.timeLimit + '<br>' : ''}
            本頁 ${qs.length} 題 / ${totalScore} 分
          </span>
        </div>
        ${yObj.note ? `<div class="group-note">※ ${escapeHtml(yObj.note)}</div>` : ''}
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  } else {
    JUMP_TITLE = '跳到主題';
    // 依主題分組
    const byTopic = {};
    list.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    Object.keys(TOPIC_INFO).forEach(tk => {
      const qs = byTopic[tk];
      if (!qs || qs.length === 0) return;
      // 同主題內依年度新到舊、再依題號
      qs.sort((a, b) => Number(b.year) - Number(a.year));
      const t = TOPIC_INFO[tk];
      JUMP_ITEMS.push({ key: 't' + tk, label: t.name, sub: `${qs.length} 題` });
      html += `<div class="group" id="g-t${tk}">
        <div class="group-head">
          <span class="g-badge">${t.name}</span>
          <span class="g-title">歷年同類考題彙整</span>
          <span class="g-meta">共 ${qs.length} 題<br>跨 ${new Set(qs.map(q=>q.year)).size} 個年度</span>
        </div>
        ${qs.map(q => questionCard(q)).join('')}
      </div>`;
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  buildJump();
  syncExpandBtn();
}

function jumpTo(key) {
  toggleJump(false);
  scrollToGroup(key);
}

/* ---------- 互動 ---------- */
function toggleCard(headerEl) {
  const card = headerEl.parentElement;
  const open = card.classList.toggle('open');
  if (open) fillBody(card);
  if (open) openIds.add(card.dataset.id); else openIds.delete(card.dataset.id);
  syncExpandBtn();
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}

function updateStatBar() {
  const scope = ALL_Q;
  const yearSet = new Set(scope.map(q => q.year));
  document.getElementById('statYear').textContent = yearSet.size;
  document.getElementById('statQ').textContent = scope.length;
  document.getElementById('statTopic').textContent = new Set(scope.map(q => q.topic)).size;
}

function rebuildTopicChips() {
  const scope = ALL_Q;
  const topicCount = {};
  scope.forEach(q => topicCount[q.topic] = (topicCount[q.topic]||0)+1);
  const filterRow = document.getElementById('filterRow');
  let chips = `<button class="chip ${state.topic === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopic('all')">全部<span class="c-count">${scope.length}</span></button>`;
  Object.keys(TOPIC_INFO).forEach(tk => {
    const cnt = topicCount[tk] || 0;
    if (cnt === 0) return;
    chips += `<button class="chip ${state.topic === tk ? 'active' : ''}" data-topic="${tk}"
      onclick="setTopic('${tk}')">${TOPIC_INFO[tk].name}<span class="c-count">${cnt}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

function setTopic(topic) {
  state.topic = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}

/* 按鈕文字依「目前畫面上的卡片是否都已展開」決定，不再用獨立旗標 */
function syncExpandBtn() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  document.getElementById('btnExpand').textContent = allOpen ? '全部收合' : '全部展開';
}
function toggleExpandAll() {
  const cards = [...document.querySelectorAll('.q-card')];
  const allOpen = cards.length > 0 && cards.every(c => c.classList.contains('open'));
  cards.forEach(c => {
    c.classList.toggle('open', !allOpen);
    if (!allOpen) fillBody(c);
    if (allOpen) openIds.delete(c.dataset.id); else openIds.add(c.dataset.id);
  });
  syncExpandBtn();
}

/* ---------- 初始化 ---------- */
function init() {
  updateStatBar();
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
