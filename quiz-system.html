<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經濟部新進職員甄試｜計算機原理・網路概論 選擇題刷題系統</title>
<style>/* ===== 經濟部考古題刷題系統 — 樣式（與資管/程設詳解系統一致） ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;
  --accent-2:   #1f5673;
  --gold:       #a07e2c;
  --green:      #2d6a4f;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色（計概/網概專屬） */
  --t-arch:  #1f5673;  /* 數位邏輯/CPU/記憶體 */
  --t-os:    #6a4c93;  /* 作業系統 */
  --t-ds:    #2d6a4f;  /* 資料結構與演算法 */
  --t-prog:  #b5651d;  /* 程式語言/觀念 */
  --t-net:   #1a4d6e;  /* 網路基礎/拓樸/媒介 */
  --t-tcpip: #8a3324;  /* TCP/IP 通訊協定 */
  --t-wire:  #a07e2c;  /* 無線/行動網路 */
  --t-sec:   #5c2a2a;  /* 資安 */
  --t-misc:  #4a5859;  /* 雜項 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.78;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(31,86,115,0.025) 31px, rgba(31,86,115,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent-2);
  position: relative;
}
.site-header::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -4px; height: 4px;
  background: repeating-linear-gradient(90deg, var(--accent-2) 0 18px, transparent 18px 36px);
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.55rem, 4.2vw, 2.6rem);
  letter-spacing: .05em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent-2);
  color: var(--accent-2); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-3deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .88rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; min-width: 70px; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.6rem; color: var(--accent-2); line-height: 1;
}
.stat-bar .num.correct { color: var(--green); }
.stat-bar .num.wrong { color: var(--accent); }
.stat-bar .lbl {
  font-size: .7rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgba(244,241,234,0.97);
  backdrop-filter: blur(8px);
  border-bottom: 1.5px solid var(--line);
  padding: .85rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1rem; font-size: .85rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
  border-right: 1px solid var(--ink);
}
.mode-switch button:last-child { border-right: none; }
.mode-switch button.active { background: var(--ink); color: var(--paper); }
.mode-switch button:hover:not(.active) { background: rgba(26,31,44,0.08); }

.group-switch {
  display: flex; border: 1.5px solid var(--ink-soft); border-radius: 8px;
  overflow: hidden;
}
.group-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem .85rem; font-size: .82rem; font-weight: 500;
  color: var(--ink-soft); transition: all .18s;
  border-right: 1px solid var(--line);
}
.group-switch button:last-child { border-right: none; }
.group-switch button.active { background: var(--ink-soft); color: var(--paper); }

.search-box {
  flex: 1; min-width: 160px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .5rem .85rem .5rem 2.1rem; font-size: .88rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .65rem; top: 50%;
  transform: translateY(-50%); font-size: .82rem; opacity: .5;
}

.btn-small {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .85rem; font-size: .8rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-small:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-small.danger { border-color: var(--accent); color: var(--accent); }
.btn-small.danger:hover { background: var(--accent); color: var(--paper); border-color: var(--accent); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1100px; margin: .7rem auto 0;
  display: flex; gap: .4rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 999px;
  padding: .35rem .9rem; font-size: .78rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink); font-weight: 700;
}
.chip .c-count {
  opacity: .65; font-size: .9em; margin-left: .25em;
}

/* ===== 主內容 ===== */
.wrap {
  max-width: 1100px; margin: 1.5rem auto; padding: 0 1.5rem;
}

/* 群組標題 */
.group {
  margin-bottom: 2.5rem;
}
.group-head {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.2rem; margin-bottom: 1.2rem;
  background: linear-gradient(180deg, var(--card), var(--paper-warm));
  border: 1px solid var(--line); border-left: 4px solid var(--accent-2);
  border-radius: 4px;
  flex-wrap: wrap;
}
.group-head .g-badge {
  background: var(--ink); color: var(--paper);
  padding: .25rem .8rem; border-radius: 4px;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.05rem; letter-spacing: .04em;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .78rem; color: var(--ink-soft);
  text-align: right; line-height: 1.4;
}

/* ===== 題目卡片 ===== */
.q-list {
  display: grid; gap: 1rem;
}
.q-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.q-card:hover { border-color: var(--ink-soft); }
.q-card.answered.correct { border-left: 4px solid var(--green); }
.q-card.answered.wrong { border-left: 4px solid var(--accent); }
.q-card.bookmarked { box-shadow: 0 0 0 1.5px var(--gold) inset; }

.q-head {
  padding: .9rem 1.1rem;
  display: flex; align-items: flex-start; gap: .9rem;
  border-bottom: 1px solid var(--line);
}
.q-no {
  flex-shrink: 0;
  width: 2.3rem; height: 2.3rem;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: .95rem; border-radius: 4px;
}
.q-card.answered.correct .q-no { background: var(--green); }
.q-card.answered.wrong .q-no { background: var(--accent); }

.q-headmain { flex: 1; min-width: 0; }
.q-text {
  font-size: .98rem; color: var(--ink); line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}
.q-text code, .q-stem-code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--paper-warm); padding: .05em .35em;
  border-radius: 3px; font-size: .92em;
}

.q-tags {
  margin-top: .6rem;
  display: flex; flex-wrap: wrap; gap: .35rem;
}
.tag {
  font-size: .68rem; padding: .15rem .55rem;
  border-radius: 99px; letter-spacing: .04em;
  font-weight: 500; line-height: 1.5;
}
.tag-topic { color: #fff; font-weight: 700; }
.t-arch  .tag-topic { background: var(--t-arch); }
.t-os    .tag-topic { background: var(--t-os); }
.t-ds    .tag-topic { background: var(--t-ds); }
.t-prog  .tag-topic { background: var(--t-prog); }
.t-net   .tag-topic { background: var(--t-net); }
.t-tcpip .tag-topic { background: var(--t-tcpip); }
.t-wire  .tag-topic { background: var(--t-wire); }
.t-sec   .tag-topic { background: var(--t-sec); }
.t-misc  .tag-topic { background: var(--t-misc); }

.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-no {
  background: transparent; color: var(--ink-soft);
  border: 1px dashed var(--line);
}
.tag-multi {
  background: var(--accent); color: var(--paper);
  border: 1px solid var(--accent);
  font-weight: 700;
}
.submit-btn {
  background: var(--accent-2); color: var(--paper);
  border: none; padding: .45rem 1.1rem;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700; font-size: .82rem;
  border-radius: 4px; cursor: pointer;
  letter-spacing: .06em;
  transition: background .15s;
}
.submit-btn:hover:not(:disabled) { background: var(--ink); }
.submit-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

.q-bookmark {
  flex-shrink: 0;
  font-size: 1.4rem; line-height: 1;
  background: none; border: none; cursor: pointer;
  color: var(--line); padding: 0; transition: color .15s, transform .15s;
}
.q-bookmark:hover { transform: scale(1.15); }
.q-bookmark.on { color: var(--gold); }

/* ===== 選項 ===== */
.q-body { padding: 1rem 1.1rem; }
.options {
  display: grid; gap: .55rem;
}
.opt {
  display: flex; align-items: flex-start; gap: .7rem;
  padding: .7rem .9rem;
  border: 1.5px solid var(--line); border-radius: 5px;
  background: var(--card); cursor: pointer;
  transition: all .15s;
  font-size: .92rem; line-height: 1.55;
}
.opt:hover { background: var(--paper-warm); border-color: var(--ink-soft); }
.opt .opt-letter {
  flex-shrink: 0;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--paper-warm); color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: .85rem;
  border: 1.5px solid var(--line);
}
.opt .opt-text {
  flex: 1; white-space: pre-wrap; word-break: break-word;
}
.opt.user-selected {
  border-color: var(--accent-2); background: rgba(31,86,115,0.06);
}
.opt.user-selected .opt-letter {
  background: var(--accent-2); color: #fff; border-color: var(--accent-2);
}
/* 答案揭曉後 */
.q-card.revealed .opt { cursor: default; }
.q-card.revealed .opt.correct {
  border-color: var(--green); background: rgba(45,106,79,0.08);
}
.q-card.revealed .opt.correct .opt-letter {
  background: var(--green); color: #fff; border-color: var(--green);
}
.q-card.revealed .opt.user-selected.wrong {
  border-color: var(--accent); background: rgba(138,51,36,0.07);
}
.q-card.revealed .opt.user-selected.wrong .opt-letter {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.q-card.revealed .opt:hover { background: var(--card); }
.q-card.revealed .opt.correct:hover { background: rgba(45,106,79,0.08); }

/* 提示「正確答案」徽章 */
.correct-mark, .wrong-mark {
  margin-left: auto; flex-shrink: 0;
  font-size: .72rem; padding: .1rem .5rem;
  border-radius: 3px; font-weight: 700;
  letter-spacing: .05em;
}
.correct-mark { background: var(--green); color: #fff; }
.wrong-mark { background: var(--accent); color: #fff; }

/* ===== 解析區 ===== */
.explain {
  margin-top: .9rem; padding: .9rem 1rem;
  border: 1px dashed var(--accent-2);
  background: rgba(31,86,115,0.04);
  border-radius: 4px;
  font-size: .9rem; line-height: 1.7;
  color: var(--ink);
}
.explain-label {
  display: inline-block;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: .75rem; letter-spacing: .15em;
  background: var(--accent-2); color: #fff;
  padding: .1rem .5rem; border-radius: 3px; margin-bottom: .55rem;
}
.explain strong { color: var(--accent-2); }
.explain code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--paper-warm); padding: .05em .35em;
  border-radius: 3px; font-size: .92em;
}
.explain p { margin: .35rem 0; }
.explain ul { margin: .35rem 0 .35rem 1.25rem; }
.explain li { margin: .15rem 0; }

/* ===== 動作按鈕（每題下方） ===== */
.q-actions {
  margin-top: .9rem; display: flex; gap: .5rem; flex-wrap: wrap;
}
.q-actions button {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 5px;
  padding: .35rem .8rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.q-actions button:hover { background: var(--ink-soft); color: var(--paper); border-color: var(--ink-soft); }
.q-actions button.reveal-btn { border-color: var(--accent-2); color: var(--accent-2); }
.q-actions button.reveal-btn:hover { background: var(--accent-2); color: #fff; }

/* ===== 空狀態 ===== */
.empty {
  text-align: center; padding: 4rem 1.5rem; color: var(--ink-soft);
}
.empty .big { font-size: 3rem; margin-bottom: .8rem; opacity: .35; }

/* ===== 回頂部 ===== */
.to-top {
  position: fixed; right: 1.2rem; bottom: 1.2rem; z-index: 100;
  width: 2.6rem; height: 2.6rem; border: none;
  border-radius: 50%; background: var(--ink); color: var(--paper);
  font-size: 1.1rem; cursor: pointer;
  box-shadow: 0 4px 12px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top:hover { background: var(--accent-2); }

/* ===== 頁尾 ===== */
.site-footer {
  margin-top: 3rem; padding: 2rem 1.5rem 1.5rem;
  background: var(--ink); color: #b8bcca;
  text-align: center; font-size: .82rem;
}
.site-footer p { margin: .3rem 0; }
.site-footer strong { color: var(--paper); }

/* ===== 響應式 ===== */
@media (max-width: 640px) {
  .site-header { padding: 1.8rem 1rem 1.5rem; }
  .stat-bar { gap: 1.2rem; padding: .8rem 1rem; }
  .stat-bar .num { font-size: 1.3rem; }
  .controls { padding: .7rem .9rem; }
  .controls-inner { gap: .5rem; }
  .filter-row { gap: .3rem; }
  .chip { padding: .3rem .7rem; font-size: .73rem; }
  .wrap { padding: 0 .8rem; margin: 1rem auto; }
  .group-head { padding: .8rem 1rem; }
  .group-head .g-meta { margin-left: 0; text-align: left; font-size: .72rem; }
  .q-head { padding: .75rem .85rem; gap: .6rem; }
  .q-no { width: 2rem; height: 2rem; font-size: .85rem; }
  .q-text { font-size: .92rem; }
  .q-body { padding: .85rem; }
  .opt { padding: .6rem .75rem; font-size: .88rem; }
}
</style>
</head>
<body>

<header class="site-header">
  <div class="kicker">經濟部所屬事業機構 ‧ 新進職員甄試</div>
  <h1>計算機原理 <span class="stamp">＋</span> 網路概論</h1>
  <div class="sub">歷年單選題 ‧ 刷題系統 ‧ 自動記錄答題與錯題</div>
</header>

<div class="stat-bar">
  <div class="stat"><div class="num" id="statTotal">—</div><div class="lbl">題目總數</div></div>
  <div class="stat"><div class="num" id="statYears">—</div><div class="lbl">考試年度</div></div>
  <div class="stat"><div class="num" id="statAnswered">0</div><div class="lbl">已作答</div></div>
  <div class="stat"><div class="num correct" id="statCorrect">0</div><div class="lbl">答對</div></div>
  <div class="stat"><div class="num wrong" id="statWrong">0</div><div class="lbl">答錯</div></div>
  <div class="stat"><div class="num" id="statRate">—</div><div class="lbl">正確率</div></div>
</div>

<div class="controls">
  <div class="controls-inner">
    <div class="mode-switch">
      <button class="active" data-mode="quiz" onclick="setMode('quiz')">刷題模式</button>
      <button data-mode="review" onclick="setMode('review')">閱讀模式</button>
      <button data-mode="wrong" onclick="setMode('wrong')">錯題複習</button>
      <button data-mode="bookmark" onclick="setMode('bookmark')">已收藏</button>
    </div>
    <div class="group-switch">
      <button class="active" data-group="year" onclick="setGroup('year')">依年度</button>
      <button data-group="topic" onclick="setGroup('topic')">依主題</button>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜尋題目關鍵字…">
    </div>
    <button class="btn-small" onclick="shuffleQuestions()">🔀 隨機排序</button>
    <button class="btn-small danger" onclick="resetProgress()">重設進度</button>
  </div>
  <div class="filter-row" id="filterRow"></div>
</div>

<main class="wrap">
  <div id="content"></div>
</main>

<button class="to-top" id="toTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<footer class="site-footer">
  <p><strong>經濟部所屬事業機構 新進職員甄試</strong>　計算機原理・網路概論　刷題系統</p>
  <p>所有答案依官方公告之標準答案標示；解析為依專業知識編寫之參考說明。</p>
  <p style="margin-top:.6rem; opacity:.7;">作答進度自動儲存於本機瀏覽器 ‧ 切換裝置不會同步</p>
</footer>

<script>
/* ============================================================
   題目資料
   每題格式：
   { id: "114-1", year: "114", no: 1,
     topic: "arch",  // 主題分類代號（見 TOPIC_INFO）
     stem: "題幹文字",
     options: ["選項A", "選項B", "選項C", "選項D"],
     answer: "C",    // 正確答案字母
     explain: "解析（可含 markdown：**粗體** `代碼` <br> 換行）"
   }
   ============================================================ */

const TOPIC_INFO = {
  arch:  { name: '數位邏輯/CPU/記憶體', cls: 't-arch'  },
  os:    { name: '作業系統',             cls: 't-os'    },

  explain:"4 個 /21 子網路要聚合成 1 個前綴。每個 /21 涵蓋 2³ = 8 個 /24 區段，4 個連續 /21 涵蓋 4×8 = 32 個 C 級 = 2⁵，故聚合後遮罩減 2 位 → /19。<br>檢查起始位址：96 = 0110 0000，/19 = 前 19 位元，96 的後 5 位元為 0、且 96~127 共 32 個 C 級正好被涵蓋 → <strong>57.6.96.0/19</strong>。"
},
{ id:"114-28", year:"114", no:28, topic:"tcpip",
  stem:"TCP 的「流量控制」主要為避免下列何種情況？",
  options:["擁塞崩潰","連線飢餓","RTT 上升","接收端緩衝溢位"],
  answer:"D",
  explain:"<strong>流量控制（Flow Control）</strong>：發送端依接收端的「<strong>接收視窗（rwnd）</strong>」調整傳送速率，避免發送過快造成<strong>接收端緩衝區溢位</strong>而丟資料。是「端對端」問題。<br><strong>擁塞控制（Congestion Control）</strong>則處理「網路」壅塞（路由器/連結），是不同機制。"
},
{ id:"114-29", year:"114", no:29, topic:"wire",
  stem:"無線 Power Saving 的典型做法（以 Wi-Fi 為例），未涉及下列何者？",
  options:["STP BPDU 省電","以 TIM/Beacon 引導喚醒接收","以 ARP 抑制睡眠","TWT（Target Wake Time）或 Legacy PS（PS-Poll）"],
  answer:"A",
  explain:"Wi-Fi 省電機制：<br>• <strong>TIM/Beacon</strong>：AP 在 beacon 中以 Traffic Indication Map 通知有資料的 STA 起來收<br>• <strong>PS-Poll / Legacy PS</strong>：STA 睡眠並定期請求<br>• <strong>TWT</strong>（802.11ax）：協商喚醒時間區段<br>(A) <strong>STP BPDU</strong> 是<strong>有線網路 Spanning Tree Protocol</strong> 的訊框，與 Wi-Fi 省電無關。"
},
{ id:"114-30", year:"114", no:30, topic:"tcpip",
  stem:"MTU=1500B、IP Header=20B，若發送 2300B 負載，會產生幾個 IP 片段？",
  options:["2","3","4","5"],
  answer:"A",
  explain:"每片可載資料 = MTU − IP Header = 1500 − 20 = <strong>1480 B</strong>，且須為 8 的倍數（這裡剛好）。<br>2300 B 負載拆分：<br>• 第 1 片：1480 B<br>• 第 2 片：820 B（剩餘）<br>共 <strong>2 個片段</strong>。"
},
{ id:"114-31", year:"114", no:31, topic:"tcpip",
  stem:"若設定 DF=1 而路徑 MTU 低於封包大小，PMTUD 的關鍵回饋機制為何？",
  options:["TCP RST","路由器回 ICMP Time Exceeded","路由器回 ICMP Fragmentation Needed","ARP"],
  answer:"C",
  explain:"<strong>PMTUD（Path MTU Discovery）</strong>機制：發送端把 IP Header 的 <strong>DF（Don't Fragment）旗標設為 1</strong>。當封包遇到 MTU 較小的鏈路時，路由器無法分片，會丟棄並回送 <strong>ICMP type 3, code 4「Fragmentation Needed and DF set」</strong>，內含該鏈路的 MTU 值。發送端據此調小封包重送。"
},
{ id:"114-32", year:"114", no:32, topic:"tcpip",
  stem:"有關 ping 與 traceroute 的主要差異，下列何者正確？",
  options:["前者測路徑、後者測延遲","前者測可達性，後者推路徑節點","前者用 TCP，後者用 UDP","前者應用層，後者傳輸層"],
  answer:"B",
  explain:"<strong>ping</strong>：以 ICMP Echo Request/Reply 測試目標「<strong>可達性</strong>」與 RTT。<br><strong>traceroute</strong>：藉<strong>遞增 TTL</strong> 觸發每一跳路由器回 ICMP Time Exceeded，逐跳「<strong>推導出整條路徑的節點</strong>」。<br>兩者皆在<strong>網路層</strong>（ICMP），traceroute 在 Unix 預設用 UDP 探測、Windows 的 tracert 用 ICMP。"
},
{ id:"114-33", year:"114", no:33, topic:"net",
  stem:"乙太網路 CSMA/CD 在碰撞後避免再次碰撞的機制為何？",
  options:["二元指數退避","令牌傳遞","TDMA","RTS/CTS"],
  answer:"A",
  explain:"<strong>CSMA/CD（碰撞偵測）</strong>偵測到碰撞後，採用 <strong>Binary Exponential Backoff（二元指數退避）</strong>：第 n 次碰撞後，從 [0, 2ⁿ−1] 隨機選一個時槽等待後再重試，最大上限 1024。隨碰撞次數提高，等待範圍指數成長，降低再碰撞機率。"
},
{ id:"114-34", year:"114", no:34, topic:"net",
  stem:"以交換器（switch）全雙工連線的乙太網路，網卡傳送時是否仍會線上碰撞？",
  options:["會","不會（全雙工/點對點消除碰撞域）","只在半雙工會","只在 VLAN 間會"],
  answer:"B",
  explain:"<strong>交換器 + 全雙工</strong>：每個埠形成獨立的「點對點」連線，發送與接收用不同的雙絞線對，<strong>不會發生碰撞</strong>，故 CSMA/CD 不必要。<br>反之 hub 或半雙工才會有共享碰撞域。"
},
{ id:"114-35", year:"114", no:35, topic:"wire",
  stem:"Wi-Fi 隱藏節點問題常用下列何種流程緩解？",
  options:["RTS/CTS/ACK","CSMA/CD","令牌環","MIMO"],
  answer:"A",
  explain:"<strong>隱藏節點問題</strong>：兩節點都連到同一 AP，但彼此聽不見對方，導致同時發送與 AP 衝突。<br>緩解機制：<strong>RTS/CTS（Request To Send / Clear To Send）四向交握</strong>。發送端先送 RTS 給 AP，AP 廣播 CTS 通知所有節點「該頻道將被占用」，含隱藏節點也聽到 CTS 而退讓。"
},
{ id:"114-36", year:"114", no:36, topic:"tcpip",
  stem:"HTTP 為「無狀態」，若需維持使用者狀態，常用下列何種方法？",
  options:["ARP Cache","Cookies","NAT","STP"],
  answer:"B",
  explain:"HTTP 本身無狀態（stateless），維持狀態的常用機制：<br>• <strong>Cookies</strong>（瀏覽器儲存伺服器發的識別資訊，每次請求附上）<br>• Session（伺服器端儲存）<br>• Token（如 JWT，可放於 header）<br>• LocalStorage / SessionStorage<br>ARP、NAT、STP 都是網路設施，與 HTTP 狀態無關。"
},
{ id:"114-37", year:"114", no:37, topic:"tcpip",
  stem:"有關 DNS iterative query 的敘述，下列何者正確？",
  options:["由根伺服器遞迴解到底","回應永遠權威","使用 TCP 53","由客戶端逐層查詢，伺服器回應「下一位詢問誰」資訊"],
  answer:"D",
  explain:"DNS 查詢兩種模式：<br>• <strong>Recursive query</strong>：解析器代客戶把問題解完，最終回 IP（客戶端通常對 local resolver 用 recursive）。<br>• <strong>Iterative query</strong>：被查者若不知答案，回送「該去問誰（NS 紀錄）」，<strong>由發問者自己逐層接著問下去</strong>（resolver 對根/TLD/權威伺服器多用 iterative）。<br>DNS 預設用 UDP/53，回應未必權威（可能 cache）。"
},
{ id:"114-38", year:"114", no:38, topic:"sec",
  stem:"下列何者非屬 DNS Open Resolver 弱點的風險？",
  options:["被濫用為 DDoS 放大","洩漏內部解析紀錄","導致 HTTPS 中間人攻擊自動成功","被用於偵測內部名稱"],
  answer:"C",
  explain:"<strong>Open Resolver</strong>（對外開放遞迴解析的 DNS 伺服器）的常見風險：<br>• 被當<strong>反射/放大攻擊</strong>的跳板（小查詢可換大回應）<br>• 內部解析資料外洩<br>• 攻擊者藉以偵測內部主機名<br>(C) <strong>HTTPS 中間人</strong>另需證書信任問題，<strong>不會因 open resolver「自動成功」</strong>，TLS 仍會擋下。"
},
{ id:"114-39", year:"114", no:39, topic:"sec",
  stem:"常見 DDoS 防護中，「黑洞/水坑（Blackholing/Sinkholing）」的主要目的為何？",
  options:["加密流量","將惡意流量導走/收容解析","建立零信任","啟用多因素驗證"],
  answer:"B",
  explain:"<strong>Blackholing</strong>：把受攻擊目的位址的流量導入「黑洞」路由（如下一跳指向 Null 介面），直接丟棄。<br><strong>Sinkholing</strong>：把惡意流量導向受控伺服器「收容」分析，可監控殭屍網路、攔截 C&C 通訊。<br>兩者皆是「導向」/「分流」型防禦，不涉加密、零信任或 MFA。"
},
{ id:"114-40", year:"114", no:40, topic:"tcpip",
  stem:"下列何者為負載平衡 Round Robin 與 Weighted Round Robin 的差異？",
  options:["是否考量伺服器權重","是否支援 SSL 終結","是否支援 L7 規則","是否支援健康檢查"],
  answer:"A",
  explain:"<strong>Round Robin</strong>：所有伺服器一視同仁，輪流派發請求。<br><strong>Weighted Round Robin（加權輪詢）</strong>：為每台伺服器設定<strong>權重</strong>，效能強的權重高，分配比例對應權重。<br>其他功能（SSL 終結、L7 規則、健康檢查）是負載平衡器的獨立功能，與輪詢策略本身無關。"
},
{ id:"114-41", year:"114", no:41, topic:"net",
  stem:"為避免使用者會話在多台伺服器間漂移造成異常，下列何者為常見作法？",
  options:["HSTS","HPKP","OCSP Stapling","Session Stickiness"],
  answer:"D",
  explain:"<strong>Session Stickiness（Session Persistence，會話黏滯）</strong>：負載平衡器辨識同一使用者（依 IP 或 cookie），將其後續請求<strong>固定送到同一台後端</strong>，避免因每次連到不同伺服器導致 session 不一致。<br>HSTS、HPKP、OCSP Stapling 都是 HTTPS 相關安全機制，與會話黏滯無關。"
},
{ id:"114-42", year:"114", no:42, topic:"sec",
  stem:"SQL Injection 防護中，下列何者為預備語句（Prepared Statements）的關鍵？",
  options:["將變數轉成 16 進位","全局 Try/Catch","對輸入做 Base64","SQL 與資料綁定分離、參數化"],
  answer:"D",
  explain:"<strong>Prepared Statement（參數化查詢）</strong>關鍵：先把 SQL 結構送資料庫編譯（已固定語法），再把使用者輸入<strong>以「資料」身份綁定參數</strong>，資料庫不會把參數內容解讀為 SQL 指令，故注入無效。<br>例：<code>SELECT * FROM u WHERE id=?</code> + bind(<code>userInput</code>)。輸入做轉碼/Try-Catch 不能根本防注入。"
},
{ id:"114-43", year:"114", no:43, topic:"wire",
  stem:"相較於 4G，下列何者非屬 5G 常見特性？",
  options:["覆蓋率下降","頻譜效率提升","延遲顯著降低","大量裝置連結"],
  answer:"A",
  explain:"5G 三大應用場景：eMBB（高頻寬）、URLLC（超低延遲）、mMTC（巨量機器通訊）。<br>5G 「<strong>覆蓋率下降</strong>」的說法不精確：高頻毫米波因穿透差、衰減快、覆蓋範圍較小，但 5G 整體含 sub-6GHz、低頻段可廣覆蓋。在<strong>常見特性列表中「覆蓋率下降」不被列為 5G 的「特性」</strong>，反而是缺點/取捨。"
},
{ id:"114-44", year:"114", no:44, topic:"sec",
  stem:"有關 IAM 與 RBAC 的關係，下列敘述何者正確？",
  options:["IAM ⊂ RBAC","RBAC ⊂ IAM（RBAC 是授權方式之一）","無關","RBAC = IAM"],
  answer:"B",
  explain:"<strong>IAM（Identity and Access Management，身分與存取管理）</strong>是大架構，涵蓋身分鑑別（authentication）、授權（authorization）、稽核、生命週期管理等。<br><strong>RBAC（Role-Based Access Control，角色為基礎的存取控制）</strong>是 IAM 中<strong>授權的一種模型</strong>（其他還有 ABAC、ACL）。故 RBAC ⊂ IAM。"
},
{ id:"114-45", year:"114", no:45, topic:"sec",
  stem:"兩步驟驗證（Two-Step Verification）主要提升下列哪個面向？",
  options:["可用性","完整性","不可否認性","機密性與認證強度"],
  answer:"D",
  explain:"兩步驟驗證（2FA / 2SV）要求使用者除密碼外，再提供第二要素（如 OTP、TOTP、簡訊驗證碼、硬體金鑰），即使密碼洩漏也難以登入。主要提升：<strong>身分認證強度</strong>，間接保護<strong>機密性</strong>（防未授權者讀取資料）。與可用性、完整性、不可否認性無直接關係。"
},
{ id:"114-46", year:"114", no:46, topic:"sec",
  stem:"IDPS 偵測技術中，下列何者對「未知攻擊」一般表現最佳？",
  options:["特徵偵測（Signature）","自動掃描（Auto Scanning）","狀態協定分析（Stateful Protocol）","異常行為（Anomaly）"],
  answer:"D",
  explain:"IDS/IPS 三大偵測法：<br>• <strong>Signature-based</strong>：比對已知攻擊特徵，<strong>無法偵測未知攻擊（zero-day）</strong>。<br>• <strong>Stateful Protocol Analysis</strong>：比對協定預期行為。<br>• <strong>Anomaly-based（異常行為）</strong>：先學習「正常基準」，偏離即告警，<strong>能發現未知攻擊</strong>，但誤判率較高。"
},
{ id:"114-47", year:"114", no:47, topic:"sec",
  stem:"下列何者非屬 Session Hijacking 常見取得會話的手段？",
  options:["MITM","Sniffing","UDP 檔案傳輸","XSS"],
  answer:"C",
  explain:"Session Hijacking 常見手段：<br>• <strong>Sniffing</strong>（明文網路抓 session cookie）<br>• <strong>MITM</strong>（中間人攔截）<br>• <strong>XSS</strong>（注入腳本偷 cookie）<br>• Session Fixation（強制使用者使用攻擊者預設的 session）<br><strong>UDP 檔案傳輸</strong>本身是 TFTP 之類的協定，不是劫持手段。"
},
{ id:"114-48", year:"114", no:48, topic:"sec",
  stem:"下列何者為 WAF 與傳統封包過濾式防火牆的主要差異？",
  options:["WAF 僅看第 2 層","WAF 檢視與過濾應用層內容/命令","WAF 不做代理","WAF 不支援 SSL"],
  answer:"B",
  explain:"<strong>WAF（Web Application Firewall）</strong>運作於 <strong>L7 應用層</strong>，能解析 HTTP/HTTPS 請求內容，過濾 SQL Injection、XSS、CSRF 等<strong>應用層攻擊</strong>。<br><strong>傳統封包過濾防火牆</strong>主要看 L3/L4（IP/port/protocol），無法理解應用層語意。"
},
{ id:"114-49", year:"114", no:49, topic:"sec",
  stem:"多因子認證不包含下列何種要素？",
  options:["所知之事","所持之物","所在之處","所表之徵"],
  answer:"C",
  explain:"傳統 MFA 三大要素：<br>• <strong>所知（Something you know）</strong>：密碼、PIN<br>• <strong>所持（Something you have）</strong>：手機、硬體 token、智慧卡<br>• <strong>所是/所表之徵（Something you are）</strong>：生物特徵（指紋、虹膜、臉）<br>「所在之處」是延伸的<strong>第四要素</strong>（情境/位置），不屬傳統三要素核心。本題選不包含的選項 → <strong>C 所在之處</strong>。"
},
{ id:"114-50", year:"114", no:50, topic:"tcpip",
  stem:"下列何者非屬 TCP/IP 網路中之網路層通訊協定？",
  options:["ICMP","IGMP","OSPF","UDP"],
  answer:"D",
  explain:"<strong>網路層協定</strong>：IP、ICMP（錯誤回報）、IGMP（群播管理）、ARP、OSPF/RIP/BGP（路由協定，邏輯上跨層但常分到網路層）。<br><strong>UDP</strong> 是<strong>傳輸層</strong>協定，與 TCP 並列。"
},

{ id:"113-3", year:"113", no:3, topic:"arch",
  stem:"關於複雜指令集架構（CISC）之敘述，下列何者有誤？",

  answer:"B",
  explain:"「需依賴編譯器最佳化指令」是 <strong>RISC</strong> 的特徵（指令簡單規律、靠 compiler 排程提升效能）；CISC 指令複雜、種類多、定址方式多、單一指令即可完成複雜動作，較不仰賴 compiler 最佳化。"

{ id:"113-4", year:"113", no:4, topic:"arch",
  stem:"若硬體無法滿足每個時脈週期在管路（Pipeline）中同時被執行的指令，會發生下列何種問題？",
  options:["排程危障","控制危障","資料危障","結構危障"],
  answer:"D",
  explain:"<strong>結構危障（Structural Hazard）</strong>：硬體資源不足以支援同時段執行的多個指令（如僅一個記憶體 port 卻同時需要 IF 和 MEM）。資料危障是指令間資料相依、控制危障是分支造成。"
},
{ id:"113-5", year:"113", no:5, topic:"arch",
  stem:"下列何種磁碟陣列的成本最高？",
  options:["RAID 0","RAID 1","RAID 3","RAID 4"],
  answer:"B",
  explain:"<strong>RAID 1（鏡像）</strong>需 2 顆硬碟完全複製，<strong>可用空間僅總容量的一半</strong>，硬碟成本利用率最低。RAID 0 全可用無容錯；RAID 3/4 用奇偶校驗碟，僅損失 1 顆容量。"
},
{ id:"113-6", year:"113", no:6, topic:"os",
  stem:"關於 CPU 與 I/O 的輪詢（Polling）方式，下列何者有誤？",
  options:["簡單易執行","CPU 會週期性確認 I/O 的狀態","適用於高速裝置傳送大量資料","CPU 的利用率較差"],
  answer:"C",
  explain:"輪詢讓 CPU 不斷檢查 I/O 狀態，<strong>不適合高速裝置大量傳輸</strong>——應採 DMA 或中斷式。輪詢的優點：簡單；缺點：CPU 利用率低、不適合高頻 I/O。"

{ id:"113-7", year:"113", no:7, topic:"os",

{ id:"113-8", year:"113", no:8, topic:"os",
  stem:"行程（Process）若沒有配置足夠的實體記憶體頁框（Frames）時，將因分頁錯誤率高而產生大量記憶體分頁切換，此現象稱為下列何者？",

{ id:"113-9", year:"113", no:9, topic:"os",

  answer:"C",

},
{ id:"113-10", year:"113", no:10, topic:"os",

  options:["會有內部碎裂","會有外部碎裂","區塊大小為固定","允許 1 個程式載入不連續的記憶體空間"],
  answer:"B",
  explain:"分頁法頁框（page frame）大小固定，因此<strong>會有內部碎裂</strong>（最後一頁通常未填滿）；分頁法載入的區塊各自獨立、不需連續空間，所以<strong>沒有外部碎裂</strong>。<br>因此「會有外部碎裂」這個敘述是錯的 → 答案為 <strong>(B)</strong>。<br>觀念釐清:<strong>分頁 → 內部碎裂；分段（Segmentation） → 外部碎裂</strong>。"
},

{ id:"113-11", year:"113", no:11, topic:"ds",

},

{ id:"113-13", year:"113", no:13, topic:"tcpip",

{ id:"113-14", year:"113", no:14, topic:"prog",
  stem:"關於巨集（Macro）之敘述，下列何者有誤？",

{ id:"113-15", year:"113", no:15, topic:"ds",

},
{ id:"113-16", year:"113", no:16, topic:"prog",
  stem:"下列何種測試不適合以黑箱（Black-box）測試運作？",

},

{ id:"113-22", year:"113", no:22, topic:"ds",

{ id:"113-23", year:"113", no:23, topic:"ds",

{ id:"113-24", year:"113", no:24, topic:"ds",

{ id:"113-25", year:"113", no:25, topic:"ds",

{ id:"113-29", year:"113", no:29, topic:"sec",

},
{ id:"113-30", year:"113", no:30, topic:"tcpip",

},
{ id:"113-31", year:"113", no:31, topic:"sec",
  stem:"下列何種網路攻擊主要利用 TCP 協定的三向交握機制耗盡伺服器資源？",

},
{ id:"113-32", year:"113", no:32, topic:"net",

},
{ id:"113-33", year:"113", no:33, topic:"tcpip",
  stem:"在 TCP 協定中，若接收方的窗口大小為 0，發送方會採取何種行為？",
  options:["停止傳送資料直到窗口更新","持續傳送資料直到接收方滿載","自動關閉連線","重設連線並重新發送資料"],

},
{ id:"113-34", year:"113", no:34, topic:"sec",
  stem:"下列何種技術能有效防禦 DDoS 攻擊？",

},
{ id:"113-35", year:"113", no:35, topic:"tcpip",

},
{ id:"113-36", year:"113", no:36, topic:"net",

{ id:"113-37", year:"113", no:37, topic:"sec",

{ id:"113-38", year:"113", no:38, topic:"wire",

{ id:"112-23", year:"112", no:23, topic:"tcpip",

{ id:"112-28", year:"112", no:28, topic:"tcpip",

{ id:"112-31", year:"112", no:31, topic:"tcpip",

{ id:"112-32", year:"112", no:32, topic:"net",
  stem:"有關網路設備之敘述，下列何者正確？",
  options:["路由器可分割碰撞網域","集線器可用來加強纜線上的訊號","橋接器可分割廣播網域","交換器可將數位轉換為類比訊號"],

{ id:"112-36", year:"112", no:36, topic:"sec",

{ id:"112-37", year:"112", no:37, topic:"tcpip",

{ id:"112-39", year:"112", no:39, topic:"sec",

{ id:"112-40", year:"112", no:40, topic:"sec",

{ id:"112-41", year:"112", no:41, topic:"tcpip",
  stem:"有關 TCP 協定之流量控制（Flow Control）功能之敘述，下列何者正確？",

  answer:"B",
  explain:"<strong>流量控制（Flow Control）</strong>是<strong>端對端</strong>機制，依接收端的接收視窗（rwnd）調節發送速率，<strong>避免發送過快超過接收端的處理/緩衝能力</strong>，故 (B)。路由器/網路壅塞則屬擁塞控制（Congestion Control）。"
},
{ id:"112-42", year:"112", no:42, topic:"sec",

},
{ id:"112-43", year:"112", no:43, topic:"tcpip",

  explain:"FTP 走 <strong>TCP</strong>：<strong>port 21 為控制連線</strong>（指令）、<strong>port 20 為資料連線</strong>（傳檔，主動模式）。故 (C)「資料連線用 TCP 連接埠 20」正確。FTP 不使用 UDP。"
},
{ id:"112-44", year:"112", no:44, topic:"sec",
  stem:"檢測系統安全與否一般會採用弱點掃描（簡稱弱掃）和滲透測試（簡稱滲透），有關兩者差異比較之敘述，下列何者有誤？",
  options:["弱掃較滲透更能發現未知漏洞","弱掃採自動化工具，滲透採人工檢測","執行弱掃之成本通常較滲透低","執行弱掃之時機通常較滲透頻繁"],

  explain:"(A) 有誤：<strong>滲透測試（人工、模擬真實攻擊）較能發現未知/邏輯漏洞</strong>；弱點掃描靠已知漏洞特徵庫的自動化工具，難發現未知漏洞。弱掃成本低、頻率高、自動化，皆正確。"
},
{ id:"112-45", year:"112", no:45, topic:"tcpip",
  stem:"有關 Distance Vector（簡稱 DV）與 Link State（簡稱 LS）路由演算法兩者差異之敘述，下列何者有誤？",
  options:["DV 定期更新路由資訊，但 LS 則否","RIPv2 路由協定採取 DV，OSPF 則採取 LS","LS 之路由資訊收斂較 DV 快","DV 運行較 LS 需要大頻寬"],
  answer:"D",
  explain:"(D) 有誤：<strong>DV（如 RIP）定期廣播整張路由表，反而較耗頻寬之說法不全</strong>——實務上 LS 初期洪泛 LSA、DV 定期送整表，但本題官方判定 (D) 為錯誤敘述（DV 通常頻寬需求較小、收斂較慢）。<br>正確認知：LS 收斂快、用 Dijkstra 算最短路；DV 用 Bellman-Ford、收斂慢、有路由迴圈問題。RIPv2=DV、OSPF=LS。"
},
{ id:"112-46", year:"112", no:46, topic:"net",
  stem:"有關路由器和第 3 層交換器（簡稱 L3SW）之差異敘述，下列何者有誤？",
  options:["路由器的路由表規模較 L3SW 大","兩者都支援 NAT and Tunneling","路由器支援 VPN，L3 Switch 則不支援","路由器由軟體執行路由，L3SW 則由硬體執行"],
  answer:"B",
  explain:"(B) 有誤：<strong>L3 交換器主要做高速區網內路由，通常不支援 NAT 與 Tunneling（VPN 隧道）</strong>，這些是路由器的強項。路由器路由表大、支援 VPN/NAT、以軟體（CPU）彈性處理；L3SW 以 ASIC 硬體高速轉發。"
},
{ id:"112-47", year:"112", no:47, topic:"tcpip",
  stem:"CIDR（Classless Inter-Domain Routing）是一種 IP 地址分配方法，下列敘述何者有誤？",

{ id:"111-32", year:"111", no:32, topic:"net",

{ id:"111-33", year:"111", no:33, topic:"sec",

{ id:"111-34", year:"111", no:34, topic:"net",

{ id:"111-35", year:"111", no:35, topic:"tcpip",

{ id:"111-36", year:"111", no:36, topic:"sec",

{ id:"111-37", year:"111", no:37, topic:"tcpip",

{ id:"111-38", year:"111", no:38, topic:"net",

{ id:"111-40", year:"111", no:40, topic:"wire",

{ id:"111-41", year:"111", no:41, topic:"sec",

{ id:"111-43", year:"111", no:43, topic:"sec",

{ id:"111-45", year:"111", no:45, topic:"sec",

{ id:"111-47", year:"111", no:47, topic:"wire",

{ id:"111-48", year:"111", no:48, topic:"sec",

{ id:"111-49", year:"111", no:49, topic:"net",

{ id:"111-50", year:"111", no:50, topic:"sec",

{ id:"110-5", year:"110", no:5, topic:"arch",

{ id:"110-16", year:"110", no:16, topic:"os",

{ id:"110-17", year:"110", no:17, topic:"os",

},
{ id:"110-18", year:"110", no:18, topic:"arch",

},
{ id:"110-19", year:"110", no:19, topic:"tcpip",
  stem:"某 Hamming Code 編碼方式之最小漢明距離為 5，則其最大可偵錯與最大自動更正的位元數分別為多少？",
  options:["4 與 3","3 與 3","4 與 2","3 與 2"],
  answer:"C",
  explain:"最小漢明距離 d 時：<br>最大可偵錯位元數 = d − 1 = 5 − 1 = <strong>4</strong>。<br>最大可更正位元數 = ⌊(d−1)/2⌋ = ⌊4/2⌋ = <strong>2</strong>。<br>故為 4 與 2。"
},
{ id:"110-20", year:"110", no:20, topic:"os",

},
{ id:"110-21", year:"110", no:21, topic:"arch",

},
{ id:"110-22", year:"110", no:22, topic:"os",

},
{ id:"110-23", year:"110", no:23, topic:"os",

{ id:"110-26", year:"110", no:26, topic:"tcpip",

{ id:"110-31", year:"110", no:31, topic:"tcpip",

{ id:"110-33", year:"110", no:33, topic:"tcpip",

{ id:"110-36", year:"110", no:36, topic:"tcpip",

{ id:"110-37", year:"110", no:37, topic:"wire",

{ id:"110-38", year:"110", no:38, topic:"sec",

{ id:"110-39", year:"110", no:39, topic:"tcpip",

{ id:"110-41", year:"110", no:41, topic:"sec",

{ id:"110-42", year:"110", no:42, topic:"net",

{ id:"110-43", year:"110", no:43, topic:"sec",

{ id:"110-44", year:"110", no:44, topic:"sec",

{ id:"110-49", year:"110", no:49, topic:"tcpip",

{ id:"109-11", year:"109", no:11, topic:"os",

{ id:"109-36", year:"109", no:36, topic:"net",

{ id:"109-37", year:"109", no:37, topic:"net",

{ id:"108-3", year:"108", no:3, topic:"arch",
  stem:"記憶體系統：Cache 存取時間 15 ns、記憶體存取時間 200 ns，Cache Hit Ratio H 與容量 C 關係為 H = 0.5 + 0.1×log₂C（2 ≤ C ≤ 32）。若期望 Cache 存取時間 ≤ 35 ns，所需 Cache 容量值 C 最小為何？",

{ id:"107-26", year:"107", no:26, topic:"sec",

{ id:"107-28", year:"107", no:28, topic:"sec",

},
{ id:"107-29", year:"107", no:29, topic:"net",

},
{ id:"107-30", year:"107", no:30, topic:"tcpip",

{ id:"107-31", year:"107", no:31, topic:"tcpip",

},
{ id:"107-32", year:"107", no:32, topic:"sec",

{ id:"107-36", year:"107", no:36, topic:"tcpip",

},
{ id:"107-37", year:"107", no:37, topic:"tcpip",

},
{ id:"107-38", year:"107", no:38, topic:"sec",
  stem:"使用對稱型的區塊式加密法如 DES 或 AES，如果資料長度不等於加密演算法每次所取區塊大小之倍數，則會使用下列何種方法？",

},

{ id:"105-2", year:"105", no:2, topic:"arch",
  stem:"假設要使用一簡化型 8 位元浮點表示法加總數字，指數部分以超 4 碼（excess four notation）表示，且不省略正規化後的小數位數第 1 位（1bit 符號 + 3bit 指數 + 4bit 假數）。請問依本題表示法依序相加 2½ + ⅛ + ⅛，下列結果何者正確？",
  options:["2½","2⅝","2¾","溢位錯誤"],
  answer:"A",
  explain:"本題重點在於<strong>假數僅 4 位元（含正規化後第 1 位，等於只有 3 個小數位精度）</strong>，加法時因對齊指數而發生精度損失。<br>2½ = 1.010（×2¹），指數 1+4=<code>101</code>，假數 <code>1010</code>。<br>⅛ = 1.000（×2⁻³）。與 2½ 相加時需將 ⅛ 的假數右移對齊到指數 2¹，移位量 = 1−(−3) = <strong>4 位</strong>，但假數小數部分只有 3 個 bit 可用（第 4 位起已超出可儲存精度），移出去的位元全部被捨去，等同這次加法<strong>完全無法反映到結果</strong>，總和仍為 2½。<br>再加第二個 ⅛ 時，情形相同（此時和仍是 2½，指數依然是 2¹），同樣因精度不足而被捨去。<br>因此依此簡化型 8 位元浮點表示法運算，最終結果仍為 <strong>(A) 2½</strong>，並非直接的十進位算術結果 2¾——這正是題目想突顯「有限精度導致加法捨入誤差」的重點。"
},

{ id:"102-34", year:"102", no:34, topic:"tcpip",

{ id:"102-37", year:"102", no:37, topic:"net",

{ id:"102-38", year:"102", no:38, topic:"net",

{ id:"102-39", year:"102", no:39, topic:"tcpip",

{ id:"102-40", year:"102", no:40, topic:"wire",

{ id:"102-42", year:"102", no:42, topic:"ds",

{ id:"102-43", year:"102", no:43, topic:"os",

{ id:"102-44", year:"102", no:44, topic:"arch",
  stem:"電腦時脈速度（clock rate）為 100 MHz，執行 10⁸ 個指令需要 2.5 秒，則此電腦執行每個指令需要多少時脈週期（clock cycle）？",

{ id:"102-45", year:"102", no:45, topic:"sec",

{ id:"102-46", year:"102", no:46, topic:"os",

{ id:"102-47", year:"102", no:47, topic:"ds",
  stem:"使用演算法解決問題時，在反覆的過程中，不斷取用最大值或最小值來進行處理的技巧，是屬於下列哪一種技巧？",

{ id:"102-48", year:"102", no:48, topic:"prog",

{ id:"102-50", year:"102", no:50, topic:"sec",

{ id:"102-51", year:"102", no:51, topic:"tcpip",
  stem:"一個二進位值為 (10101111)₂ 的 8-bit 位元組，以偶數同位的漢明碼予以編碼，以下何者為正確的編碼後二進位值？",

},
{ id:"102-52", year:"102", no:52, topic:"wire",

{ id:"102-53", year:"102", no:53, topic:"tcpip",

{ id:"102-54", year:"102", no:54, topic:"tcpip",

{ id:"102-55", year:"102", no:55, topic:"tcpip",

{ id:"102-56", year:"102", no:56, topic:"tcpip",

{ id:"102-58", year:"102", no:58, topic:"sec",

{ id:"102-59", year:"102", no:59, topic:"wire",

{ id:"102-60", year:"102", no:60, topic:"tcpip",

{ id:"101-5", year:"101", no:5, topic:"arch",

{ id:"101-6", year:"101", no:6, topic:"arch",

{ id:"101-10", year:"101", no:10, topic:"arch",

{ id:"101-42", year:"101", no:42, topic:"arch",
  stem:"如圖：A,B 經 NAND→反相，B 經自身運算→反相，再經 NAND→反相 得 F。布林函數 F 的結果為下列何者？",
  options:["A","B","A+B","A'+B'"],

  explain:"設第一級 AND(A,B) 後經反相器得 <strong>X = (AB)′ = A′+B′</strong>（NAND 結果）。<br>X 分成兩路：一路直接接到最後一級 AND 閘；另一路與 B 進入第二個 AND 閘，得 X·B = (A′+B′)·B = A′B，再經反相器得 <strong>Y = (A′B)′ = A+B′</strong>。<br>最後一級：AND(X, Y) = (A′+B′)(A+B′) = A′B′+AB′+B′ = B′，再經反相器得 <strong>F = (B′)′ = B</strong>。<br>以真值表驗證亦相符，故答案為 <strong>(B)</strong>。"

/* === 進度持久化 (localStorage) === */
const STORAGE_KEY = 'gy_quiz_progress_v1';
/* 舊版（國營＋關務合併站）使用的 key；若同網域下有舊進度，首次載入時只搬移屬於本站的題目 */
const LEGACY_STORAGE_KEY = 'compnet_quiz_progress_v1';
let progress = loadProgress();

function loadProgress() {
  try {
    let raw = localStorage.getItem(STORAGE_KEY);
    let migrate = false;
    if (!raw) {
      raw = localStorage.getItem(LEGACY_STORAGE_KEY);
      migrate = !!raw;
    }
    if (!raw) return { answers: {}, bookmarks: {} };
    const p = JSON.parse(raw);
    let answers = p.answers || {};       // { id: "A"|"B"|"C"|"D" }
    let bookmarks = p.bookmarks || {};   // { id: true }
    if (migrate) {
      const ids = new Set(ALL_Q.map(q => q.id));
      const pick = obj => Object.keys(obj).reduce((o, k) => (ids.has(k) && (o[k] = obj[k]), o), {});
      answers = pick(answers);
      bookmarks = pick(bookmarks);
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ answers, bookmarks })); } catch (e) {}
    }
    return { answers, bookmarks };
  } catch (e) {
    return { answers: {}, bookmarks: {} };
  }
}
function saveProgress() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
}

  shuffleSeed: 0
};

/* === Markdown 渲染（極簡） === */
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderInline(s) {
  // **粗體**, `code`, <br>
  let out = escapeHtml(s)
    .replace(/&lt;br&gt;/g, '<br>')
    .replace(/&lt;strong&gt;/g, '<strong>').replace(/&lt;\/strong&gt;/g, '</strong>')
    .replace(/&lt;code&gt;/g, '<code>').replace(/&lt;\/code&gt;/g, '</code>')
    .replace(/&lt;(\/?)(sub|sup)&gt;/g, '<$1$2>');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  return out;
}

/* === 統計 === */
function computeStats(list) {
  let answered = 0, correct = 0, wrong = 0;
  list.forEach(q => {
    const u = progress.answers[q.id];
    if (u) {
      answered++;
      if (q.allCorrect || u === q.answer || (q.altAnswer && u === q.altAnswer)) correct++;
      else wrong++;
    }
  });
  return { answered, correct, wrong };
}

function updateStatBar() {
  const scope = ALL_Q;
  document.getElementById('statTotal').textContent = scope.length;
  document.getElementById('statYears').textContent = new Set(scope.map(q=>q.year)).size;
  const s = computeStats(scope);
  document.getElementById('statAnswered').textContent = s.answered;
  document.getElementById('statCorrect').textContent = s.correct;
  document.getElementById('statWrong').textContent = s.wrong;
  document.getElementById('statRate').textContent =
    s.answered > 0 ? Math.round(s.correct / s.answered * 100) + '%' : '—';
}

/* === 篩選 === */
function filterQuestions() {
  let list = ALL_Q.slice();

  // 模式
  if (state.mode === 'wrong') {
    list = list.filter(q => progress.answers[q.id] && !q.allCorrect && progress.answers[q.id] !== q.answer && progress.answers[q.id] !== q.altAnswer);
  } else if (state.mode === 'bookmark') {
    list = list.filter(q => progress.bookmarks[q.id]);
  }

  // 主題
  if (state.topicFilter !== 'all') {
    list = list.filter(q => q.topic === state.topicFilter);
  }

  // 搜尋
  if (state.search) {
    const s = state.search.toLowerCase();
    list = list.filter(q => {
      const hay = (q.stem + ' ' + q.options.join(' ') + ' ' + (q.explain || '')).toLowerCase();
      return hay.includes(s);
    });
  }

  // 隨機
  if (state.shuffled) {
    list = shuffleArray(list, state.shuffleSeed);
  }

  return list;
}

function shuffleArray(arr, seed) {
  // 簡易確定性洗牌（Fisher-Yates with seeded random）
  const a = arr.slice();
  let s = seed || 1;
  const rng = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* === 渲染題目卡 === */
function renderQuestion(q) {
  const t = TOPIC_INFO[q.topic] || { name: '其他', cls: 't-misc' };
  const userAns = progress.answers[q.id];
  const isBookmarked = !!progress.bookmarks[q.id];
  const isAnswered = !!userAns;
  // 多選題：userAns 為已排序字串如 "ABC"；單選為單一字母
  const isCorrect = q.allCorrect ? isAnswered : (q.type === 'multi'
    ? (userAns && [...userAns].sort().join('') === [...(q.answer||'')].sort().join(''))
    : (userAns === q.answer || (q.altAnswer && userAns === q.altAnswer)));
  const isViewed = !!(progress.viewed && progress.viewed[q.id]);
  // 在「閱讀模式」或「錯題複習」中預設揭曉答案
  const forceReveal = state.mode === 'review' || state.mode === 'wrong';
  const revealed = forceReveal || isAnswered || isViewed;

  let cls = 'q-card ' + t.cls;
  if (revealed && isAnswered) cls += ' answered ' + (isCorrect ? 'correct' : 'wrong');
  if (revealed) cls += ' revealed';
  if (isBookmarked) cls += ' bookmarked';

  // 選項
  const letters = 'ABCDE';
  const isMulti = q.type === 'multi';
  // 多選題：userAns 為排序後的字串如 "ABC"；單選為單一字母
  const userSet = new Set((userAns || '').split(''));
  // 進行中（尚未提交）的多選暫存
  if (isMulti && !progress.pending) progress.pending = {};
  const pendingSet = isMulti ? new Set(((progress.pending && progress.pending[q.id]) || '').split('').filter(Boolean)) : null;
  const correctSet = new Set((q.answer || '').split(''));
  if (q.altAnswer) correctSet.add(q.altAnswer);

  const optsHtml = q.options.map((opt, idx) => {
    const letter = letters[idx];
    let oCls = 'opt';
    if (isMulti) {
      // 多選：揭曉前看 pending；揭曉後看 userAns
      if (!revealed && pendingSet.has(letter)) oCls += ' user-selected';
      if (revealed && userSet.has(letter)) oCls += ' user-selected';
    } else {
      if (userAns === letter) oCls += ' user-selected';
    }
    if (revealed) {
      if (correctSet.has(letter)) oCls += ' correct';
      if (!q.allCorrect) {
        if (isMulti) {
          if (userSet.has(letter) && !correctSet.has(letter)) oCls += ' wrong';
        } else {
          if (userAns === letter && !correctSet.has(letter)) oCls += ' wrong';
        }
      } else if (userAns === letter && letter !== q.answer) {
        oCls += ' correct';
      }
    }
    let mark = '';
    if (revealed && correctSet.has(letter)) mark = '<span class="correct-mark">正解</span>';
    else if (revealed && q.allCorrect && userAns === letter && letter !== q.answer) mark = '<span class="correct-mark">送分</span>';
    else if (revealed && !q.allCorrect && !isMulti && userAns === letter && !correctSet.has(letter)) mark = '<span class="wrong-mark">你的選擇</span>';
    else if (revealed && !q.allCorrect && isMulti && userSet.has(letter) && !correctSet.has(letter)) mark = '<span class="wrong-mark">你的選擇</span>';
    return `<div class="${oCls}" onclick="selectAnswer('${q.id}','${letter}')">
      <div class="opt-letter">${letter}</div>
      <div class="opt-text">${renderInline(opt)}</div>
      ${mark}
    </div>`;
  }).join('');

  // 解析
  let explainHtml = '';
  if (revealed && q.explain) {
    explainHtml = `<div class="explain">
      <span class="explain-label">解析</span>
      <div>${renderInline(q.explain)}</div>
    </div>`;
  }

  // 動作按鈕
  let actionsHtml = '<div class="q-actions">';
  if (!revealed) {
    if (isMulti) {
      const hasPending = pendingSet && pendingSet.size > 0;
      actionsHtml += `<button class="submit-btn" onclick="submitMultiAnswer('${q.id}')" ${hasPending ? '' : 'disabled'}>送出答案（已選 ${pendingSet ? pendingSet.size : 0} 項）</button>`;
    }
    actionsHtml += `<button class="reveal-btn" onclick="revealAnswer('${q.id}')">看答案</button>`;
  } else if (!forceReveal) {
    actionsHtml += `<button onclick="resetQuestion('${q.id}')">重新作答</button>`;
  }
  actionsHtml += '</div>';

  return `<div class="${cls}" id="q-${q.id}">
    <div class="q-head">
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-text">${renderInline(q.stem)}</div>
        ${q.figure ? `<div class="q-figure" style="margin-top:.6rem">${q.figure}</div>` : ''}
        <div class="q-tags">
          <span class="tag tag-topic">${t.name}</span>
          <span class="tag tag-year">${q.year} 年</span>
          <span class="tag tag-no">第 ${q.no} 題</span>
          ${isMulti ? '<span class="tag tag-multi">複選題</span>' : ''}
        </div>
      </div>
      <button class="q-bookmark ${isBookmarked ? 'on' : ''}"
              title="${isBookmarked ? '取消收藏' : '加入收藏'}"
              onclick="toggleBookmark('${q.id}')">${isBookmarked ? '★' : '☆'}</button>
    </div>
    <div class="q-body">
      <div class="options">${optsHtml}</div>
      ${explainHtml}
      ${actionsHtml}
    </div>
  </div>`;
}

/* === 主渲染 === */
function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');

  if (list.length === 0) {
    let msg = '找不到符合條件的題目';
    if (state.mode === 'wrong') msg = '尚未有答錯的題目，繼續加油 👍';
    else if (state.mode === 'bookmark') msg = '尚未收藏任何題目（點題目右上角 ☆ 即可收藏）';
    wrap.innerHTML = `<div class="empty"><div class="big">📭</div><p>${msg}</p></div>`;
    updateStatBar();
    return;
  }

  let html = '';
  if (state.shuffled) {
    // 隨機排序時不分組，全部列出
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">隨機</span>
        <span class="g-title">已隨機打散全部題目</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      <div class="q-list">${list.map(renderQuestion).join('')}</div>
    </div>`;
  } else if (state.group === 'year') {
    // 依年度
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
    years.forEach(yr => {
      const qs = byYear[yr];
      qs.sort((a, b) => a.no - b.no);
      const s = computeStats(qs);
      html += `<div class="group">
        <div class="group-head">
          <span class="g-badge">${yr} 年</span>
          <span class="g-title">經濟部新進職員甄試 ‧ 計算機原理＋網路概論</span>
          <span class="g-meta">
            本年共 ${qs.length} 題<br>
            已答 ${s.answered} ‧ 對 ${s.correct} ‧ 錯 ${s.wrong}
          </span>
        </div>
        <div class="q-list">${qs.map(renderQuestion).join('')}</div>
      </div>`;
    });
  } else {
    // 依主題
    const byTopic = {};
    list.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    Object.keys(TOPIC_INFO).forEach(tk => {
      const qs = byTopic[tk];
      if (!qs || qs.length === 0) return;
      qs.sort((a, b) => Number(b.year) - Number(a.year) || a.no - b.no);
      const t = TOPIC_INFO[tk];
      const s = computeStats(qs);
      html += `<div class="group">
        <div class="group-head">
          <span class="g-badge">${t.name}</span>
          <span class="g-title">歷年同類考題</span>
          <span class="g-meta">
            共 ${qs.length} 題 ‧ 跨 ${new Set(qs.map(q=>q.year)).size} 年度<br>
            已答 ${s.answered} ‧ 對 ${s.correct} ‧ 錯 ${s.wrong}
          </span>
        </div>
        <div class="q-list">${qs.map(renderQuestion).join('')}</div>
      </div>`;
    });
  }

  wrap.innerHTML = html;
  updateStatBar();
}

/* === 互動 === */
function selectAnswer(qid, letter) {
  const q = ALL_Q.find(x => x.id === qid);
  if (!q) return;
  // 閱讀模式不允許作答
  if (state.mode === 'review') return;
  // 已作答則忽略點擊（除非按重新作答）
  if (progress.answers[qid]) return;

  if (q.type === 'multi') {
    // 多選：切換選取狀態，暫存在 progress.pending
    if (!progress.pending) progress.pending = {};
    const cur = new Set((progress.pending[qid] || '').split('').filter(Boolean));
    if (cur.has(letter)) cur.delete(letter);
    else cur.add(letter);
    progress.pending[qid] = [...cur].sort().join('');
    saveProgress();
    render();
    const el = document.getElementById('q-' + qid);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return;
  }

  progress.answers[qid] = letter;
  saveProgress();
  render();
  // 滾動到該題保持視野
  const el = document.getElementById('q-' + qid);
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function submitMultiAnswer(qid) {
  const q = ALL_Q.find(x => x.id === qid);
  if (!q || q.type !== 'multi') return;
  if (!progress.pending) progress.pending = {};
  const ans = progress.pending[qid] || '';
  if (!ans) { alert('請先至少選擇一個選項'); return; }
  progress.answers[qid] = ans;
  delete progress.pending[qid];
  saveProgress();
  render();
}

function revealAnswer(qid) {
  if (!progress.viewed) progress.viewed = {};
  progress.viewed[qid] = true;
  saveProgress();
  render();
}

function resetQuestion(qid) {
  delete progress.answers[qid];
  if (progress.viewed) delete progress.viewed[qid];
  if (progress.pending) delete progress.pending[qid];
  saveProgress();
  render();
}

function toggleBookmark(qid) {
  if (progress.bookmarks[qid]) delete progress.bookmarks[qid];
  else progress.bookmarks[qid] = true;
  saveProgress();
  render();
}

function setMode(mode) {
  state.mode = mode;
  state.shuffled = false;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  render();
}
function setGroup(g) {
  state.group = g;
  state.shuffled = false;
  document.querySelectorAll('.group-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.group === g);
  });
  render();
}
function setTopicFilter(topic) {
  state.topicFilter = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}
function shuffleQuestions() {
  state.shuffled = !state.shuffled;
  state.shuffleSeed = Date.now() % 100000;
  render();
}
function resetProgress() {
  if (!confirm('確定要清除所有作答進度（包含答題紀錄與收藏）？此動作無法復原。')) return;
  progress = { answers: {}, bookmarks: {} };
  saveProgress();
  render();
}

/* 重建主題篩選晶片（計算各主題題數） */
function rebuildTopicChips() {
  const filterRow = document.getElementById('filterRow');
  const scope = ALL_Q;
  const topicCount = {};
  scope.forEach(q => topicCount[q.topic] = (topicCount[q.topic] || 0) + 1);
  let chips = `<button class="chip ${state.topicFilter === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopicFilter('all')">全部<span class="c-count">${scope.length}</span></button>`;
  Object.keys(TOPIC_INFO).forEach(tk => {
    const cnt = topicCount[tk] || 0;
    if (cnt === 0) return;
    chips += `<button class="chip ${state.topicFilter === tk ? 'active' : ''}" data-topic="${tk}"
      onclick="setTopicFilter('${tk}')">${TOPIC_INFO[tk].name}<span class="c-count">${cnt}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

/* === 初始化 === */
function init() {
  rebuildTopicChips();

  // 搜尋
  let timer;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.search = e.target.value.trim(); render(); }, 200);
  });

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
