<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經濟部新進職員甄試｜115 年模擬卷 D｜計算機原理・網路概論</title>
<style>/* ===== 經濟部考古題刷題系統 — 樣式（與資管/程設詳解系統一致） ===== */

@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

:root {
  --ink:        #1a1f2c;
  --ink-soft:   #3d4456;
  --paper:      #f4f1ea;
  --paper-warm: #ece6d8;
  --card:       #fffdf8;
  --line:       #d8d0bf;
  --accent:     #8a3324;
  --accent-2:   #1f5673;
  --gold:       #a07e2c;
  --green:      #2d6a4f;
  --shadow:     rgba(40,32,20,0.13);

  /* 主題分類色（計概/網概專屬） */
  --t-arch:  #1f5673;  /* 數位邏輯/CPU/記憶體 */
  --t-os:    #6a4c93;  /* 作業系統 */
  --t-ds:    #2d6a4f;  /* 資料結構與演算法 */
  --t-prog:  #b5651d;  /* 程式語言/觀念 */
  --t-net:   #1a4d6e;  /* 網路基礎/拓樸/媒介 */
  --t-tcpip: #8a3324;  /* TCP/IP 通訊協定 */
  --t-wire:  #a07e2c;  /* 無線/行動網路 */
  --t-sec:   #5c2a2a;  /* 資安 */
  --t-misc:  #4a5859;  /* 雜項 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: var(--paper);
  color: var(--ink);
  line-height: 1.78;
  -webkit-font-smoothing: antialiased;
  background-image:
    repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(31,86,115,0.025) 31px, rgba(31,86,115,0.025) 32px);
}

/* ===== 頁首 ===== */
.site-header {
  background: var(--ink);
  color: var(--paper);
  padding: 2.4rem 1.5rem 2rem;
  text-align: center;
  border-bottom: 4px solid var(--accent-2);
  position: relative;
}
.site-header .kicker {
  font-size: .78rem; letter-spacing: .55em; text-indent: .55em;
  color: var(--gold); font-weight: 700; margin-bottom: .7rem;
}
.site-header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900; font-size: clamp(1.55rem, 4.2vw, 2.6rem);
  letter-spacing: .05em; line-height: 1.3;
}
.site-header h1 .stamp {
  display: inline-block; border: 2.5px solid var(--accent-2);
  color: var(--accent-2); padding: .05em .3em; border-radius: 6px;
  transform: rotate(-3deg); margin: 0 .15em;
  font-size: .82em; background: rgba(244,241,234,0.06);
}
.site-header .sub {
  margin-top: .8rem; font-size: .88rem; color: #b8bcca; font-weight: 400;
  letter-spacing: .04em;
}

/* ===== 統計列 ===== */
.stat-bar {
  display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;
  background: var(--paper-warm); padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--line);
}
.stat-bar .stat { text-align: center; min-width: 70px; }
.stat-bar .num {
  font-family: 'Noto Serif TC', serif; font-weight: 900;
  font-size: 1.6rem; color: var(--accent-2); line-height: 1;
}
.stat-bar .num.correct { color: var(--green); }
.stat-bar .num.wrong { color: var(--accent); }
.stat-bar .lbl {
  font-size: .7rem; color: var(--ink-soft); letter-spacing: .15em;
  margin-top: .25rem;
}

/* ===== 控制列 ===== */
.controls {
  position: sticky; top: 0; z-index: 50;
  background: rgb(244,241,234);
  border-bottom: 1.5px solid var(--line);
  padding: .85rem 1.5rem;
  box-shadow: 0 3px 14px var(--shadow);
}
.controls-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: .8rem; flex-wrap: wrap;
}
.mode-switch {
  display: flex; border: 2px solid var(--ink); border-radius: 8px;
  overflow: hidden;
}
.mode-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem 1rem; font-size: .85rem; font-weight: 700;
  color: var(--ink); transition: all .18s;
  border-right: 1px solid var(--ink);
}
.mode-switch button:last-child { border-right: none; }
.mode-switch button.active { background: var(--ink); color: var(--paper); }
.mode-switch button:hover:not(.active) { background: rgba(26,31,44,0.08); }

.group-switch {
  display: flex; border: 1.5px solid var(--ink-soft); border-radius: 8px;
  overflow: hidden;
}
.group-switch button {
  font-family: 'Noto Sans TC', sans-serif;
  border: none; background: transparent; cursor: pointer;
  padding: .5rem .85rem; font-size: .82rem; font-weight: 500;
  color: var(--ink-soft); transition: all .18s;
  border-right: 1px solid var(--line);
}
.group-switch button:last-child { border-right: none; }
.group-switch button.active { background: var(--ink-soft); color: var(--paper); }

.search-box {
  flex: 1; min-width: 160px; position: relative;
}
.search-box input {
  width: 100%; font-family: 'Noto Sans TC', sans-serif;
  padding: .5rem .85rem .5rem 2.1rem; font-size: .88rem;
  border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--card); color: var(--ink);
}
.search-box input:focus { outline: 2px solid var(--accent-2); border-color: transparent; }
.search-box::before {
  content: '🔍'; position: absolute; left: .65rem; top: 50%;
  transform: translateY(-50%); font-size: .82rem; opacity: .5;
}

.btn-small {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--ink-soft); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 8px;
  padding: .5rem .85rem; font-size: .8rem; font-weight: 500;
  white-space: nowrap; transition: all .15s;
}
.btn-small:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn-small.danger { border-color: var(--accent); color: var(--accent); }
.btn-small.danger:hover { background: var(--accent); color: var(--paper); border-color: var(--accent); }

/* ===== 篩選晶片 ===== */
.filter-row {
  max-width: 1100px; margin: .7rem auto 0;
  display: flex; gap: .4rem; flex-wrap: wrap;
}
.chip {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 999px;
  padding: .35rem .9rem; font-size: .78rem; font-weight: 500;
  transition: all .15s;
}
.chip:hover { border-color: var(--ink-soft); }
.chip.active {
  background: var(--ink); color: var(--paper);
  border-color: var(--ink); font-weight: 700;
}
.chip .c-count {
  opacity: .65; font-size: .9em; margin-left: .25em;
}

/* ===== 主內容 ===== */
.wrap {
  max-width: 1100px; margin: 1.5rem auto; padding: 0 1.5rem;
}

/* 群組標題 */
.group {
  margin-bottom: 2.5rem;
}
.group-head {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.2rem; margin-bottom: 1.2rem;
  background: linear-gradient(180deg, var(--card), var(--paper-warm));
  border: 1px solid var(--line); border-left: 4px solid var(--accent-2);
  border-radius: 4px;
  flex-wrap: wrap;
}
.group-head .g-badge {
  background: var(--ink); color: var(--paper);
  padding: .25rem .8rem; border-radius: 4px;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1.05rem; letter-spacing: .04em;
}
.group-head .g-title {
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: 1rem; color: var(--ink);
}
.group-head .g-meta {
  margin-left: auto; font-size: .78rem; color: var(--ink-soft);
  text-align: right; line-height: 1.4;
}

/* ===== 題目卡片 ===== */
.q-list {
  display: grid; gap: 1rem;
}
.q-card {
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.q-card:hover { border-color: var(--ink-soft); }
.q-card.answered.correct { border-left: 4px solid var(--green); }
.q-card.answered.wrong { border-left: 4px solid var(--accent); }
.q-card.bookmarked { box-shadow: 0 0 0 1.5px var(--gold) inset; }

.q-head {
  padding: .9rem 1.1rem;
  display: flex; align-items: flex-start; gap: .9rem;
  border-bottom: 1px solid var(--line);
}
.q-no {
  flex-shrink: 0;
  width: 2.3rem; height: 2.3rem;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: .95rem; border-radius: 4px;
}
.q-card.answered.correct .q-no { background: var(--green); }
.q-card.answered.wrong .q-no { background: var(--accent); }

.q-headmain { flex: 1; min-width: 0; }
.q-text {
  font-size: .98rem; color: var(--ink); line-height: 1.65;
  white-space: pre-wrap; word-break: break-word;
}
.q-text code, .q-stem-code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--paper-warm); padding: .05em .35em;
  border-radius: 3px; font-size: .92em;
}

.q-tags {
  margin-top: .6rem;
  display: flex; flex-wrap: wrap; gap: .35rem;
}
.tag {
  font-size: .68rem; padding: .15rem .55rem;
  border-radius: 99px; letter-spacing: .04em;
  font-weight: 500; line-height: 1.5;
}
.tag-topic { color: #fff; font-weight: 700; }
.t-arch  .tag-topic { background: var(--t-arch); }
.t-os    .tag-topic { background: var(--t-os); }
.t-ds    .tag-topic { background: var(--t-ds); }
.t-prog  .tag-topic { background: var(--t-prog); }
.t-net   .tag-topic { background: var(--t-net); }
.t-tcpip .tag-topic { background: var(--t-tcpip); }
.t-wire  .tag-topic { background: var(--t-wire); }
.t-sec   .tag-topic { background: var(--t-sec); }
.t-misc  .tag-topic { background: var(--t-misc); }

.tag-year {
  background: var(--paper-warm); color: var(--ink-soft);
  border: 1px solid var(--line);
}
.tag-no {
  background: transparent; color: var(--ink-soft);
  border: 1px dashed var(--line);
}
.tag-multi {
  background: var(--accent); color: var(--paper);
  border: 1px solid var(--accent);
  font-weight: 700;
}
.submit-btn {
  background: var(--accent-2); color: var(--paper);
  border: none; padding: .45rem 1.1rem;
  font-family: 'Noto Sans TC', sans-serif;
  font-weight: 700; font-size: .82rem;
  border-radius: 4px; cursor: pointer;
  letter-spacing: .06em;
  transition: background .15s;
}
.submit-btn:hover:not(:disabled) { background: var(--ink); }
.submit-btn:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }

.q-bookmark {
  flex-shrink: 0;
  font-size: 1.4rem; line-height: 1;
  background: none; border: none; cursor: pointer;
  color: var(--line); padding: 0; transition: color .15s, transform .15s;
}
.q-bookmark:hover { transform: scale(1.15); }
.q-bookmark.on { color: var(--gold); }

/* ===== 選項 ===== */
.q-body { padding: 1rem 1.1rem; }
.options {
  display: grid; gap: .55rem;
}
.opt {
  display: flex; align-items: flex-start; gap: .7rem;
  padding: .7rem .9rem;
  border: 1.5px solid var(--line); border-radius: 5px;
  background: var(--card); cursor: pointer;
  transition: all .15s;
  font-size: .92rem; line-height: 1.55;
}
.opt:hover { background: var(--paper-warm); border-color: var(--ink-soft); }
.opt .opt-letter {
  flex-shrink: 0;
  width: 1.5rem; height: 1.5rem; border-radius: 50%;
  background: var(--paper-warm); color: var(--ink-soft);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: .85rem;
  border: 1.5px solid var(--line);
}
.opt .opt-text {
  flex: 1; white-space: pre-wrap; word-break: break-word;
}
.opt.user-selected {
  border-color: var(--accent-2); background: rgba(31,86,115,0.06);
}
.opt.user-selected .opt-letter {
  background: var(--accent-2); color: #fff; border-color: var(--accent-2);
}
/* 答案揭曉後 */
.q-card.revealed .opt { cursor: default; }
.q-card.revealed .opt.correct {
  border-color: var(--green); background: rgba(45,106,79,0.08);
}
.q-card.revealed .opt.correct .opt-letter {
  background: var(--green); color: #fff; border-color: var(--green);
}
.q-card.revealed .opt.user-selected.wrong {
  border-color: var(--accent); background: rgba(138,51,36,0.07);
}
.q-card.revealed .opt.user-selected.wrong .opt-letter {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.q-card.revealed .opt:hover { background: var(--card); }
.q-card.revealed .opt.correct:hover { background: rgba(45,106,79,0.08); }

/* 提示「正確答案」徽章 */
.correct-mark, .wrong-mark {
  margin-left: auto; flex-shrink: 0;
  font-size: .72rem; padding: .1rem .5rem;
  border-radius: 3px; font-weight: 700;
  letter-spacing: .05em;
}
.correct-mark { background: var(--green); color: #fff; }
.wrong-mark { background: var(--accent); color: #fff; }

/* ===== 解析區 ===== */
.explain {
  margin-top: .9rem; padding: .9rem 1rem;
  border: 1px dashed var(--accent-2);
  background: rgba(31,86,115,0.04);
  border-radius: 4px;
  font-size: .9rem; line-height: 1.7;
  color: var(--ink);
}
.explain-label {
  display: inline-block;
  font-family: 'Noto Serif TC', serif; font-weight: 700;
  font-size: .75rem; letter-spacing: .15em;
  background: var(--accent-2); color: #fff;
  padding: .1rem .5rem; border-radius: 3px; margin-bottom: .55rem;
}
.explain strong { color: var(--accent-2); }
.explain code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--paper-warm); padding: .05em .35em;
  border-radius: 3px; font-size: .92em;
}
.explain p { margin: .35rem 0; }
.explain ul { margin: .35rem 0 .35rem 1.25rem; }
.explain li { margin: .15rem 0; }

/* ===== 動作按鈕（每題下方） ===== */
.q-actions {
  margin-top: .9rem; display: flex; gap: .5rem; flex-wrap: wrap;
}
.q-actions button {
  font-family: 'Noto Sans TC', sans-serif;
  border: 1.5px solid var(--line); background: var(--card);
  color: var(--ink-soft); cursor: pointer; border-radius: 5px;
  padding: .35rem .8rem; font-size: .8rem; font-weight: 500;
  transition: all .15s;
}
.q-actions button:hover { background: var(--ink-soft); color: var(--paper); border-color: var(--ink-soft); }
.q-actions button.reveal-btn { border-color: var(--accent-2); color: var(--accent-2); }
.q-actions button.reveal-btn:hover { background: var(--accent-2); color: #fff; }

/* ===== 空狀態 ===== */
.empty {
  text-align: center; padding: 4rem 1.5rem; color: var(--ink-soft);
}
.empty .big { font-size: 3rem; margin-bottom: .8rem; opacity: .35; }

/* ===== 回頂部 ===== */
.to-top {
  position: fixed; right: 1.2rem; bottom: 1.2rem; z-index: 100;
  width: 2.6rem; height: 2.6rem; border: none;
  border-radius: 50%; background: var(--ink); color: var(--paper);
  font-size: 1.1rem; cursor: pointer;
  box-shadow: 0 4px 12px var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.to-top.show { opacity: 1; pointer-events: auto; }
.to-top:hover { background: var(--accent-2); }

/* ===== 頁尾 ===== */
.site-footer {
  margin-top: 3rem; padding: 2rem 1.5rem 1.5rem;
  background: var(--ink); color: #b8bcca;
  text-align: center; font-size: .82rem;
}
.site-footer p { margin: .3rem 0; }
.site-footer strong { color: var(--paper); }

/* ===== 響應式 ===== */
@media (max-width: 640px) {
  .site-header { padding: 1.8rem 1rem 1.5rem; }
  .stat-bar { gap: 1.2rem; padding: .8rem 1rem; }
  .stat-bar .num { font-size: 1.3rem; }
  .controls { padding: .7rem .9rem; }
  .controls-inner { gap: .5rem; }
  .filter-row { gap: .3rem; }
  .chip { padding: .3rem .7rem; font-size: .73rem; }
  .wrap { padding: 0 .8rem; margin: 1rem auto; }
  .group-head { padding: .8rem 1rem; }
  .group-head .g-meta { margin-left: 0; text-align: left; font-size: .72rem; }
  .q-head { padding: .75rem .85rem; gap: .6rem; }
  .q-no { width: 2rem; height: 2rem; font-size: .85rem; }
  .q-text { font-size: .92rem; }
  .q-body { padding: .85rem; }
  .opt { padding: .6rem .75rem; font-size: .88rem; }
}

/* ===== 搜尋強化 / 跳轉面板（新增） ===== */
.search-box input { padding-right: 2.2rem; }
.search-clear {
  position: absolute; right: .35rem; top: 50%; transform: translateY(-50%);
  border: none; background: transparent; color: var(--ink-soft);
  font-size: 1.05rem; line-height: 1; cursor: pointer;
  padding: .25rem .45rem; border-radius: 50%; display: none;
}
.search-clear.show { display: block; }
.search-clear:hover { background: var(--paper-warm); }
.search-info {
  max-width: 1100px; margin: .55rem auto 0;
  font-size: .8rem; color: var(--ink-soft); display: none;
}
.search-info.show { display: block; }
.search-info b { color: var(--accent); }
mark.hl {
  background: rgba(255, 208, 70, .6); color: inherit;
  padding: 0 .06em; border-radius: 2px;
}

.jump-fab {
  position: fixed; right: 1.2rem; bottom: 4.3rem; z-index: 90;
  height: 2.6rem; padding: 0 1rem; border: none; border-radius: 999px;
  background: var(--accent-2); color: #fff; cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; font-size: .88rem; font-weight: 700;
  box-shadow: 0 4px 12px var(--shadow); display: none;
}
.jump-fab.show { display: block; }
.jump-fab:hover { background: var(--ink); }
.jump-panel {
  position: fixed; right: 1.2rem; bottom: calc(4.3rem + 3.2rem); z-index: 95;
  width: min(360px, calc(100vw - 2.4rem)); max-height: 60vh; overflow: auto;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(40,32,20,.25);
}
.jump-panel[hidden] { display: none; }
.jump-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: .7rem .9rem; border-bottom: 1px solid var(--line);
  font-family: 'Noto Serif TC', serif; font-weight: 700; color: var(--ink);
  position: sticky; top: 0; background: var(--card);
}
.jump-head button {
  border: none; background: transparent; cursor: pointer;
  font-size: 1rem; color: var(--ink-soft);
}
.jump-grid {
  display: grid; gap: .45rem; padding: .8rem;
  grid-template-columns: repeat(auto-fill, minmax(4.6rem, 1fr));
}
.jump-item {
  display: flex; flex-direction: column; align-items: center; gap: .1rem;
  padding: .45rem .3rem; border: 1.5px solid var(--line); border-radius: 8px;
  background: var(--paper); color: var(--ink); cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; line-height: 1.25;
}
.jump-item b { font-size: .95rem; }
.jump-item small { font-size: .68rem; color: var(--ink-soft); }
.jump-item:hover { border-color: var(--accent-2); background: #fff; }
.jump-item.on { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
.jump-item.done small { color: #2d6a4f; font-weight: 700; }
.jump-foot {
  display: flex; gap: .5rem; padding: 0 .8rem .8rem;
}
.jump-foot button {
  flex: 1; padding: .45rem; border: 1.5px solid var(--ink-soft); border-radius: 8px;
  background: var(--card); color: var(--ink-soft); cursor: pointer;
  font-family: 'Noto Sans TC', sans-serif; font-size: .8rem;
}
.jump-foot button:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* ===== 年度群組可收合（新增） ===== */
.group.collapsible { margin-bottom: 2rem; }
.group.collapsible:not(.open) { margin-bottom: .7rem; }
.group.collapsible > .group-head { cursor: pointer; user-select: none; }
.group.collapsible:not(.open) > .group-head { margin-bottom: 0; }
.group.collapsible > .group-head:hover { border-left-color: var(--accent); }
.g-chev {
  color: var(--ink-soft); font-size: .9rem; width: 1rem; text-align: center;
  transition: transform .18s;
}
.group.open > .group-head .g-chev { transform: rotate(90deg); }
</style>

/* === Markdown 渲染（極簡） === */
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderInline(s) {
  // **粗體**, `code`, <br>
  let out = escapeHtml(s)
    .replace(/&lt;br&gt;/g, '<br>')
    .replace(/&lt;strong&gt;/g, '<strong>').replace(/&lt;\/strong&gt;/g, '</strong>')
    .replace(/&lt;code&gt;/g, '<code>').replace(/&lt;\/code&gt;/g, '</code>')
    .replace(/&lt;(\/?)(sub|sup)&gt;/g, '<$1$2>');
  out = out.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  return out;
}


/* ============================================================
   搜尋 / 跳轉 / 換行 共用工具（新增）
   ============================================================ */
const BREAK_AT_PERIOD = true;   // 解析遇到「。」自動換行；不想要就改成 false

/* 全形→半形、英文轉小寫；逐字處理，確保處理後長度不變（highlight 才對得準） */
function normText(s) {
  let out = '';
  for (const ch of String(s)) {
    const n = ch.normalize('NFKC').toLowerCase();
    out += (n.length === ch.length) ? n : ch;
  }
  return out;
}
function parseTerms(raw) {
  return [...new Set(normText(raw).split(/\s+/).filter(Boolean))];
}
/* 去掉資料裡用來排版的 HTML 標籤，避免搜 "br"、"code"、"strong" 時誤中 */
function stripTags(s) {
  return String(s == null ? '' : s)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?(?:strong|code|sub|sup|u|em|b|i)\s*>/gi, '');
}
/* 每個關鍵字都必須出現（AND）；總分 = 各關鍵字命中的最高權重欄位之和 */
function scoreFields(terms, fields) {
  let total = 0;
  for (const term of terms) {
    let best = 0;
    for (const f of fields) if (f.w > best && f.t.includes(term)) best = f.w;
    if (!best) return 0;
    total += best;
  }
  return total;
}
/* 在已渲染的 DOM 文字節點上標黃（不動 HTML 結構） */
function highlightIn(root, terms) {
  if (!root || !terms.length) return;
  const nodes = [];
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    if (!n.nodeValue.trim()) continue;
    const p = n.parentNode;
    if (p && p.closest && p.closest('svg, button, mark')) continue;
    nodes.push(n);
  }
  nodes.forEach(node => {
    const text = node.nodeValue, low = normText(text);
    const ranges = [];
    terms.forEach(t => {
      let i = low.indexOf(t);
      while (i !== -1) { ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); }
    });
    if (!ranges.length) return;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [ranges[0].slice()];
    for (let k = 1; k < ranges.length; k++) {
      const last = merged[merged.length - 1];
      if (ranges[k][0] <= last[1]) last[1] = Math.max(last[1], ranges[k][1]);
      else merged.push(ranges[k].slice());
    }
    const frag = document.createDocumentFragment();
    let pos = 0;
    merged.forEach(([s, e]) => {
      if (s > pos) frag.appendChild(document.createTextNode(text.slice(pos, s)));
      const m = document.createElement('mark');
      m.className = 'hl';
      m.textContent = text.slice(s, e);
      frag.appendChild(m);
      pos = e;
    });
    if (pos < text.length) frag.appendChild(document.createTextNode(text.slice(pos)));
    node.parentNode.replaceChild(frag, node);
  });
}

/* 解析換行：遇到「。」就換行（已有 <br>、句尾、或後面接」』）” 的不重複換） */
function breakSentences(s) {
  if (!BREAK_AT_PERIOD) return s;
  return String(s).replace(
    /。(?!(?:<\/[a-z]+>)*(?:\s*<br\s*\/?>|\s*$|[」』）)”"']))/gi,
    '。<br>'
  );
}

/* === 搜尋欄位索引 === */
function searchFields(q, withExplain) {
  const ix = q._ix || (q._ix = {
    stem: normText(stripTags(q.stem)),
    opts: normText(q.options.map(stripTags).join('\n')),
    exp:  normText(stripTags(q.explain || '')),
    meta: normText(q.year + ' ' + q.year + '年 第' + q.no + '題 ' +
                   ((TOPIC_INFO[q.topic] || {}).name || '') + (q.type === 'multi' ? ' 複選題' : ''))
  });
  const f = [{ t: ix.stem, w: 10 }, { t: ix.opts, w: 6 }, { t: ix.meta, w: 1 }];
  if (withExplain) f.push({ t: ix.exp, w: 3 });
  return f;
}

/* === 篩選 === */
function filterQuestions() {
  let list = ALL_Q.slice();

  // 模式
  if (state.mode === 'wrong') {
    list = list.filter(q => progress.answers[q.id] && !q.allCorrect && progress.answers[q.id] !== q.answer && progress.answers[q.id] !== q.altAnswer);
  } else if (state.mode === 'bookmark') {
    list = list.filter(q => progress.bookmarks[q.id]);
  }

  // 主題
  if (state.topicFilter !== 'all') {
    list = list.filter(q => q.topic === state.topicFilter);
  }

  // 搜尋：多關鍵字 AND、全形半形統一、去除 HTML 標籤、依相關度排序
  if (state.terms.length) {
    const withExplain = state.mode === 'review' || state.mode === 'wrong';
    return list
      .map((q, i) => ({ q, i, s: scoreFields(state.terms, searchFields(q, withExplain)) }))
      .filter(x => x.s > 0)
      .sort((a, b) => b.s - a.s || a.i - b.i)
      .map(x => x.q);
  }

  // 隨機
  if (state.shuffled) {
    list = shuffleArray(list, state.shuffleSeed);
  }

  return list;
}

function shuffleArray(arr, seed) {
  // 簡易確定性洗牌（Fisher-Yates with seeded random）
  const a = arr.slice();
  let s = seed || 1;
  const rng = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderQuestion(q) {

    ? (userAns && [...userAns].sort().join('') === [...(q.answer||'')].sort().join(''))
    : (userAns === q.answer || (q.altAnswer && userAns === q.altAnswer)));
  const isViewed = !!(progress.viewed && progress.viewed[q.id]);
  // 在「閱讀模式」或「錯題複習」中預設揭曉答案
  const forceReveal = state.mode === 'review' || state.mode === 'wrong';
  const revealed = forceReveal || isAnswered || isViewed;

  let cls = 'q-card ' + t.cls;
  if (revealed && isAnswered) cls += ' answered ' + (isCorrect ? 'correct' : 'wrong');
  if (revealed) cls += ' revealed';
  if (isBookmarked) cls += ' bookmarked';

  // 選項
  const letters = 'ABCDE';
  const isMulti = q.type === 'multi';
  // 多選題：userAns 為排序後的字串如 "ABC"；單選為單一字母
  const userSet = new Set((userAns || '').split(''));
  // 進行中（尚未提交）的多選暫存
  if (isMulti && !progress.pending) progress.pending = {};
  const pendingSet = isMulti ? new Set(((progress.pending && progress.pending[q.id]) || '').split('').filter(Boolean)) : null;
  const correctSet = new Set((q.answer || '').split(''));
  if (q.altAnswer) correctSet.add(q.altAnswer);

  const optsHtml = q.options.map((opt, idx) => {
    const letter = letters[idx];
    let oCls = 'opt';
    if (isMulti) {
      // 多選：揭曉前看 pending；揭曉後看 userAns
      if (!revealed && pendingSet.has(letter)) oCls += ' user-selected';
      if (revealed && userSet.has(letter)) oCls += ' user-selected';
    } else {
      if (userAns === letter) oCls += ' user-selected';
    }
    if (revealed) {
      if (correctSet.has(letter)) oCls += ' correct';
      if (!q.allCorrect) {
        if (isMulti) {
          if (userSet.has(letter) && !correctSet.has(letter)) oCls += ' wrong';
        } else {
          if (userAns === letter && !correctSet.has(letter)) oCls += ' wrong';
        }
      } else if (userAns === letter && letter !== q.answer) {
        oCls += ' correct';
      }
    }
    let mark = '';
    if (revealed && correctSet.has(letter)) mark = '<span class="correct-mark">正解</span>';
    else if (revealed && q.allCorrect && userAns === letter && letter !== q.answer) mark = '<span class="correct-mark">送分</span>';
    else if (revealed && !q.allCorrect && !isMulti && userAns === letter && !correctSet.has(letter)) mark = '<span class="wrong-mark">你的選擇</span>';
    else if (revealed && !q.allCorrect && isMulti && userSet.has(letter) && !correctSet.has(letter)) mark = '<span class="wrong-mark">你的選擇</span>';
    return `<div class="${oCls}" onclick="selectAnswer('${q.id}','${letter}')">
      <div class="opt-letter">${letter}</div>
      <div class="opt-text">${renderInline(opt)}</div>
      ${mark}
    </div>`;
  }).join('');

  // 解析
  let explainHtml = '';
  if (revealed && q.explain) {
    explainHtml = `<div class="explain">
      <span class="explain-label">解析</span>
      <div>${renderInline(breakSentences(q.explain))}</div>
    </div>`;
  }

  // 動作按鈕
  let actionsHtml = '<div class="q-actions">';
  if (!revealed) {
    if (isMulti) {
      const hasPending = pendingSet && pendingSet.size > 0;
      actionsHtml += `<button class="submit-btn" onclick="submitMultiAnswer('${q.id}')" ${hasPending ? '' : 'disabled'}>送出答案（已選 ${pendingSet ? pendingSet.size : 0} 項）</button>`;
    }
    actionsHtml += `<button class="reveal-btn" onclick="revealAnswer('${q.id}')">看答案</button>`;
  } else if (!forceReveal) {
    actionsHtml += `<button onclick="resetQuestion('${q.id}')">重新作答</button>`;
  }
  actionsHtml += '</div>';

  return `<div class="${cls}" id="q-${q.id}">
    <div class="q-head">
      <div class="q-no">${q.no}</div>
      <div class="q-headmain">
        <div class="q-text">${renderInline(q.stem)}</div>
        ${q.figure ? `<div class="q-figure" style="margin-top:.6rem">${q.figure}</div>` : ''}
        <div class="q-tags">
          <span class="tag tag-topic">${t.name}</span>
          <span class="tag tag-year">${q.year} 年</span>
          <span class="tag tag-no">第 ${q.no} 題</span>
          ${isMulti ? '<span class="tag tag-multi">複選題</span>' : ''}
        </div>
      </div>
      <button class="q-bookmark ${isBookmarked ? 'on' : ''}"
              title="${isBookmarked ? '取消收藏' : '加入收藏'}"
              onclick="toggleBookmark('${q.id}')">${isBookmarked ? '★' : '☆'}</button>
    </div>
    <div class="q-body">
      <div class="options">${optsHtml}</div>
      ${explainHtml}
      ${actionsHtml}
    </div>
  </div>`;
}

/* === 主渲染 === */
let GROUP_QS = {};

function updateSearchInfo(count) {
  const el = document.getElementById('searchInfo');
  if (!state.terms.length) { el.classList.remove('show'); el.innerHTML = ''; return; }
  let h = `找到 <b>${count}</b> 題 ‧ 依相關度排序`;
  if (state.mode !== 'review' && state.mode !== 'wrong') {
    h += ' ‧ 目前只搜尋題幹與選項（切到「閱讀模式」可一併搜尋解析）';
  }
  el.innerHTML = h;
  el.classList.add('show');
}

function groupHtml(key, badge, title, meta, qs, open) {
  GROUP_QS[key] = qs;
  return `<div class="group collapsible${open ? ' open' : ''}" id="g-${key}" data-key="${key}">
    <div class="group-head" onclick="toggleGroup('${key}')" role="button" tabindex="0"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleGroup('${key}')}">
      <span class="g-chev" aria-hidden="true">▸</span>
      <span class="g-badge">${badge}</span>
      <span class="g-title">${title}</span>
      <span class="g-meta">${meta}</span>
    </div>
    ${open ? `<div class="q-list">${qs.map(renderQuestion).join('')}</div>` : ''}
  </div>`;
}

function render() {
  const list = filterQuestions();
  const wrap = document.getElementById('content');
  const searching = state.terms.length > 0;
  GROUP_QS = {};
  JUMP_ITEMS = [];
  updateSearchInfo(list.length);

  if (list.length === 0) {
    let msg = '找不到符合條件的題目';
    if (searching) msg = `找不到符合「${escapeHtml(state.search)}」的題目。可改用較短的關鍵字；多個關鍵字請用空格分開。`;
    else if (state.mode === 'wrong') msg = '尚未有答錯的題目，繼續加油 👍';
    else if (state.mode === 'bookmark') msg = '尚未收藏任何題目（點題目右上角 ☆ 即可收藏）';
    wrap.innerHTML = `<div class="empty"><div class="big">📭</div><p>${msg}</p></div>`;
    updateStatBar();
    buildJump();
    return;
  }

  let html = '';
  if (searching) {
    // 搜尋結果：不分組、依相關度排序、全部展開
    html += `<div class="group open">
      <div class="group-head">
        <span class="g-badge">搜尋</span>
        <span class="g-title">依相關度排序</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      <div class="q-list">${list.map(renderQuestion).join('')}</div>
    </div>`;
  } else if (state.shuffled) {
    // 隨機排序時不分組，全部列出
    html += `<div class="group">
      <div class="group-head">
        <span class="g-badge">隨機</span>
        <span class="g-title">已隨機打散全部題目</span>
        <span class="g-meta">共 ${list.length} 題</span>
      </div>
      <div class="q-list">${list.map(renderQuestion).join('')}</div>
    </div>`;
  } else if (state.group === 'year') {
    JUMP_TITLE = '跳到年度';
    const byYear = {};
    list.forEach(q => { (byYear[q.year] = byYear[q.year] || []).push(q); });
    const years = Object.keys(byYear).sort((a, b) => Number(b) - Number(a));
    years.forEach(yr => {
      const qs = byYear[yr];
      qs.sort((a, b) => a.no - b.no);
      const s = computeStats(qs);
      const key = 'y' + yr;
      const open = state.openGroups.has(key);
      JUMP_ITEMS.push({ key, label: yr, sub: `${s.answered}/${qs.length}`,
                        done: s.answered === qs.length, open });
      html += groupHtml(key, `${yr} 年`, '模擬卷 D ‧ 計算機原理＋網路概論',
        `本年共 ${qs.length} 題<br>已答 ${s.answered} ‧ 對 ${s.correct} ‧ 錯 ${s.wrong}`, qs, open);
    });
  } else {
    JUMP_TITLE = '跳到主題';
    const byTopic = {};
    list.forEach(q => { (byTopic[q.topic] = byTopic[q.topic] || []).push(q); });
    Object.keys(TOPIC_INFO).forEach(tk => {
      const qs = byTopic[tk];
      if (!qs || qs.length === 0) return;
      qs.sort((a, b) => Number(b.year) - Number(a.year) || a.no - b.no);
      const t = TOPIC_INFO[tk];
      const s = computeStats(qs);
      const key = 't' + tk;
      const open = state.openGroups.has(key);
      JUMP_ITEMS.push({ key, label: t.name, sub: `${s.answered}/${qs.length}`,
                        done: s.answered === qs.length, open });
      html += groupHtml(key, t.name, '歷年同類考題',
        `共 ${qs.length} 題 ‧ 跨 ${new Set(qs.map(q => q.year)).size} 年度<br>已答 ${s.answered} ‧ 對 ${s.correct} ‧ 錯 ${s.wrong}`,
        qs, open);
    });
  }

  wrap.innerHTML = html;
  if (searching) highlightIn(wrap, state.terms);
  updateStatBar();
  buildJump();
}

/* === 群組收合 / 跳轉 === */
function toggleGroup(key) {
  const el = document.getElementById('g-' + key);
  if (!el) return;
  const open = !el.classList.contains('open');
  if (open) state.openGroups.add(key); else state.openGroups.delete(key);
  el.classList.toggle('open', open);
  const old = el.querySelector(':scope > .q-list');
  if (open && !old) {
    el.insertAdjacentHTML('beforeend',
      `<div class="q-list">${(GROUP_QS[key] || []).map(renderQuestion).join('')}</div>`);
  } else if (!open && old) {
    old.remove();                              // 收合時移除 DOM，保持頁面輕量
  }
  const it = JUMP_ITEMS.find(x => x.key === key);
  if (it) { it.open = open; buildJump(); }
}
function jumpTo(key) {
  toggleJump(false);
  state.openGroups = new Set([key]);           // 只展開目標，其餘收合，位置才好預測
  render();
  scrollToGroup(key);
}
function expandAllGroups(open) {
  state.openGroups = open ? new Set(JUMP_ITEMS.map(i => i.key)) : new Set();
  render();
}
/* 錯題複習 / 已收藏：清單本來就是篩過的，直接全部展開 */
function autoOpenFiltered() {
  if (state.mode !== 'wrong' && state.mode !== 'bookmark') return;
  state.openGroups = new Set(filterQuestions().map(q => state.group === 'topic' ? 't' + q.topic : 'y' + q.year));
}

/* === 互動 === */
function selectAnswer(qid, letter) {
  const q = ALL_Q.find(x => x.id === qid);
  if (!q) return;
  // 閱讀模式不允許作答
  if (state.mode === 'review') return;
  // 已作答則忽略點擊（除非按重新作答）
  if (progress.answers[qid]) return;

  if (q.type === 'multi') {
    // 多選：切換選取狀態，暫存在 progress.pending
    if (!progress.pending) progress.pending = {};
    const cur = new Set((progress.pending[qid] || '').split('').filter(Boolean));
    if (cur.has(letter)) cur.delete(letter);
    else cur.add(letter);
    progress.pending[qid] = [...cur].sort().join('');
    saveProgress();
    render();
    const el = document.getElementById('q-' + qid);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    return;
  }

  progress.answers[qid] = letter;
  saveProgress();
  render();
  // 滾動到該題保持視野
  const el = document.getElementById('q-' + qid);
  if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function submitMultiAnswer(qid) {
  const q = ALL_Q.find(x => x.id === qid);
  if (!q || q.type !== 'multi') return;
  if (!progress.pending) progress.pending = {};
  const ans = progress.pending[qid] || '';
  if (!ans) { alert('請先至少選擇一個選項'); return; }
  progress.answers[qid] = ans;
  delete progress.pending[qid];
  saveProgress();
  render();
}

function revealAnswer(qid) {
  if (!progress.viewed) progress.viewed = {};
  progress.viewed[qid] = true;
  saveProgress();
  render();
}

function resetQuestion(qid) {
  delete progress.answers[qid];
  if (progress.viewed) delete progress.viewed[qid];
  if (progress.pending) delete progress.pending[qid];
  saveProgress();
  render();
}

function toggleBookmark(qid) {
  if (progress.bookmarks[qid]) delete progress.bookmarks[qid];
  else progress.bookmarks[qid] = true;
  saveProgress();
  render();
}

function setMode(mode) {
  state.mode = mode;
  state.shuffled = false;
  document.querySelectorAll('.mode-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  autoOpenFiltered();
  render();
}
function setGroup(g) {
  state.group = g;
  state.shuffled = false;
  document.querySelectorAll('.group-switch button').forEach(b => {
    b.classList.toggle('active', b.dataset.group === g);
  });
  autoOpenFiltered();
  render();
}
function setTopicFilter(topic) {
  state.topicFilter = topic;
  document.querySelectorAll('.chip').forEach(c => {
    c.classList.toggle('active', c.dataset.topic === topic);
  });
  render();
}
function shuffleQuestions() {
  state.shuffled = !state.shuffled;
  state.shuffleSeed = Date.now() % 100000;
  render();
}
function resetProgress() {
  if (!confirm('確定要清除所有作答進度（包含答題紀錄與收藏）？此動作無法復原。')) return;
  progress = { answers: {}, bookmarks: {} };
  saveProgress();
  render();
}

/* 重建主題篩選晶片（計算各主題題數） */
function rebuildTopicChips() {
  const filterRow = document.getElementById('filterRow');
  const scope = ALL_Q;
  const topicCount = {};
  scope.forEach(q => topicCount[q.topic] = (topicCount[q.topic] || 0) + 1);
  let chips = `<button class="chip ${state.topicFilter === 'all' ? 'active' : ''}" data-topic="all"
    onclick="setTopicFilter('all')">全部<span class="c-count">${scope.length}</span></button>`;
  Object.keys(TOPIC_INFO).forEach(tk => {
    const cnt = topicCount[tk] || 0;
    if (cnt === 0) return;
    chips += `<button class="chip ${state.topicFilter === tk ? 'active' : ''}" data-topic="${tk}"
      onclick="setTopicFilter('${tk}')">${TOPIC_INFO[tk].name}<span class="c-count">${cnt}</span></button>`;
  });
  filterRow.innerHTML = chips;
}

/* === 初始化 === */
function init() {
  rebuildTopicChips();

  bindSearch();

  // 回頂部
  const toTop = document.getElementById('toTop');
  window.addEventListener('scroll', () => {
    toTop.classList.toggle('show', window.scrollY > 600);
  });

  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
